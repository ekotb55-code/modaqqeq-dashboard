<style>body{font-family:system-ui,Tahoma,sans-serif;background:#F4F6FA;margin:0;padding:30px;text-align:center;color:#1B2A41}

<body><img src="/modaqqeq-dashboard/logo_wide.png" alt="" style="height:54px"><h2>كود سيرفر صور الأصناف</h2>
<button id="b">📋 انسخ الكود</button><div id="ok"></div><textarea id="t" readonly></textarea>
<script>const CODE="// =====================================================================\n// ===== سيرفر تطبيق صور الأصناف (سكريبت لوحده على حساب ekotb555) =====\n// ليه لوحده: جوجل بتدي كل حساب حد يومي للطلبات اللي بتطلع برّه (حوالي 20 ألف).\n// الصور كانت بتاكل رصيد سكريبت \"دليل الموظفين\" فبيقف سحب الكميات والإشعارات وغيرهم.\n// دلوقتي الصور ليها رصيدها هنا، ومحدش يقف بسبب التاني.\n//\n// - بيقرا من شيت \"دليل الموظفين\" (من غير ما يكتب فيه): الموظفين + تطبيق الصور + ربط برامج البيع.\n// - بيكتب في شيت \"مدقق - صور الأصناف\" بس (تاب لكل فرع + سجل الصور).\n// - الشيتين لازم يبقوا متشاركين مع صاحب السكريبت كـ \"محرر\".\n// - النشر: تطبيق ويب ← التنفيذ: أنا ← مين يدخل: أي حد.\n// - أول مرة: شغّل setupItemImages من المحرر (بتتأكد إن كل حاجة شايفاها).\n// - الرصيد: التجهيز في الخلفية بيقف لما الطلبات توصل II_SCAN_LIMIT في اليوم (بيكمل بكرة لوحده)،\n//   وفتح صور الأصناف اللي على الشاشة وحفظ الصور بيفضلوا شغالين لحد II_DAY_LIMIT.\n// =====================================================================\nconst II_DIR_ID = '1RCOiGnylrzjxBqrY0f0U0ZgIjbzbzJkLgTK9S5xpdVE';   // شيت دليل الموظفين\nconst II_CACHE_ID = '1O6F3-4Fy-5ZiOK4H_D2V3ERJ-RVIu6Ffv9cmkMvRJJ0'; // شيت مدقق - صور الأصناف\nconst II_TAB = 'تطبيق الصور';\nconst II_LOG = 'سجل الصور';\nconst II_SS_PROP = 'II_CACHE_SS';\nconst II_COLS = ['رقم الصنف', 'اسم الصنف', 'الباركود', 'التصنيف', 'الصورة', 'آخر ظهور'];\nconst II_NONE = '-'; // الصنف مالوش صورة في البرنامج\n// الصورة ممكن تبقى في فولدر المحل (upload/41243/x.jpg) أو في فولدر الرفع على طول (upload/x.png)\nconst II_IMG_RE = /upload\\/(?:\\d+\\/)?[^\"'\\s<>\\/]+\\.(?:jpe?g|png|webp|gif)/i;\nconst ALL = 'الكل';\nconst SH_USERS = 'الموظفين';\nconst SH_POS_LINKS = 'ربط برامج البيع';\nconst II_SCAN_LIMIT = 15000; // التجهيز في الخلفية بيقف هنا\nconst II_DAY_LIMIT = 19000;  // الصور اللي على الشاشة + الحفظ بيقفوا هنا (حد جوجل حوالي 20 ألف)\nconst II_QUOTA_MSG = 'رصيد السيرفر النهارده خلص - التطبيق هيرجع يشتغل بكرة';\n\n// ---------- استقبال الطلبات ----------\nconst II_ACTIONS = {\n  imgLogin: d => iiLogin_(d),\n  imgItems: d => iiItems_(d),\n  imgScan: d => iiScan_(d),\n  imgFind: d => iiFind_(d),\n  imgSet: d => iiSet_(d),\n  imgPeek: d => iiPeek_(d),\n  ping: () => ({ time: new Date().toISOString(), today: iiCount_() })\n};\nfunction doGet(e) { return iiHandle_(e); }\nfunction doPost(e) { return iiHandle_(e); }\nfunction iiHandle_(e) {\n  let out;\n  try {\n    const p = (e && e.parameter) || {};\n    if (!p.action) return ContentService.createTextOutput('سيرفر صور الأصناف شغال ✓');\n    const data = p.data ? JSON.parse(p.data) : (e.postData && e.postData.contents ? JSON.parse(e.postData.contents) : {});\n    const fn = II_ACTIONS[p.action];\n    if (!fn) throw new Error('طلب مش معروف');\n    out = fn(data) || {};\n    out.ok = true;\n  } catch (err) {\n    const m = String(err && err.message || err);\n    out = { ok: false, error: /too many times|مرات كثيرة|urlfetch|Bandwidth quota/i.test(m) ? II_QUOTA_MSG : m };\n  } finally {\n    iiFlush_();\n  }\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\n}\n\n// ---------- عدّاد الطلبات اليومي ----------\nlet __iiN = 0;\nfunction iiDayKey_() { return 'II_N_' + Utilities.formatDate(new Date(), 'Africa/Cairo', 'yyyy-MM-dd'); }\nfunction iiCount_() { return (Number(PropertiesService.getScriptProperties().getProperty(iiDayKey_())) || 0) + __iiN; }\n// فيه مكان لـ n طلب كمان؟ (hard = الحد الكبير بتاع الشاشة والحفظ، غير كده حد التجهيز)\nfunction iiRoom_(n, hard) { return iiCount_() + (n || 1) <= (hard ? II_DAY_LIMIT : II_SCAN_LIMIT); }\nfunction iiFlush_() {\n  if (!__iiN) return;\n  const lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(5000);\n    const pr = PropertiesService.getScriptProperties(), k = iiDayKey_();\n    pr.setProperty(k, String((Number(pr.getProperty(k)) || 0) + __iiN));\n    __iiN = 0;\n  } catch (e) {} finally { try { lock.releaseLock(); } catch (e) {} }\n}\nfunction iiUF_(url, opt) { __iiN++; return UrlFetchApp.fetch(url, opt || {}); }\nfunction iiUFAll_(reqs) { __iiN += reqs.length; return UrlFetchApp.fetchAll(reqs); }\n// تنضيف العدادات القديمة (بتتنادي من التشغيل اليومي لو اتعمل، ومش ضرورية)\nfunction iiCleanCounters() {\n  const pr = PropertiesService.getScriptProperties(), keep = iiDayKey_();\n  Object.keys(pr.getProperties()).forEach(k => { if (/^II_N_/.test(k) && k !== keep) pr.deleteProperty(k); });\n}\n\n// شغّلها مرة من المحرر: بتعمل تاب الصلاحيات وشيت الصور\n// (بتتأكد إن السكريبت شايف الشيتين - لازم يبقوا متشاركين مع صاحب السكريبت كـ \"محرر\")\nfunction setupItemImages() {\n  Logger.log('شيت الدليل: ' + iiDirSS_().getName() + ' ✓');\n  Logger.log('تاب الصلاحيات: ' + iiAccessSheet_().getName() + ' ✓');\n  Logger.log('ربط برامج البيع: ' + iiLinked_().length + ' فرع مربوط ✓');\n  Logger.log('الموظفين: ' + users_().length + ' سطر ✓');\n  Logger.log('شيت الصور: ' + iiCacheSS_().getName() + ' ✓');\n  Logger.log('الطلبات النهارده: ' + iiCount_() + ' من ' + II_DAY_LIMIT);\n}\n\n// تجربة على صنف واحد (من المحرر): بنحط صورة لصنف مالوش صورة، نتأكد إن مفيش حاجة تانية اتغيرت، ونرجّعه زي ما كان\nconst II_TEST_BRANCH = 'ميت عقبة';\nconst II_TEST_ITEM = '887612';\nfunction testItemImages() {\n  const s = iiSession_(II_TEST_BRANCH);\n  const snap = () => iiParam_(iiFormPayload_(iiFetch_(s, 'items/new_item.php', { method: 'post', payload: { id: II_TEST_ITEM, edit: 'item', store_id: '' } }).getContentText('UTF-8'), null).payload);\n  const start = snap();\n  const logo = iiUF_('https://ekotb55-code.github.io/modaqqeq-dashboard/icon-192.png').getBlob().setContentType('image/png');\n  const r1 = iiSetCore_(II_TEST_BRANCH, 'تجربة من المحرر', II_TEST_ITEM, logo, null);\n  Logger.log('1) الصورة اتحفظت: ' + r1.url + ' | خانات اتغيرت غير الصورة: ' + (r1.changed.length ? r1.changed.join('، ') : 'ولا حاجة ✓'));\n  // الرجوع: نجرب نفس اللي كان مكتوب، ولو البرنامج ما قبلهوش نجرب فاضي\n  let back = null;\n  [r1.oldImg, ''].some(v => {\n    try { back = iiSetCore_(II_TEST_BRANCH, 'تجربة من المحرر (رجوع)', II_TEST_ITEM, null, v); return true; }\n    catch (e) { Logger.log('الرجوع بـ \"' + v + '\" ما نفعش: ' + e.message); return false; }\n  });\n  Logger.log(back ? '2) الصنف رجع من غير صورة | خانات اتغيرت: ' + (back.changed.length ? back.changed.join('، ') : 'ولا حاجة ✓')\n    : '2) الصورة التجريبية لسه على الصنف ' + II_TEST_ITEM + ' (تتغير من التطبيق)');\n  const end = snap();\n  const d = iiDiff_(start, end).concat(start.split('&').filter(x => /^img=/.test(x)).join() !== end.split('&').filter(x => /^img=/.test(x)).join() ? ['img'] : []);\n  Logger.log('3) الصنف كله قبل التجربة وبعدها: ' + (d.length ? 'اختلف في: ' + d.join('، ') : 'زي ما هو بالظبط ✓'));\n}\n\n// تجهيز أصناف فرع من المحرر (بدل ما أول واحد يفتح التطبيق يستنى) - شغّلها لحد ما تقول خلص\nfunction prepareItemImages() {\n  const t0 = Date.now();\n  let p;\n  do { p = iiScanCore_(II_TEST_BRANCH, false); Logger.log(JSON.stringify(p)); } while (!p.finished && Date.now() - t0 < 4.5 * 60 * 1000);\n  Logger.log(p.finished ? 'خلص ✓ ' + p.total + ' صنف، منهم ' + p.withImg + ' بصورة' : 'لسه - شغّلها تاني');\n}\n\n// ---------- الصلاحيات ----------\nfunction iiAccessSheet_() {\n  const sh = iiDirSS_().getSheetByName(II_TAB);\n  if (!sh) throw new Error('تاب \"' + II_TAB + '\" مش موجود في شيت الدليل - كلم الدعم');\n  return sh;\n}\n\n// الفروع المربوطة ببرنامج البيع (من تاب \"ربط برامج البيع\")\nfunction iiLinked_() {\n  const sh = posLinksSheet_();\n  if (sh.getLastRow() < 2) return [];\n  return sh.getRange(2, 1, sh.getLastRow() - 1, 4).getValues()\n    .filter(r => String(r[0]).trim() && posBaseUrl_(r[1]) && String(r[2]).trim() && String(r[3]))\n    .map(r => String(r[0]).trim());\n}\n\n// الدخول: نفس بيانات تاب الموظفين + لازم الاسم موجود في تاب \"تطبيق الصور\"\nfunction iiUser_(d) {\n  const pass = String(d.password || '').trim();\n  if (!String(d.email || '').trim() || !pass) throw new Error('اكتب اسمك (أو الإيميل) وكلمة السر');\n  const everyone = users_();\n  const email = resolveLogin_(d.email, pass, everyone);\n  const me = everyone.filter(u => u.email === email && u.pass === pass);\n  if (!me.length) throw new Error('الاسم (أو الإيميل) أو كلمة السر غلط');\n  if (!me.some(u => u.active)) throw new Error('الحساب ده موقوف - كلم المدير');\n  const keys = [normName_(email)].concat(me.map(u => normName_(u.name)).filter(Boolean));\n  const sh = iiAccessSheet_();\n  const rows = sh.getLastRow() > 1 ? sh.getRange(2, 1, sh.getLastRow() - 1, 3).getValues() : [];\n  const linked = iiLinked_();\n  let all = false;\n  const want = [];\n  rows.forEach(r => {\n    if (keys.indexOf(normName_(r[0])) < 0) return;\n    if (r[2] === false || String(r[2]).toUpperCase() === 'FALSE') return;\n    splitStores_(r[1]).forEach(b => { if (normName_(b) === normName_(ALL)) all = true; else want.push(b); });\n  });\n  if (!all && !want.length) throw new Error('حسابك مالوش صلاحية على تطبيق الصور - كلم المدير');\n  const branches = all ? linked : linked.filter(b => want.some(w => posNormBranch_(w) === posNormBranch_(b)));\n  if (!branches.length) throw new Error('الفرع بتاعك مش مربوط ببرنامج البيع - كلم الدعم');\n  return { name: me[0].name || email, email: email, branches: branches, all: all };\n}\nfunction iiBranch_(d) {\n  const u = iiUser_(d);\n  const b = u.branches.find(x => posNormBranch_(x) === posNormBranch_(d.branch));\n  if (!b) throw new Error('الفرع ده مش من صلاحياتك');\n  return { u: u, branch: b };\n}\n\nfunction iiLogin_(d) {\n  const u = iiUser_(d);\n  return { name: u.name, email: u.email, branches: u.branches };\n}\n\n// ---------- شيت الصور (شيت لوحده، تاب لكل فرع) ----------\nfunction iiCacheSS_() {\n  if (iiCacheSS_.ss) return iiCacheSS_.ss;\n  const id = PropertiesService.getScriptProperties().getProperty(II_SS_PROP) || II_CACHE_ID;\n  try { return (iiCacheSS_.ss = SpreadsheetApp.openById(id)); }\n  catch (e) { throw new Error('السيرفر مش شايف شيت الصور - لازم يتشارك مع صاحب السكريبت كـ \"محرر\"'); }\n}\nfunction iiTabName_(branch) { return String(branch).replace(/[\\[\\]*?:\\\\\\/']/g, ' ').trim().slice(0, 90); }\nfunction iiSheet_(branch) {\n  const ss = iiCacheSS_();\n  let sh = ss.getSheetByName(iiTabName_(branch));\n  if (!sh) {\n    sh = ss.insertSheet(iiTabName_(branch));\n    sh.getRange(1, 1, 1, II_COLS.length).setValues([II_COLS]).setFontWeight('bold');\n    sh.setFrozenRows(1);\n    sh.setRightToLeft(true);\n    sh.getRange('A:C').setNumberFormat('@');\n  }\n  return sh;\n}\n// {sh, rows: [[id,name,code,cat,img,seen]], byId: {id: index}}\nfunction iiRead_(branch) {\n  const sh = iiSheet_(branch), n = sh.getLastRow() - 1;\n  const rows = n > 0 ? sh.getRange(2, 1, n, II_COLS.length).getValues().map(r => r.map(x => String(x == null ? '' : x))) : [];\n  const byId = {}, origE = {};\n  rows.forEach((r, i) => { if (r[0]) { byId[r[0]] = i; origE[r[0]] = r[4]; } });\n  return { sh: sh, rows: rows, byId: byId, origE: origE };\n}\n// بنكتب الجدول كله مرة واحدة - والصورة اللي حد حفظها في نفس الوقت ما تضيعش\nfunction iiWrite_(t) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const n = t.sh.getLastRow() - 1;\n    if (n > 0) {\n      t.sh.getRange(2, 1, n, 5).getValues().forEach(r => {\n        const id = String(r[0]), e = String(r[4] == null ? '' : r[4]), i = t.byId[id];\n        if (i !== undefined && e !== t.origE[id] && t.rows[i] && t.rows[i][0] === id) t.rows[i][4] = e;\n      });\n    }\n    if (t.full && n > t.rows.length) t.sh.getRange(t.rows.length + 2, 1, n - t.rows.length, II_COLS.length).clearContent();\n    if (t.rows.length) t.sh.getRange(2, 1, t.rows.length, II_COLS.length).setValues(t.rows);\n    t.byId = {}; t.origE = {};\n    t.rows.forEach((r, i) => { t.byId[r[0]] = i; t.origE[r[0]] = r[4]; });\n  } finally { lock.releaseLock(); }\n}\n// صورة صنف واحد في الشيت (بعد الحفظ)\nfunction iiSetCell_(branch, id, img) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const sh = iiSheet_(branch), n = sh.getLastRow() - 1;\n    if (n < 1) return;\n    const ids = sh.getRange(2, 1, n, 1).getValues();\n    for (let i = 0; i < ids.length; i++) if (String(ids[i][0]) === String(id)) { sh.getRange(i + 2, 5).setValue(img); return; }\n  } finally { lock.releaseLock(); }\n}\nfunction iiLog_(branch, who, id, name, oldImg, newImg, result, note) {\n  try {\n    const sh = iiCacheSS_().getSheetByName(II_LOG);\n    sh.appendRow([new Date(), branch, who, id, name, oldImg, newImg, result, note || '']);\n  } catch (e) {}\n}\n\n// ---------- الدخول على برنامج الفرع (الجلسة بتتحفظ 20 دقيقة) ----------\nfunction iiKey_(branch) { return 'iijar_' + Utilities.base64EncodeWebSafe(Utilities.newBlob(posNormBranch_(branch)).getBytes()).slice(0, 180); }\n// بيانات ربط الفرع: لو اتسجلت \"مش مربوط\" في الكاش (5 دقايق) نقرا الشيت تاني على طول - علشان الفرع اللي لسه متضاف يشتغل\nfunction iiCfg_(branch) {\n  let cfg = posCfgFromSheet_(branch);\n  if (!cfg) {\n    const b = posNormBranch_(branch);\n    CacheService.getScriptCache().remove('poscfg_' + Utilities.base64EncodeWebSafe(Utilities.newBlob(b).getBytes()).slice(0, 200));\n    cfg = posCfgFromSheet_(branch);\n  }\n  return cfg;\n}\nfunction iiSession_(branch, fresh) {\n  const c = CacheService.getScriptCache(), k = iiKey_(branch);\n  if (!fresh) {\n    try {\n      const jar = JSON.parse(c.get(k) || 'null');\n      const cfg = iiCfg_(branch);\n      if (jar && cfg) return { cfg: cfg, jar: jar, branch: branch };\n    } catch (e) {}\n  }\n  if (!iiCfg_(branch)) throw new Error('الفرع مش مربوط ببرنامج البيع - راجع سطره في تاب \"ربط برامج البيع\" (الرابط واسم المستخدم وكلمة السر)');\n  const s = bsLogin_(branch);\n  s.branch = branch;\n  c.put(k, JSON.stringify(s.jar), 1200);\n  return s;\n}\nfunction iiExpired_(res) {\n  const code = res.getResponseCode();\n  if (code >= 300 && code < 400) return true;\n  const t = res.getContentText('UTF-8');\n  return /loginform|logincheck\\.php/i.test(t.slice(0, 60000)) && !/show_items_cat|edit_item_save|preview_item|id=[\"']?row\\d+/.test(t);\n}\nfunction iiReq_(s, path, payload) {\n  const r = {\n    url: s.cfg.url + path, muteHttpExceptions: true, followRedirects: false,\n    headers: { Cookie: Object.keys(s.jar).map(k => k + '=' + s.jar[k]).join('; '), 'User-Agent': 'Mozilla/5.0 (Modaqqeq images)' }\n  };\n  if (payload) { r.method = 'post'; r.payload = payload; }\n  return r;\n}\n// طلبات كتير مع بعض - لو الجلسة خلصت ندخل تاني مرة واحدة\nfunction iiFetchAll_(s, build) {\n  let res = iiUFAll_(build(s));\n  if (res.some(iiExpired_)) {\n    const s2 = iiSession_(s.branch, true);\n    s.jar = s2.jar;\n    res = iiUFAll_(build(s));\n    if (res.some(iiExpired_)) throw new Error('برنامج البيع بيخرّج الجلسة - جرّب كمان شوية');\n  }\n  return res;\n}\n// طلب واحد (لو الجلسة خلصت ندخل تاني)\nfunction iiFetch_(s, path, opt) {\n  let res = bsFetch_(s, path, opt);\n  if (iiExpired_(res)) {\n    const s2 = iiSession_(s.branch, true);\n    s.jar = s2.jar;\n    res = bsFetch_(s, path, opt);\n  }\n  return res;\n}\n// طلب زي اللي المتصفح بيبعته من صفحة تعديل الصنف بالظبط (نفس الكوكيز + Referer + Origin)\nfunction iiPage_(s, path, payload, form) {\n  const go = () => {\n    const origin = s.cfg.url.replace(/^(https?:\\/\\/[^/]+).*$/, '$1');\n    const r = {\n      method: 'post', muteHttpExceptions: true, followRedirects: false, payload: payload,\n      headers: {\n        Cookie: Object.keys(s.jar).map(k => k + '=' + s.jar[k]).join('; '),\n        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',\n        'X-Requested-With': 'XMLHttpRequest', Referer: s.cfg.url + 'items/new_item.php', Origin: origin,\n        Accept: '*/*'\n      }\n    };\n    if (form) r.contentType = 'application/x-www-form-urlencoded; charset=UTF-8';\n    const res = iiUF_(s.cfg.url + path, r);\n    const sc = res.getAllHeaders()['Set-Cookie'] || res.getAllHeaders()['set-cookie'];\n    if (sc) (Array.isArray(sc) ? sc : [sc]).forEach(c => {\n      const kv = String(c).split(';')[0], i = kv.indexOf('=');\n      if (i > 0) s.jar[kv.slice(0, i).trim()] = kv.slice(i + 1).trim();\n    });\n    return res;\n  };\n  return go();\n}\nfunction iiSaveJar_(s) { CacheService.getScriptCache().put(iiKey_(s.branch), JSON.stringify(s.jar), 1200); }\n\n// ---------- قايمة الأصناف ----------\n// صف من جدول الأصناف في البرنامج ← [id, name, code, cat]\nfunction iiParseRows_(html) {\n  const out = [];\n  (String(html).match(/<tr[^>]*id=[\"']?row\\d+[\\s\\S]*?<\\/tr>/gi) || []).forEach(tr => {\n    const id = (tr.match(/id=[\"']?row(\\d+)/i) || [])[1];\n    if (!id) return;\n    const pt = (tr.match(/<a[^>]*class=[\"'][^\"']*print_ticket[^>]*>/i) || [])[0] || '';\n    let name = pt ? iiAttr_(pt, 'data-name') : '';\n    if (!name) name = iiDecode_(((tr.match(/item\\.php\\?id=\\d+[\"']\\s*>([^<]+)<\\/a>/i) || [])[1] || '').trim());\n    const code = pt ? (iiAttr_(pt, 'data-barcode') || '') : '';\n    const cat = iiDecode_(((tr.match(/show_items_cat\\(\\d+\\)[\"'][^>]*>([^<]*)<\/i) || [])[1] || '').trim());\n    out.push([id, String(name || '').trim(), String(code).trim(), cat]);\n  });\n  return out;\n}\nfunction iiPagesOf_(html) {\n  let mx = 1;\n  (String(html).match(/current\\s*=\\s*(\\d+)/g) || []).forEach(x => { const n = Number(x.replace(/\\D/g, '')); if (n > mx) mx = n; });\n  (String(html).match(/search_items\\((\\d+)\\)/g) || []).forEach(x => { const n = Number(x.replace(/\\D/g, '')); if (n > mx) mx = n; });\n  return mx;\n}\nfunction iiListPayload_(p) {\n  return { current: String(p), searchval: '', store: '', select_cat: '', comp_id: '', barcode_only: '', factory_id: '' };\n}\n// رابط الصورة من صفحة الصنف (item.php) ← \"upload/...\" أو \"-\"\nfunction iiImgOf_(html) {\n  const m = String(html).match(/<img\\b[^>]*class=[\"'][^\"']*preview_item[^\"']*[\"'][^>]*>/i) || String(html).match(/<img\\b[^>]*preview_item[^>]*>/i);\n  if (m) {\n    const src = iiAttr_(m[0], 'src') || '';\n    const u = src.match(II_IMG_RE);\n    return u ? u[0] : II_NONE;\n  }\n  return II_NONE;\n}\n\nfunction iiScanKey_(branch) { return 'II_SCAN_' + Utilities.base64EncodeWebSafe(Utilities.newBlob(posNormBranch_(branch)).getBytes()).slice(0, 120); }\nfunction iiScanState_(branch) {\n  try { return JSON.parse(PropertiesService.getScriptProperties().getProperty(iiScanKey_(branch)) || 'null'); } catch (e) { return null; }\n}\nfunction iiScanSave_(branch, st) { PropertiesService.getScriptProperties().setProperty(iiScanKey_(branch), JSON.stringify(st)); }\n\nfunction iiProgress_(t, st) {\n  return {\n    stage: st ? st.stage : 'none', finished: !!(st && st.stage === 'done'), listed: !!(st && st.fullSeen),\n    paused: !(st && st.stage === 'done') && !iiRoom_(30), // التجهيز وقف النهارده علشان رصيد الطلبات\n    page: st ? Math.min(st.page || 1, st.pages || st.page || 1) : 0, pages: st ? st.pages || 0 : 0,\n    total: t.rows.length, checked: t.rows.filter(r => r[4]).length,\n    withImg: t.rows.filter(r => r[4] && r[4] !== II_NONE).length, done: st && st.done || ''\n  };\n}\n\n// قفل لكل فرع لوحده (علشان تجهيز فرع ما يوقفش حفظ صورة في فرع تاني)\nfunction iiMutex_(key, ttl, waitMs) {\n  const c = CacheService.getScriptCache(), end = Date.now() + (waitMs || 0);\n  for (;;) {\n    const l = LockService.getScriptLock();\n    if (l.tryLock(10000)) {\n      try {\n        if (!c.get(key)) { c.put(key, '1', ttl); return true; }\n      } finally { l.releaseLock(); }\n    }\n    if (Date.now() > end) return false;\n    Utilities.sleep(1500);\n  }\n}\nfunction iiUnmutex_(key) { CacheService.getScriptCache().remove(key); }\nfunction iiMKey_(kind, branch) { return 'iim_' + kind + '_' + Utilities.base64EncodeWebSafe(Utilities.newBlob(posNormBranch_(branch)).getBytes()).slice(0, 150); }\n\n// خطوة تجهيز (حوالي 40 ثانية) - التطبيق بينادي لحد ما finished\n// المرحلة 1: صفحات قايمة الأصناف (30 صنف في الصفحة) ← رقم كل صنف واسمه وباركوده وتصنيفه\n// المرحلة 2: صفحة كل صنف لسه ما اتعرفتش صورته ← رابط الصورة\n// d.restart = يبدأ من الأول (أصناف جديدة / أسماء اتغيرت)\nfunction iiScan_(d) {\n  return iiScanCore_(iiBranch_(d).branch, !!d.restart);\n}\nfunction iiScanCore_(b, restart) {\n  const d = { restart: restart };\n  const mk = iiMKey_('scan', b);\n  if (!iiMutex_(mk, 90, 0)) return iiProgress_(iiRead_(b), iiScanState_(b)); // فيه حد تاني بيجهّز نفس الفرع\n  try {\n    const t0 = Date.now(), budget = 40 * 1000;\n    let st = iiScanState_(b);\n    if (!st || (d.restart && st.stage === 'done')) st = { stage: 'list', page: 1, pages: 0, run: String(Date.now()), started: new Date().toISOString(), fullSeen: st && st.fullSeen || '' };\n    const t = iiRead_(b);\n    const s = iiSession_(b);\n    if (st.stage === 'list') {\n      while (Date.now() - t0 < budget && (!st.pages || st.page <= st.pages) && iiRoom_(8)) {\n        const batch = [];\n        for (let p = st.page; p < st.page + 8 && (!st.pages || p <= st.pages); p++) batch.push(p);\n        if (!batch.length) break;\n        const res = iiFetchAll_(s, x => batch.map(p => iiReq_(x, 'items/show_items.php', iiListPayload_(p))));\n        res.forEach(r => {\n          const html = r.getContentText('UTF-8');\n          if (!st.pages) st.pages = iiPagesOf_(html);\n          iiParseRows_(html).forEach(it => {\n            const i = t.byId[it[0]];\n            if (i === undefined) { t.byId[it[0]] = t.rows.length; t.rows.push([it[0], it[1], it[2], it[3], '', st.run]); }\n            else { const row = t.rows[i]; row[1] = it[1]; row[2] = it[2]; row[3] = it[3]; row[5] = st.run; }\n          });\n        });\n        st.page = batch[batch.length - 1] + 1;\n      }\n      if (st.pages && st.page > st.pages) {\n        // الأصناف اللي اتمسحت من البرنامج: نشيلها\n        t.rows = t.rows.filter(r => r[5] === st.run);\n        t.byId = {};\n        t.rows.forEach((r, i) => { t.byId[r[0]] = i; });\n        t.full = true;\n        st.fullSeen = st.run;\n        st.stage = 'imgs';\n      }\n      iiWrite_(t);\n    }\n    if (st.stage === 'imgs' && Date.now() - t0 < budget) {\n      const todo = [];\n      t.rows.forEach((r, i) => { if (!r[4]) todo.push(i); });\n      let k = 0;\n      while (Date.now() - t0 < budget && k < todo.length && iiRoom_(30)) {\n        const part = todo.slice(k, k + 30);\n        const res = iiFetchAll_(s, x => part.map(i => iiReq_(x, 'items/item.php?id=' + t.rows[i][0])));\n        part.forEach((i, j) => {\n          const html = res[j].getContentText('UTF-8');\n          if (res[j].getResponseCode() === 200 && html.length > 1000) t.rows[i][4] = iiImgOf_(html);\n        });\n        k += part.length;\n      }\n      iiWrite_(t);\n      if (k >= todo.length) { st.stage = 'done'; st.done = new Date().toISOString(); }\n    }\n    iiSaveJar_(s);\n    iiScanSave_(b, st);\n    return iiProgress_(t, st);\n  } finally {\n    iiUnmutex_(mk);\n  }\n}\n\n// القايمة للتطبيق ← {items: [[id, name, code, cat, img]], base, scan}\nfunction iiItems_(d) {\n  const b = iiBranch_(d).branch;\n  const cfg = iiCfg_(b);\n  if (!cfg) throw new Error('الفرع مش مربوط ببرنامج البيع - راجع سطره في تاب \"ربط برامج البيع\" (الرابط واسم المستخدم وكلمة السر)');\n  const t = iiRead_(b), st = iiScanState_(b);\n  const items = t.rows.filter(r => r[0]).map(r => [r[0], r[1], r[2], r[3], r[4]]);\n  return { items: items, base: cfg.url, scan: iiProgress_(t, st) };\n}\n\n// البحث بالباركود (الأساسي أو الفرعي) ← {ids: [...]}\nfunction iiFind_(d) {\n  const b = iiBranch_(d).branch;\n  const code = String(d.code || '').trim();\n  if (!code) return { ids: [] };\n  const s = iiSession_(b);\n  const res = iiFetchAll_(s, x => [iiReq_(x, 'items/show_items.php',\n    { current: '1', searchval: code, store: '', select_cat: '', comp_id: '', barcode_only: '1', factory_id: '' })]);\n  iiSaveJar_(s);\n  const rows = iiParseRows_(res[0].getContentText('UTF-8'));\n  return { ids: rows.slice(0, 10).map(r => r[0]), items: rows.slice(0, 10) };\n}\n\n// ---------- حفظ الصورة ----------\n// d = {branch, id, image: \"data:image/jpeg;base64,...\"}\nfunction iiSet_(d) {\n  const ub = iiBranch_(d);\n  const m = String(d.image || '').match(/^data:(image\\/(?:jpeg|png|webp));base64,(.+)$/);\n  if (!m) throw new Error('الصورة مش واضحة - اختار صورة تانية');\n  return iiSetCore_(ub.branch, ub.u.name, d.id, Utilities.newBlob(Utilities.base64Decode(m[2]), m[1]), null);\n}\n// blob = الصورة الجديدة، أو path = رابط صورة موجودة على البرنامج (upload/... - للرجوع بعد التجربة)\nfunction iiSetCore_(b, who, id, blobIn, path) {\n  id = String(id || '').replace(/\\D/g, '');\n  if (!id) throw new Error('الصنف مش معروف');\n  const type = blobIn ? blobIn.getContentType() : '';\n  const bytes = blobIn ? blobIn.getBytes() : null;\n  if (bytes && bytes.length > 3 * 1024 * 1024) throw new Error('الصورة كبيرة قوي');\n  const ext = type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg';\n  const mk = iiMKey_('set', b);\n  if (!iiRoom_(6, true)) throw new Error(II_QUOTA_MSG);\n  if (!iiMutex_(mk, 120, 45000)) throw new Error('فيه صورة تانية بتتحفظ دلوقتي - جرّب تاني');\n  let name = '', oldImg = '';\n  try {\n    const s = iiSession_(b);\n    // نفس ترتيب صفحة البرنامج بالظبط: نفتح صفحة تعديل الصنف ← نرفع الصورة ← نحفظ (من غير ما نفتح الصفحة تاني في النص)\n    const edit = () => iiFetch_(s, 'items/new_item.php', { method: 'post', payload: { id: id, edit: 'item', store_id: '' } }).getContentText('UTF-8');\n    // 1) صفحة تعديل الصنف\n    const html = edit();\n    if (!/edit_item_save\\.php/.test(html)) throw new Error('مقدرتش أفتح صفحة تعديل الصنف في البرنامج');\n    const before = iiFormPayload_(html, null);\n    if (before.id !== id) throw new Error('البرنامج فتح صنف تاني - ما اتحفظش حاجة');\n    name = before.payload.item_name || '';\n    oldImg = before.oldImg;\n    // 2) رفع الصورة (البرنامج بيرجّع اسم الملف، والصفحة بتحطه upload/الاسم)\n    let newImg = path;\n    if (bytes) {\n      const blob = Utilities.newBlob(bytes, type, 'item_' + id + '.' + ext);\n      const up = iiPage_(s, 'uploader.php', { photoimg: blob }, false);\n      const raw = String(up.getContentText('UTF-8') || '').trim();\n      const file = raw.replace(/^\"+|\"+$/g, '');\n      if (up.getResponseCode() !== 200 || !/^[\\w\\-\\/.]+\\.(?:jpe?g|png|gif|webp)$/i.test(file)) {\n        iiLog_(b, who, id, name, oldImg, '', 'رفع الصورة فشل', raw.slice(0, 200));\n        throw new Error('البرنامج رفض رفع الصورة' + (raw && raw.length < 120 ? ': ' + raw.replace(/<[^>]+>/g, ' ').trim() : ''));\n      }\n      newImg = 'upload/' + file;\n    }\n    if (newImg == null) throw new Error('مفيش صورة');\n    // 3) الحفظ: نفس بيانات الصفحة بالظبط والصورة الجديدة بس\n    const form = iiFormPayload_(html, newImg);\n    const sent = iiParam_(form.payload);\n    const res = iiPage_(s, 'items/edit_item_save.php', sent, true);\n    const msg = String(res.getContentText('UTF-8') || '').trim();\n    if (!(Number(msg) > 0)) {\n      iiLog_(b, who, id, name, oldImg, newImg, 'الحفظ فشل', msg.slice(0, 300));\n      const txt = msg.replace(/<[^>]+>/g, ' ').replace(/\\s+/g, ' ').trim();\n      throw new Error('البرنامج ما حفظش الصورة' + (txt && txt.length < 150 ? ': ' + txt : ' - غالباً يوزر الربط مالوش صلاحية تعديل الأصناف'));\n    }\n    // 4) التأكد: نفتح الصنف تاني ونقارن كل الخانات (ما عدا الصورة والكمية لأنها بتتغير مع البيع)\n    const after = iiFormPayload_(edit(), null);\n    const stored = after.oldImg;\n    const diffs = iiDiff_(sent, iiParam_(after.payload));\n    const ok = path != null ? (stored === path || (!II_IMG_RE.test(stored) && !II_IMG_RE.test(path))) : (stored !== oldImg && II_IMG_RE.test(stored));\n    // 5) شيت الصور\n    try { iiSetCell_(b, id, II_IMG_RE.test(stored) ? stored.match(II_IMG_RE)[0] : II_NONE); } catch (e) {}\n    iiSaveJar_(s);\n    iiLog_(b, who, id, name, oldImg, stored, ok ? (diffs.length ? 'اتحفظت - في خانات اتغيرت' : 'تمام') : 'الصورة ما اتغيرتش',\n      (diffs.length ? 'اتغير: ' + diffs.join('، ') : '') + (ok ? '' : ' | اتبعت: ' + newImg));\n    if (!ok) throw new Error('البرنامج رد إن الحفظ تمام بس الصورة ما اتغيرتش - كلم الدعم');\n    return { img: II_IMG_RE.test(stored) ? stored.match(II_IMG_RE)[0] : II_NONE, url: s.cfg.url + stored, changed: diffs, oldImg: oldImg, name: name };\n  } finally {\n    iiUnmutex_(mk);\n  }\n}\n\n// الخانات اللي اختلفت بين طلبين (ما عدا الصورة والكمية)\nfunction iiDiff_(a, b) {\n  const skip = { img: 1, quantity: 1, old_quantity: 1 };\n  const A = {}, B = {}, out = [];\n  String(a).split('&').forEach(x => { const k = decodeURIComponent(x.split('=')[0]); if (!skip[k]) A[x] = k; });\n  String(b).split('&').forEach(x => { const k = decodeURIComponent(x.split('=')[0]); if (!skip[k]) B[x] = k; });\n  Object.keys(A).forEach(x => { if (!B[x] && out.indexOf(A[x]) < 0) out.push(A[x]); });\n  Object.keys(B).forEach(x => { if (!A[x] && out.indexOf(B[x]) < 0) out.push(B[x]); });\n  return out;\n}\n\n// ---------- قراءة صفحة تعديل الصنف (نفس اللي الصفحة بتبعته بالظبط) ----------\nfunction iiDecode_(s) {\n  const named = { quot: '\"', apos: \"'\", lt: '<', gt: '>', amp: '&', nbsp: '\\u00a0' };\n  return String(s == null ? '' : s).replace(/&(#\\d+|#x[0-9a-f]+|quot|apos|lt|gt|amp|nbsp|#039);/gi, (m, e) => {\n    if (e[0] === '#') return String.fromCharCode(e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : Number(e.slice(1)));\n    return named[e.toLowerCase()];\n  });\n}\nfunction iiAttr_(tag, name) {\n  const m = String(tag).match(new RegExp('\\\\s' + name + '\\\\s*=\\\\s*(?:\"([^\"]*)\"|\\'([^\\']*)\\'|([^\\\\s>]+))', 'i'));\n  return m ? iiDecode_(m[1] != null ? m[1] : (m[2] != null ? m[2] : m[3])) : null;\n}\nfunction iiHasAttr_(tag, name) { return new RegExp('\\\\s' + name + '(?=[\\\\s=/>])', 'i').test(String(tag)); }\n// كل التاجات من نوع معين (من غير اللي جوه السكريبتات)\nfunction iiTags_(html, tagName) {\n  return String(html).match(new RegExp('<' + tagName + '\\\\b[^>]*>', 'gi')) || [];\n}\nfunction iiFormPayload_(html, newImg) {\n  // نشيل السكريبتات والتعليقات علشان التاجات اللي جواهم ما تتحسبش\n  const clean = String(html).replace(/<script\\b[\\s\\S]*?<\\/script>/gi, '').replace(/<!--[\\s\\S]*?-->/g, '');\n  const inputs = iiTags_(clean, 'input');\n  const byId = id => inputs.find(t => iiAttr_(t, 'id') === id);\n  const val = id => { const t = byId(id); return t ? (iiAttr_(t, 'value') || '') : undefined; };\n  const checked = id => { const t = byId(id); return !!(t && iiHasAttr_(t, 'checked')); };\n  const radio = name => {\n    const t = inputs.find(x => iiAttr_(x, 'name') === name && /type=[\"']?radio/i.test(x) && iiHasAttr_(x, 'checked'));\n    return t ? (iiAttr_(t, 'value') || 'on') : undefined;\n  };\n  const radioClass = cls => {\n    const t = inputs.find(x => (' ' + (iiAttr_(x, 'class') || '') + ' ').indexOf(' ' + cls + ' ') >= 0 && iiHasAttr_(x, 'checked'));\n    return t ? (iiAttr_(t, 'value') || 'on') : undefined;\n  };\n  const selects = [];\n  clean.replace(/<select\\b([^>]*)>([\\s\\S]*?)<\\/select>/gi, (m, a, body) => { selects.push({ tag: '<select' + a + '>', body: body }); return m; });\n  const sel = id => {\n    const s = selects.find(x => iiAttr_(x.tag, 'id') === id);\n    if (!s) return undefined;\n    const opts = s.body.match(/<option\\b[^>]*>/gi) || [];\n    const multi = iiHasAttr_(s.tag, 'multiple');\n    const on = opts.filter(o => iiHasAttr_(o, 'selected')).map(o => { const v = iiAttr_(o, 'value'); return v == null ? '' : v; });\n    if (multi) return on.length ? on : null;\n    if (on.length) return on[on.length - 1];\n    if (!opts.length) return null;\n    const v = iiAttr_(opts[0], 'value');\n    return v == null ? '' : v;\n  };\n  const ta = (clean.match(/<textarea\\b[^>]*id=[\"']details[\"'][^>]*>([\\s\\S]*?)<\\/textarea>/i) || [])[1];\n  const img = inputs.length >= 0 ? (String(html).match(/<img\\b[^>]*id=[\"']upload_img[\"'][^>]*>/i) || [])[0] : '';\n  const oldImg = img ? (iiAttr_(img, 'newlink') || '') : '';\n  // آخر جزء في datasend: \"multi_price\":\"1\",\"id\":\"..\",\"old_quantity\":\"..\"\n  const block = (String(html).match(/\"store_show_image\"\\s*:[^\\n]*\\n([\\s\\S]*?)\\};\\s*console\\.log\\(datasend\\)/) || [])[1] || '';\n  const tail = {};\n  block.replace(/\"([\\w]+)\"\\s*:\\s*\"([^\"]*)\"/g, (m, k, v) => { tail[k] = v; return m; });\n  if (!tail.id) throw new Error('مقدرتش أقرا صفحة تعديل الصنف من البرنامج - ما اتحفظش حاجة');\n\n  const factory = sel('factory_id');\n  const supplier = sel('select_supplier');\n  const priceLists = [];\n  inputs.forEach(t => {\n    const cls = ' ' + (iiAttr_(t, 'class') || '') + ' ';\n    if (cls.indexOf(' item_main_max_quantity ') >= 0) priceLists.push({ id: iiAttr_(t, 'data-id'), item_id: iiAttr_(t, 'data-item'), price_list_id: iiAttr_(t, 'data-list'), unit_id: sel('unit_id'), max_quantity: iiAttr_(t, 'value') || '' });\n  });\n  inputs.forEach(t => {\n    const cls = ' ' + (iiAttr_(t, 'class') || '') + ' ';\n    if (cls.indexOf(' item_sub_max_quantity ') >= 0) priceLists.push({ id: iiAttr_(t, 'data-id'), item_id: iiAttr_(t, 'data-item'), price_list_id: iiAttr_(t, 'data-list'), unit_id: iiAttr_(t, 'data-unit'), max_quantity: iiAttr_(t, 'value') || '' });\n  });\n  const v01 = b => b ? 1 : 0;\n  const p = {\n    item_name: val('item_name'), bolla: val('bolla'), profit_margin: val('profit_margin'), sale_price: val('sale_price'),\n    sale_unit: sel('select_type'), quantity: val('quantity'), damaged: val('damaged'),\n    factory_id: (factory == 0 || factory === '' || factory == null) ? 0 : factory,\n    is_card: v01(checked('is_card')), pay_price: val('pay_price'), about: val('about'), min_quantity: val('mini'),\n    max_quantity: val('max_quantity'), max_quantity_gomla: val('max_quantity_gomla'), supplier: JSON.stringify(supplier),\n    incom_date: val('incom_date'), expire_date: val('expire_date'), barcode: val('barcode'),\n    img: newImg != null ? newImg : oldImg, jsonArray: '[]', deleteArray: '[]', unit_id: sel('unit_id'),\n    is_service: v01(checked('is_service')), is_hidden_deficiency_statement: v01(checked('is_hidden_deficiency_statement')),\n    cooking_add: v01(checked('cooking_add')), available: v01(checked('available')), require_serial: v01(checked('require_serial')),\n    game: v01(checked('game')), is_profit_margin: v01(checked('is_profit_margin')), details: ta != null ? iiDecode_(ta).trim().replace(/\\u00a0/g, '&nbsp;') : undefined,\n    show_online: radioClass('show_online'), company_id: sel('company_id'), shelf: sel('shelf'), background_color: val('background_color'),\n    order_show: val('order_show'), lowest_price: val('lowest_price'), meter_ceramic: val('meter_ceramic'),\n    card_company_id: sel('card_company'), warranty_id: sel('warranty_id'), color_list: sel('color_list'), size_list: sel('size_list'),\n    items_group_list: sel('items_group_list'), addbarcode: '[]', vat_id: sel('vat_id'), vat_state: radio('vat_state'),\n    purchase_vat_id: sel('purchase_vat_id'), purchase_vat_state: radio('purchase_vat_state'),\n    price_befor_offer: val('price_befor_offer'), measruing_type: radio('measruing_type'),\n    sale_code: val('sale_code'), purchase_code: val('purchase_code'), item_company_id: sel('item_companies'),\n    item_price_lists: priceLists, order_unit: (val('order_unit') != null ? val('order_unit') : (sel('order_unit') != null ? sel('order_unit') : 1)),\n    store_category_id: sel('store_category_id') !== undefined ? '0' : undefined, store_show_image: v01(checked('store_show_image'))\n  };\n  Object.keys(tail).forEach(k => { p[k] = tail[k]; });\n  return { payload: p, oldImg: oldImg, id: tail.id };\n}\n// زي اللي $.post بيبعته بالظبط: الخانة اللي مش موجودة في الصفحة (undefined) ما بتتبعتش خالص\n// (لو اتبعتت فاضية البرنامج بيرجّع \"تمام\" بس ما بيحفظش الصورة)، null = فاضي، المصفوفات [0][key]\nfunction iiParam_(obj) {\n  const out = [];\n  const add = (k, v) => out.push(encodeURIComponent(k) + '=' + encodeURIComponent(v == null ? '' : v));\n  const build = (prefix, v) => {\n    if (v === undefined) return;\n    if (Array.isArray(v)) v.forEach((x, i) => build(prefix + '[' + (typeof x === 'object' && x != null ? i : '') + ']', x));\n    else if (v != null && typeof v === 'object') Object.keys(v).forEach(k => build(prefix + '[' + k + ']', v[k]));\n    else add(prefix, v);\n  };\n  Object.keys(obj).forEach(k => build(k, obj[k]));\n  return out.join('&');\n}\n\n// ---------- صور الأصناف اللي على الشاشة (قبل ما التجهيز يوصلها) ----------\n// d = {branch, ids: [...]} ← {imgs: {id: \"upload/...\" أو \"-\"}}\nfunction iiPeek_(d) {\n  const b = iiBranch_(d).branch;\n  const t = iiRead_(b);\n  const ids = (Array.isArray(d.ids) ? d.ids : []).map(x => String(x).replace(/\\D/g, ''))\n    .filter((x, i, a) => x && a.indexOf(x) === i && t.byId[x] !== undefined && !t.rows[t.byId[x]][4]).slice(0, 30);\n  const imgs = {};\n  if (!ids.length) return { imgs: imgs };\n  if (!iiRoom_(ids.length, true)) throw new Error(II_QUOTA_MSG);\n  const s = iiSession_(b);\n  const res = iiFetchAll_(s, x => ids.map(id => iiReq_(x, 'items/item.php?id=' + id)));\n  ids.forEach((id, j) => {\n    const html = res[j].getContentText('UTF-8');\n    if (res[j].getResponseCode() === 200 && html.length > 1000) { imgs[id] = iiImgOf_(html); t.rows[t.byId[id]][4] = imgs[id]; }\n  });\n  if (Object.keys(imgs).length) iiWrite_(t);\n  iiSaveJar_(s);\n  return { imgs: imgs };\n}\n\n// =====================================================================\n// ===== نسخ من سكريبت الدليل (قراية بس - من غير ما نكتب في شيت الدليل) =====\n// =====================================================================\nfunction iiDirSS_() {\n  if (!iiDirSS_.ss) {\n    try { iiDirSS_.ss = SpreadsheetApp.openById(II_DIR_ID); }\n    catch (e) { throw new Error('السيرفر مش شايف شيت الدليل - لازم يتشارك مع صاحب السكريبت كـ \"محرر\"'); }\n  }\n  return iiDirSS_.ss;\n}\nfunction posLinksSheet_() {\n  const sh = iiDirSS_().getSheetByName(SH_POS_LINKS);\n  if (!sh) throw new Error('تاب \"' + SH_POS_LINKS + '\" مش موجود في شيت الدليل');\n  return sh;\n}\nfunction posBaseUrl_(v) {\n  let u = String(v || '').trim();\n  if (!u) return '';\n  if (!/^https?:\\/\\//i.test(u)) u = 'https://' + u;\n  u = u.replace(/[?#].*$/, '').replace(/\\/(login|index|logincheck)\\.php$/i, '/');\n  if (!/\\/$/.test(u)) u += '/';\n  return u;\n}\nfunction posNormBranch_(x) {\n  return String(x || '').replace(/[ىی]/g, 'ي').replace(/ة/g, 'ه').replace(/[أإآ]/g, 'ا').replace(/\\s+/g, ' ').trim();\n}\n// {url, user, pass} أو null لو الفرع مش مربوط\nfunction posCfgFromSheet_(branch) {\n  const b = posNormBranch_(branch);\n  if (!b) return null;\n  const cache = CacheService.getScriptCache();\n  const ck = 'poscfg_' + Utilities.base64EncodeWebSafe(Utilities.newBlob(b).getBytes()).slice(0, 200);\n  const hit = cache.get(ck);\n  if (hit) return hit === '-' ? null : JSON.parse(hit);\n  const sh = posLinksSheet_();\n  let cfg = null;\n  if (sh.getLastRow() > 1) {\n    const rows = sh.getRange(2, 1, sh.getLastRow() - 1, 4).getValues();\n    for (const r of rows) {\n      if (posNormBranch_(r[0]) !== b) continue;\n      const url = posBaseUrl_(r[1]);\n      const user = String(r[2] || '').trim(), pass = String(r[3] || '');\n      if (!url || !user || !pass) break;\n      cfg = { url: url, user: user, pass: pass };\n      break;\n    }\n  }\n  cache.put(ck, cfg ? JSON.stringify(cfg) : '-', 300);\n  return cfg;\n}\nfunction bsLogin_(branch) {\n  const cfg = posCfgFromSheet_(branch);\n  if (!cfg) throw new Error('الفرع مش مربوط ببرنامج البيع');\n  const s = { cfg: cfg, jar: {} };\n  bsFetch_(s, 'login.php?lan=ar');\n  const r = bsFetch_(s, 'logincheck.php', { method: 'post', ajax: true, payload: { username: cfg.user, password: cfg.pass, lang: 'ar' } });\n  const msg = r.getContentText('UTF-8').trim();\n  if (!(Number(msg) > 0)) throw new Error('مقدرتش أدخل على برنامج البيع: ' + (msg.length > 200 ? 'رابط البرنامج غلط' : (msg.replace(/<[^>]+>/g, ' ').trim() || 'رد فاضي')));\n  return s;\n}\nfunction bsFetch_(s, path, opt) {\n  opt = opt || {};\n  let url = s.cfg.url + path;\n  for (let hop = 0; hop < 5; hop++) {\n    const headers = { 'User-Agent': 'Mozilla/5.0 (Modaqqeq images)' };\n    const ck = Object.keys(s.jar).map(k => k + '=' + s.jar[k]).join('; ');\n    if (ck) headers.Cookie = ck;\n    if (opt.ajax) headers['X-Requested-With'] = 'XMLHttpRequest';\n    const req = { method: hop === 0 ? (opt.method || 'get') : 'get', headers: headers, followRedirects: false, muteHttpExceptions: true };\n    if (hop === 0 && opt.payload) req.payload = opt.payload;\n    if (hop === 0 && opt.form) req.contentType = 'application/x-www-form-urlencoded; charset=UTF-8';\n    const res = iiUF_(url, req);\n    const all = res.getAllHeaders();\n    const sc = all['Set-Cookie'] || all['set-cookie'];\n    if (sc) (Array.isArray(sc) ? sc : [sc]).forEach(c => {\n      const kv = String(c).split(';')[0], i = kv.indexOf('=');\n      if (i > 0) s.jar[kv.slice(0, i).trim()] = kv.slice(i + 1).trim();\n    });\n    const loc = all['Location'] || all['location'];\n    if (res.getResponseCode() >= 300 && res.getResponseCode() < 400 && loc) {\n      url = /^https?:/i.test(loc) ? loc : (loc.charAt(0) === '/' ? s.cfg.url.replace(/^(https?:\\/\\/[^/]+).*$/, '$1') + loc : s.cfg.url + loc);\n      continue;\n    }\n    return res;\n  }\n  throw new Error('برنامج البيع عمل تحويلات كتير');\n}\n\n// الموظفين (نفس تاب الدخول): الإيميل | كلمة السر | الاسم | الفروع | نشط ... | الموبايل\nfunction users_() {\n  const sh = iiDirSS_().getSheetByName(SH_USERS);\n  if (!sh || sh.getLastRow() < 2) return [];\n  const rows = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getValues();\n  const ph = rows[0].map(x => String(x).trim()).indexOf('الموبايل');\n  return rows.slice(1).map(r => ({\n    email: String(r[0]).trim().toLowerCase(), pass: String(r[1]).trim(), name: String(r[2]).trim(),\n    active: isActive_(r[4]), phone: ph >= 0 ? String(r[ph] || '').trim() : ''\n  })).filter(u => u.email);\n}\nfunction isActive_(v) { return !(v === false || String(v).toUpperCase() === 'FALSE'); }\nfunction splitStores_(v) { return String(v || '').split(/[,،]/).map(x => x.trim()).filter(Boolean); }\nfunction normName_(s) {\n  return String(s || '').trim().replace(/\\s+/g, ' ').toLowerCase()\n    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');\n}\nfunction digits_(v) {\n  return String(v == null ? '' : v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^0-9]/g, '');\n}\nfunction phoneKey_(v) {\n  let n = digits_(v);\n  if (n.indexOf('0020') === 0) n = n.slice(4);\n  else if (n.indexOf('20') === 0 && n.length === 12) n = n.slice(2);\n  if (n.indexOf('0') === 0) n = n.slice(1);\n  return n.length >= 9 ? n : '';\n}\nfunction resolveLogin_(id, password, everyone) {\n  id = String(id || '').trim();\n  if (id.indexOf('@') !== -1) return id.toLowerCase();\n  const pk = phoneKey_(id);\n  if (pk && digits_(id).length === id.replace(/[\\s+\\-()]/g, '').length) {\n    const byPhone = everyone.filter(u => phoneKey_(u.phone) === pk || phoneKey_(u.email) === pk);\n    const ok = byPhone.filter(u => u.pass === password).map(u => u.email).filter((e, i, a) => a.indexOf(e) === i);\n    if (ok.length > 1) throw new Error('الرقم ده متسجل لأكتر من حساب - ادخل بالإيميل');\n    if (ok.length) return ok[0];\n    if (byPhone.length) return byPhone[0].email;\n  }\n  const n = normName_(id);\n  const byName = everyone.filter(u => u.name && normName_(u.name) === n);\n  if (!byName.length) return id.toLowerCase();\n  const emails = byName.filter(u => u.pass === password).map(u => u.email).filter((e, i, a) => a.indexOf(e) === i);\n  if (emails.length > 1) throw new Error('الاسم ده متكرر عند أكتر من موظف - ادخل بالإيميل');\n  return emails.length ? emails[0] : byName[0].email;\n}\n";
