<style>body{font-family:system-ui,Tahoma;padding:30px;text-align:center}button{font-size:20px;padding:14px 30px;margin:10px;border:0;border-radius:12px;background:#1F5FBF;color:#fff}#ok{font-size:18px;color:#1E8E3E;margin-top:12px}</style></head>
<body><h2>ملفات تطبيق الصور</h2><button id="b1">انسخ index.html</button><button id="b2">انسخ sw.js</button><div id="ok"></div>
<script>const F={"index.html":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>صور الأصناف - مدقق<\/title>\n<meta name=\"theme-color\" content=\"#1479D3\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"صور الأصناف\">\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<link rel=\"icon\" href=\"/modaqqeq-dashboard/icon-192.png\">\n<link rel=\"apple-touch-icon\" href=\"/modaqqeq-dashboard/apple-touch-icon.png\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap\">\n<style>\n  :root {\n    --blue: #1479D3; --blue-d: #0E5EA8; --ink: #1B2430; --mute: #6B7785; --line: #E3EAF2;\n    --bg: #F3F7FC; --card: #fff; --ok: #1E9E5A; --bad: #D64545; --warn: #E8A317;\n  }\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Cairo', Tahoma, sans-serif; font-size: 15px; }\n  button, input, select { font-family: inherit; font-size: inherit; }\n  .hidden { display: none !important; }\n\n  /* الدخول */\n  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }\n  .login-card { width: 100%; max-width: 380px; background: var(--card); border-radius: 18px; padding: 28px 22px; box-shadow: 0 8px 30px rgba(20,121,211,.10); }\n  .login-card img { display: block; width: 190px; margin: 0 auto 6px; }\n  .login-card h1 { text-align: center; font-size: 19px; margin: 4px 0 20px; color: var(--blue-d); }\n  .field { margin-bottom: 12px; }\n  .field label { display: block; font-size: 13px; color: var(--mute); margin-bottom: 4px; }\n  .field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; outline: none; }\n  .field input:focus { border-color: var(--blue); }\n  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; }\n  .btn:disabled { opacity: .6; }\n  .btn.block { width: 100%; }\n  .btn.ghost { background: transparent; color: var(--blue); border: 1.5px solid var(--line); }\n  .err { color: var(--bad); font-size: 13px; min-height: 20px; margin-top: 8px; text-align: center; }\n\n  /* الشاشة الرئيسية */\n  header { position: sticky; top: 0; z-index: 20; background: var(--blue); color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; }\n  .hrow { display: flex; align-items: center; gap: 10px; }\n  .hrow .title { flex: 1; min-width: 0; }\n  .hrow .title b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .hrow .title span { font-size: 12px; opacity: .85; }\n  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,.16); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }\n  .icon-btn svg { width: 22px; height: 22px; }\n  .search { display: flex; gap: 8px; margin-top: 10px; }\n  .search input { flex: 1; min-width: 0; padding: 11px 14px; border: 0; border-radius: 12px; outline: none; }\n  .tools { display: flex; gap: 6px; padding: 10px 12px 4px; flex-wrap: wrap; align-items: center; }\n  .chip { border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }\n  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }\n  .chip .n { opacity: .75; font-weight: 400; }\n  .sep { flex: 1; }\n  .count { font-size: 12px; color: var(--mute); padding: 2px 16px 6px; }\n\n  /* خط التقدّم الثابت تحت البحث */\n  .strip { margin-top: 10px; }\n  .strip .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #fff; }\n  .strip .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .strip .row .pc { font-weight: 800; direction: ltr; }\n  .strip .track { height: 6px; background: rgba(255,255,255,.28); border-radius: 99px; overflow: hidden; margin-top: 5px; }\n  .strip .track i { display: block; height: 100%; width: 0; background: #fff; border-radius: 99px; transition: width .35s; }\n  .strip.ok .track i { background: #7CF0A8; }\n  .strip.bad .track i { background: #FFB4B4; }\n  .strip.busy .track i.ind { width: 35% !important; animation: ind 1.1s ease-in-out infinite; }\n  @keyframes ind { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }\n  .ph .pbar { position: absolute; left: 6px; right: 6px; top: 6px; height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }\n  .ph .pbar i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .25s; }\n  .banner { margin: 8px 14px 0; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13px; }\n  .banner b { color: var(--blue-d); }\n  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }\n  .bar i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .4s; }\n\n  #list { padding: 4px 10px calc(env(safe-area-inset-bottom) + 30px); }\n  .cat { position: sticky; top: var(--hh, 118px); z-index: 5; background: var(--bg); padding: 10px 6px 4px; font-weight: 800; color: var(--blue-d); font-size: 14px; }\n  .item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 8px; margin: 6px 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); }\n  .ph { position: relative; width: 74px; height: 74px; flex: none; border-radius: 12px; overflow: hidden; background: #F6F9FC; border: 1.5px solid var(--line); cursor: pointer; }\n  .ph img { width: 100%; height: 100%; object-fit: contain; display: block; }\n  .ph.none img { object-fit: contain; padding: 10px; opacity: .45; }\n  .ph .cam { position: absolute; left: 4px; bottom: 4px; width: 24px; height: 24px; border-radius: 8px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; }\n  .ph .cam svg { width: 15px; height: 15px; }\n  .ph .busy { position: absolute; inset: 0; background: rgba(255,255,255,.82); display: flex; align-items: center; justify-content: center; }\n  .spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: sp 0.8s linear infinite; }\n  @keyframes sp { to { transform: rotate(360deg); } }\n  .ph.done { border-color: var(--ok); }\n  .info { flex: 1; min-width: 0; }\n  .info .nm { font-weight: 700; line-height: 1.45; word-break: break-word; }\n  .info .sub { font-size: 12px; color: var(--mute); margin-top: 2px; direction: rtl; }\n  .info .sub .code { direction: ltr; unicode-bidi: embed; }\n  .acts { display: flex; flex-direction: column; gap: 6px; flex: none; }\n  .act { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 62px; height: 32px; padding: 0 8px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--blue-d); font-size: 12px; font-weight: 700; cursor: pointer; }\n  .act svg { width: 15px; height: 15px; flex: none; }\n  .act:active { background: #EAF3FC; }\n  .act.done { border-color: var(--ok); color: var(--ok); }\n  .tag-wait { display: inline-block; font-size: 11px; color: #6B7280; background: #F1F3F6; border-radius: 6px; padding: 0 6px; margin-inline-start: 6px; }\n  .tag-none { display: inline-block; font-size: 11px; color: var(--bad); background: #FDECEC; border-radius: 6px; padding: 0 6px; margin-inline-start: 6px; }\n  .empty { text-align: center; color: var(--mute); padding: 40px 20px; }\n  #more { height: 40px; }\n\n  #installHelp { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 20px; }\n  #installHelp .box { background: #fff; border-radius: 16px; padding: 20px; max-width: 360px; line-height: 2; font-size: 15px; }\n  #installHelp h3 { margin: 0 0 8px; color: var(--blue-d); }\n  .install-login { margin-top: 12px; }\n  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translateX(-50%); background: #1B2430; color: #fff; padding: 10px 18px; border-radius: 12px; z-index: 100; max-width: 92vw; text-align: center; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }\n  #toast.ok { background: var(--ok); }\n  #toast.bad { background: var(--bad); }\n\n  /* اختيار الفرع */\n  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }\n  .sheet { background: #fff; width: 100%; max-width: 520px; max-height: 80vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 14px calc(env(safe-area-inset-bottom) + 16px); }\n  .sheet h3 { margin: 0 0 10px; font-size: 16px; }\n  .sheet .opt { display: block; width: 100%; text-align: right; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; margin-bottom: 8px; font-weight: 600; cursor: pointer; }\n  .sheet .opt.on { border-color: var(--blue); color: var(--blue); }\n\n  /* الكاميرا */\n  #scan { position: fixed; inset: 0; background: #000; z-index: 80; display: flex; flex-direction: column; }\n  #scan video { flex: 1; width: 100%; object-fit: cover; }\n  #scan .frame { position: absolute; left: 10%; right: 10%; top: 35%; height: 22%; border: 3px solid rgba(255,255,255,.9); border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }\n  #scan .scan-top { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 12px; left: 12px; display: flex; justify-content: space-between; align-items: center; color: #fff; }\n<\/style>\n<\/head>\n<body>\n\n<!-- الدخول -->\n<section id=\"login\" class=\"hidden\">\n  <div class=\"login-card\">\n    <img src=\"/modaqqeq-dashboard/logo_wide.png\" alt=\"مدقق\">\n    <h1>تطبيق صور الأصناف<\/h1>\n    <form id=\"loginForm\" autocomplete=\"on\">\n      <div class=\"field\"><label>الاسم أو الإيميل<\/label><input id=\"lEmail\" autocomplete=\"username\" required><\/div>\n      <div class=\"field\"><label>كلمة السر<\/label><input id=\"lPass\" type=\"password\" autocomplete=\"current-password\" required><\/div>\n      <button class=\"btn block\" id=\"lBtn\" type=\"submit\">دخول<\/button>\n      <div class=\"err\" id=\"lErr\"><\/div>\n    <\/form>\n    <button class=\"btn ghost block install-login\" id=\"installBtn2\" type=\"button\">📲 تثبيت التطبيق على الموبايل<\/button>\n  <\/div>\n<\/section>\n\n<!-- الأصناف -->\n<section id=\"main\" class=\"hidden\">\n  <header id=\"hdr\">\n    <div class=\"hrow\">\n      <div class=\"title\"><b id=\"brName\">-<\/b><span id=\"who\"><\/span><\/div>\n      <button class=\"icon-btn hidden\" id=\"installBtn\" title=\"تثبيت التطبيق على الموبايل\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"2.5\"/><path d=\"M12 7v7M9 11l3 3 3-3\"/><path d=\"M10.5 18.5h3\"/><\/svg>\n      <\/button>\n      <button class=\"icon-btn hidden\" id=\"btnBranch\" title=\"تغيير الفرع\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 9l1.5-5h15L21 9\"/><path d=\"M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z\"/><path d=\"M5 13v7h14v-7\"/><\/svg>\n      <\/button>\n      <button class=\"icon-btn\" id=\"btnRefresh\" title=\"تحديث الأصناف من البرنامج\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a9 9 0 1 1-3-6.7L21 8\"/><path d=\"M21 3v5h-5\"/><\/svg>\n      <\/button>\n      <button class=\"icon-btn\" id=\"btnOut\" title=\"خروج\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4\"/><path d=\"M8 7l-5 5 5 5\"/><path d=\"M3 12h12\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"search\">\n      <input id=\"q\" type=\"search\" placeholder=\"دوّر باسم الصنف أو الباركود\" autocomplete=\"off\">\n      <button class=\"icon-btn\" id=\"btnScan\" title=\"قراية باركود بالكاميرا\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"/><path d=\"M7 8v8M10 8v8M13 8v8M17 8v8\"/><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"strip hidden\" id=\"strip\">\n      <div class=\"row\"><span class=\"t\" id=\"stripT\"><\/span><span class=\"pc\" id=\"stripP\"><\/span><\/div>\n      <div class=\"track\"><i id=\"stripBar\"><\/i><\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"tools\">\n    <button class=\"chip on\" data-f=\"all\">الكل <span class=\"n\" id=\"nAll\"><\/span><\/button>\n    <button class=\"chip\" data-f=\"none\">بدون صورة <span class=\"n\" id=\"nNone\"><\/span><\/button>\n    <span class=\"sep\"><\/span>\n    <button class=\"chip on\" data-s=\"az\">أبجدي<\/button>\n    <button class=\"chip\" data-s=\"cat\">التصنيف<\/button>\n  <\/div>\n  <div class=\"count\" id=\"count\"><\/div>\n  <div id=\"list\"><\/div>\n  <div id=\"more\"><\/div>\n<\/section>\n\n<input type=\"file\" id=\"pick\" accept=\"image/*\" class=\"hidden\">\n<div id=\"toast\" class=\"hidden\"><\/div>\n\n<div id=\"scan\" class=\"hidden\">\n  <video id=\"vid\" playsinline muted><\/video>\n  <div class=\"frame\"><\/div>\n  <div class=\"scan-top\"><b>وجّه الكاميرا على الباركود<\/b><button class=\"icon-btn\" id=\"scanClose\" title=\"قفل\">✕<\/button><\/div>\n<\/div>\n\n<script>\nconst API = 'https://script.google.com/macros/s/AKfycbzTBhhzc_T858oUB15Ps60QjetVyVBbwYs3v9CRjGiNeY939PVW2vd87GaR4WIYG56i/exec';\nconst LOGO = '/modaqqeq-dashboard/icon-192.png';\nconst CAM = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8h3l2-3h6l2 3h3v11H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/><\/svg>';\nconst ICO_COPY = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"/><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"/><\/svg>';\nconst ICO_SEARCH = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"M16 16l4.5 4.5\"/><\/svg>';\nconst PAGE = 60;           // كام صنف بيترسم مرة واحدة\nconst REFRESH_HOURS = 12;  // كل قد إيه القايمة بتتحدّث من البرنامج لوحدها\n\nconst $ = id => document.getElementById(id);\nconst st = {\n  user: null, branches: [], branch: '', items: [], base: '', byId: {},\n  filter: 'all', sort: 'az', q: '', onlyIds: null, view: [], shown: 0, busy: {}, saves: {}, scanP: null, scanning: false, target: null\n};\n\n// ---------- أدوات ----------\nfunction ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }\nfunction esc(s) { return String(s ?? '').replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c])); }\nfunction toast(t, kin  1280 }, height: { ideal: 720 } }, audio: false });\n    vid.srcObject = stream;\n    await vid.play();\n    if ('BarcodeDetector' in window) {\n      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'itf', 'qr_code'] });\n      let alive = true;\n      stopScan = () => { alive = false; };\n      const tick = async () => {\n        if (!alive || done) return;\n        try { const r = await det.detect(vid); if (r && r[0] && r[0].rawValue) return finish(r[0].rawValue); } catch (e) {}\n        setTimeout(tick, 180);\n      };\n      tick();\n    } else {\n      await loadZx();\n      if (done) return;\n      zx = new ZXing.BrowserMultiFormatReader();\n      const cb = res => { if (res) finish(res.getText()); };\n      if (typeof zx.decodeFromStream === 'function') zx.decodeFromStream(stream, vid, cb);\n      else zx.decodeFromVideoElementContinuously(vid, cb);\n      stopScan = () => { try { zx.reset(); } catch (e) {} };\n    }\n  } catch (err) {\n    closeScan();\n    toast(/Permission|NotAllowed|denied/i.test(String(err && (err.name || err.message))) ? 'لازم تسمح للتطبيق يستخدم الكاميرا' : arErr(err), 'bad');\n  }\n};\nfunction closeScan() {\n  if (stopScan) { try { stopScan(); } catch (e) {} stopScan = null; }\n  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }\n  $('vid').srcObject = null;\n  $('scan').classList.add('hidden');\n}\n$('scanClose').onclick = closeScan;\n\n// ---------- التثبيت على الموبايل ----------\nlet installEvt = null;\nconst isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);\nconst isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;\nfunction showInstall() {\n  // شاشة الدخول: الزرار ظاهر دايماً - الهيدر: بس لو التطبيق مش متثبت\n  $('installBtn2').classList.remove('hidden');\n  $('installBtn2').textContent = isStandalone() ? '✓ التطبيق متثبت على الموبايل' : '📲 تثبيت التطبيق على الموبايل';\n  $('installBtn').classList.toggle('hidden', isStandalone() || !(installEvt || isIOS || /android/i.test(navigator.userAgent)));\n}\nwindow.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });\nwindow.addEventListener('appinstalled', () => { installEvt = null; showInstall(); toast('اتثبت التطبيق ✓ هتلاقيه على الشاشة الرئيسية', 'ok'); });\nasync function doInstall() {\n  if (isStandalone()) return toast('التطبيق متثبت بالفعل ✓ - افتحه من أيقونته على الشاشة الرئيسية', 'ok');\n  if (installEvt) {\n    installEvt.prompt();\n    try { await installEvt.userChoice; } catch (e) {}\n    installEvt = null; showInstall();\n    return;\n  }\n  const old = $('installHelp'); if (old) old.remove();\n  document.body.insertAdjacentHTML('beforeend', '<div id=\"installHelp\"><div class=\"box\"><h3>📲 تثبيت تطبيق صور الأصناف<\/h3>' +\n    (isIOS ? '1️⃣ افتح الصفحة دي من <b>Safari<\/b><br>2️⃣ دوس زرار المشاركة <b>⬆️<\/b> اللي تحت<br>3️⃣ اختار <b>«إضافة إلى الشاشة الرئيسية»<\/b> ← <b>إضافة<\/b>'\n      : '1️⃣ افتح الصفحة دي من <b>Chrome<\/b><br>2️⃣ دوس على <b>⋮<\/b> اللي فوق<br>3️⃣ اختار <b>«تثبيت التطبيق»<\/b> أو <b>«إضافة إلى الشاشة الرئيسية»<\/b><br><small style=\"color:#6B7785\">لو مكتوب «فتح في التطبيق» بدل التثبيت: اقفل الصفحة وافتحها تاني بعد دقيقة<\/small>') +\n    '<br><button class=\"btn block\" style=\"margin-top:12px\" onclick=\"this.closest(\\'#installHelp\\').remove()\">تمام<\/button><\/div><\/div>');\n  $('installHelp').addEventListener('click', e => { if (e.target.id === 'installHelp') e.target.remove(); });\n}\n$('installBtn').onclick = doInstall;\n$('installBtn2').onclick = doInstall;\nshowInstall();\n\n// ---------- البداية ----------\nif ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});\n(function start() {\n  hh();\n  const u = ls('ii_user');\n  if (u && ls('ii_pass')) {\n    try { afterLogin(JSON.parse(u)); } catch (e) { showLogin(); }\n    // نتأكد إن الحساب لسه شغال (وفروعه) من غير ما نوقّف الشاشة\n    api('imgLogin', {}).then(r => {\n      st.user = r; st.branches = r.branches || []; ls('ii_user', JSON.stringify(r));\n      $('btnBranch').classList.toggle('hidden', st.branches.length < 2);\n      if (st.branch && st.branches.indexOf(st.branch) < 0) { st.branch = ''; pickBranch(); }\n    }).catch(err => { if (err.auth) { toast(arErr(err), 'bad'); ls('ii_pass', null); showLogin(); } });\n  } else showLogin();\n  setTimeout(hh, 300);\n})();\n<\/script>\n<\/body>\n<\/html>\n","sw.js":"// تطبيق صور الأصناف: الصفحة بتتجاب من النت الأول (علشان أي تحديث يظهر على طول)، ولو النت قاطع بتفتح آخر نسخة محفوظة\nconst CACHE = 'modaqqeq-images-v6';\nconst SHELL = ['./', './index.html', './manifest.webmanifest', '/modaqqeq-dashboard/icon-192.png', '/modaqqeq-dashboard/logo_wide.png'];\nself.addEventListener('install', e => {\n  e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)).then(() => self.skipWaiting()));\n});\nself.addEventListener('activate', e => {\n  e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k.indexOf('modaqqeq-images-') === 0 && k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));\n});\nself.addEventListener('fetch', e => {\n  const u = new URL(e.request.url);\n  if (e.request.method !== 'GET' || u.origin !== location.origin) return;\n  e.respondWith(\n    fetch(e.request).then(r => {\n      if (r.ok) { const copy = r.clone(); caches.open(CACHE).then(c => c.put(e.request, copy)); }\n      return r;\n    }).catch(() => caches.match(e.request).then(r => r || caches.match('./index.html')))\n  );\n});\n"};
