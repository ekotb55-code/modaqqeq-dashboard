<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فواتير المشتريات - مدقق</title>
<link rel="icon" href="icon.png">
<!-- تطبيق ويب: يتثبت على الموبايل والكمبيوتر زي أي تطبيق -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1479D3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="داش بورد مدقق">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Firebase: إشعارات حتى والداش بورد مقفول -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<style>
  :root {
    --blue: #1479D3; --blue-2: #0F5FA8; --navy: #0B3D6E; --sky: #E8F2FC; --red: #E0393E; --green: #22A04B;
    --yellow: #F2A900; --orange: #E67E00; --purple: #6C4BD8;
    --bg: #F3F7FC; --card: #FFFFFF; --text: #17212E; --muted: #6B7785; --line: #DFE7F1;
    --shadow: 0 4px 18px rgba(11, 61, 110, .07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  button { font-family: inherit; font-size: 15px; cursor: pointer; border: 0; border-radius: 12px; padding: 9px 16px; font-weight: 700; transition: transform .08s, box-shadow .15s; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font-family: inherit; font-size: 15px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; width: 100%; color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(20,121,211,.12); }
  a { color: inherit; }
  .btn { background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: #fff; box-shadow: 0 4px 12px rgba(20,121,211,.25); }
  .btn.green { background: linear-gradient(135deg, #2BB45A, #1A8A3E); box-shadow: 0 4px 12px rgba(34,160,75,.25); }
  .btn.ghost { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); box-shadow: none; }
  .btn.soft { background: var(--sky); color: var(--blue-2); box-shadow: none; }
  .btn.red { background: linear-gradient(135deg, #F0504F, #C62828); box-shadow: 0 4px 12px rgba(224,57,62,.25); }
  .hidden { display: none !important; }

  /* ---------- الدخول ---------- */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(circle at 20% 10%, #DCEBFB 0, transparent 40%), radial-gradient(circle at 90% 90%, #E7E1FB 0, transparent 40%), var(--bg); }
  .login-card { width: 100%; max-width: 400px; background: #fff; padding: 30px 26px; border-radius: 24px; box-shadow: 0 20px 50px rgba(11,61,110,.12); }
  .login-card img { display: block; width: 220px; max-width: 70%; margin: 0 auto 6px; }
  .login-card h2 { margin: 6px 0 2px; text-align: center; color: var(--navy); }
  .login-card p { margin: 0 0 20px; text-align: center; color: var(--muted); }
  .login-card input { margin-bottom: 12px; }
  .login-card button { width: 100%; padding: 13px; font-size: 17px; }
  .err { color: var(--red); margin: 10px 0; text-align: center; font-weight: 600; }

  /* ---------- الهيدر ---------- */
  header { background: #fff; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
  .hbar { display: flex; align-items: center; gap: 14px; padding: 8px 18px; max-width: 1500px; margin: 0 auto; }
  .hbar img { height: 46px; }
  .hbar .title { font-weight: 800; color: var(--navy); font-size: 18px; border-inline-start: 2px solid var(--line); padding-inline-start: 14px; }
  .hbar .sp { flex: 1; }
  .who { color: var(--muted); font-weight: 600; }
  .accent { height: 4px; background: linear-gradient(90deg, var(--blue), var(--purple), #2BB45A, var(--yellow)); }
  .nav { display: flex; gap: 6px; }
  @media (max-width: 1320px) and (min-width: 761px) {
    .hbar { flex-wrap: wrap; row-gap: 4px; }
    .nav { order: 10; width: 100%; justify-content: center; }
    .team-page { height: calc(100vh - 128px); }
  }
  .nav button { background: transparent; color: var(--muted); padding: 8px 12px; white-space: nowrap; }
  .hbar .title { white-space: nowrap; }
  .nav button.on { background: var(--sky); color: var(--blue-2); }
  .bell { position: relative; }
  /* عداد النت */
  .net { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: background .4s, color .4s; white-space: nowrap; }
  .net .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .net .bars i { width: 4px; border-radius: 2px; background: currentColor; opacity: .25; transition: opacity .4s; }
  .net .bars i:nth-child(1) { height: 5px; } .net .bars i:nth-child(2) { height: 9px; } .net .bars i:nth-child(3) { height: 14px; }
  .net .bars i.on { opacity: 1; }
  .net.good { background: #E7F6EC; color: #1E7D3A; border-color: #BFE5CB; }
  .net.ok { background: #FFF6E0; color: #9A6700; border-color: #F5DD9C; }
  .net.slow { background: #FFEBD9; color: #C25400; border-color: #F7C9A0; }
  .net.off { background: #FDECEA; color: #B3261E; border-color: #F5C2BD; animation: netblink 1s infinite; }
  @keyframes netblink { 50% { opacity: .55; } }
  /* الاستعجال */
  .urge { display: inline-block; background: #B3261E; color: #fff; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 800; animation: urgepulse 1.2s infinite; }
  @keyframes urgepulse { 50% { box-shadow: 0 0 0 5px rgba(179,38,30,.18); } }
  .card.urged { border-inline-start: 5px solid #B3261E; }
  .urgebox { background: #FDECEA; border: 1px solid #F5C2BD; color: #8C1D18; border-radius: 12px; padding: 10px 14px; margin: 10px 0; line-height: 1.8; }
  .urgebox ul { margin: 4px 0 0; padding-inline-start: 20px; }
  .pricebox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .pricebox .up { background: #FDECEA; color: #B3261E; border-radius: 999px; padding: 3px 10px; font-weight: 700; }
  .pricebox .down { background: #E7F6EC; color: #1E7D3A; border-radius: 999px; padding: 3px 10px; font-weight: 700; }
  .bell.off::after { content: ''; position: absolute; top: 6px; left: 8px; width: 9px; height: 9px; background: var(--red); border-radius: 50%; }

  /* ---------- الإحصائيات ---------- */
  .main { max-width: 1500px; margin: 0 auto; padding: 16px; }
  /* ---------- الشات ---------- */
  .s10 { background: linear-gradient(135deg, #00ACC1, #00838F); }
  .chatwrap { background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 12px; margin: 12px 0; }
  .chatwrap h3 { margin: 0 0 8px; font-size: 16px; color: #0B3D6E; display: flex; align-items: center; gap: 8px; }
  .msgs { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px; background: #F4F7FB; border-radius: 12px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.br { align-self: flex-start; background: #fff; border: 1px solid #DFE7F1; border-start-start-radius: 4px; }
  .msg.sp { align-self: flex-end; background: #DCEBFB; border-start-end-radius: 4px; }
  .msg.int { align-self: flex-end; background: #FFF6D6; border: 1px dashed #E6C14D; }
  .msg.auto { align-self: center; background: #EEF1F5; color: #4A5868; font-size: 13px; }
  .msg .who { font-size: 12px; font-weight: 800; color: #0B3D6E; display: block; }
  .msg .mt { display: block; font-size: 11px; color: #6B7785; margin-top: 2px; direction: rtl; }
  .msg .tick { color: #1479D3; font-weight: 800; }
  .msg .tick.no { color: #9AA6B2; }
  .qr { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 6px; }
  .qr button { border: 1px solid #CFE0F3; background: #F2F7FD; color: #0F5FA8; border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .chatin { display: flex; gap: 8px; align-items: flex-end; }
  .chatin textarea { flex: 1; min-height: 44px; max-height: 120px; resize: vertical; }
  .chatin .btn { padding: 11px 16px; }
  .chatin .att { background: var(--sky); color: var(--blue-2); box-shadow: none; padding: 10px 12px; font-size: 18px; }
  .msg .mimg { display: block; max-width: 230px; max-height: 230px; border-radius: 10px; margin: 4px 0; cursor: zoom-in; background: #E6ECF3; min-width: 120px; min-height: 80px; object-fit: cover; }
  .mrow { display: flex; gap: 6px; align-items: flex-end; max-width: 88%; }
  .mrow.br { align-self: flex-start; } .mrow.sp, .mrow.int { align-self: flex-end; flex-direction: row-reverse; }
  .mrow .msg { max-width: 100%; }
  .av { width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px; background: var(--sky); color: var(--blue-2); font-weight: 800; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .who { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .who .av { width: 34px; height: 34px; flex-basis: 34px; position: relative; }
  .imgprev { display: flex; align-items: center; gap: 8px; padding: 6px; background: #FFF8E6; border-radius: 10px; margin-bottom: 6px; font-weight: 700; }
  .imgprev img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; }
  /* ---------- الجولة الإرشادية ---------- */
  #tourMask { position: fixed; inset: 0; z-index: 60; }
  #tourHole { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(8,25,45,.68); transition: all .25s ease; pointer-events: none; z-index: 61; outline: 3px solid #FFD54F; }
  #tourTip { position: fixed; z-index: 62; background: #fff; border-radius: 16px; padding: 16px 18px; width: min(380px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  #tourTip h4 { margin: 0 0 6px; color: var(--navy); font-size: 18px; }
  #tourTip p { margin: 0 0 12px; line-height: 1.8; white-space: pre-line; }
  #tourTip .tb { display: flex; gap: 8px; align-items: center; }
  #tourTip .tb .sp { flex: 1; }
  #tourTip .dots { color: var(--muted); font-size: 13px; font-weight: 700; }
  .flowmap { display: grid; gap: 6px; margin: 4px 0 12px; }
  .flowmap div { background: var(--sky); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 14px; }
  .flowmap div b { color: var(--blue-2); }
  .chatopt { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6B7785; margin-top: 4px; }
  .chatopt label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .chatopt input { width: auto; }
  .cbadge { display: inline-block; background: #00838F; color: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 800; line-height: 20px; }
  .cbadge.new { background: #C62828; animation: urgepulse 1.2s infinite; }
  .bchat { border: 0; background: #fff; border-radius: 10px; padding: 4px 10px; font: inherit; font-size: 12.5px; font-weight: 700; color: #00838F; cursor: pointer; margin-top: 6px; }
  #chatModal { position: fixed; inset: 0; background: rgba(10,25,45,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #chatModal .chatwrap { width: min(620px, 100%); margin: 0; }
  /* ---------- لوحة المحلات (زي تريلو) ---------- */
  .board-page { padding: 12px 16px 0; }
  .bbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .bbar > b { font-size: 18px; color: #0B3D6E; }
  .bbar input#bText { width: 240px; max-width: 100%; }
  .seg { display: inline-flex; background: #fff; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .seg button { border: 0; background: none; padding: 8px 14px; font: inherit; font-weight: 700; color: #4A5868; cursor: pointer; }
  .seg button.on { background: #1479D3; color: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: #4A5868; cursor: pointer; }
  .chk input { width: auto; }
  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 14px; height: calc(100vh - 150px); align-items: flex-start; }
  .bcol { flex: 0 0 285px; background: #E9EEF5; border-radius: 16px; display: flex; flex-direction: column; max-height: 100%; }
  .bhead { padding: 12px 14px 8px; border-bottom: 1px solid #D6DFEA; }
  .bhead h3 { margin: 0; font-size: 21px; font-weight: 900; color: #0B3D6E; display: flex; align-items: center; gap: 7px; }
  .bhead h3 .bname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bcount { flex: none; font-size: 13px; font-weight: 900; color: #fff; background: var(--sc, #1479D3); border-radius: 999px; padding: 2px 10px; min-width: 28px; text-align: center; }
  .bhead h3 .dot { width: 10px; height: 10px; border-radius: 50%; background: #2BB45A; display: inline-block; }
  .bhead h3 .dot.warn { background: #E67E00; } .bhead h3 .dot.bad { background: #C62828; }
  .bstats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bstats span { background: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; color: #4A5868; }
  .bstats span.r { color: #C62828; } .bstats span.o { color: #E67E00; } .bstats span.g { color: #1A8A3E; }
  .bbody { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .bcard { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(16,40,70,.12); cursor: pointer; border-inline-start: 5px solid #FF9F1C; transition: transform .12s; }
  .bcard:hover { transform: translateY(-2px); }
  .bcard.st-work { border-inline-start-color: #1E90FF; } .bcard.st-done { border-inline-start-color: #2BB45A; } .bcard.st-rej { border-inline-start-color: #5B6B7E; }
  .bcard.late { box-shadow: 0 0 0 2px #F0504F; }
  .bcard .bt { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .bcard .bt b { font-size: 15px; }
  .bcard .bm { font-size: 12px; color: #6B7785; margin: 2px 0 6px; }
  .tl { list-style: none; margin: 0; padding: 0; border-top: 1px dashed #DFE7F1; padding-top: 6px; }
  .tl li { font-size: 12.5px; line-height: 1.55; display: flex; gap: 6px; }
  .tl li .tm { color: #6B7785; margin-inline-start: auto; white-space: nowrap; direction: ltr; font-size: 11.5px; }
  .tl li.note { color: #8C1D18; }
  .bempty { text-align: center; color: #8A96A3; padding: 18px 6px; font-size: 13px; }
  /* لون كل عميل + كروت صغيرة بتكبر لما تقف عليها */
  .bcol { border-top: 6px solid var(--sc, #1479D3); }
  .bhead { background: color-mix(in srgb, var(--sc, #1479D3) 9%, transparent); border-radius: 10px 10px 0 0; }
  .sdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-inline-end: 4px; box-shadow: 0 0 0 2px #fff; }
  .bbody { gap: 7px; }
  .bcard { padding: 7px 10px; }
  .bcard .bt b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bcard .bm { margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bcard .bx { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .25s ease, opacity .2s; }
  .bcard:hover .bx, .bcard.open .bx { max-height: 900px; opacity: 1; margin-top: 6px; }
  .bcard:hover { transform: none; box-shadow: 0 6px 18px rgba(16,40,70,.18); }
  .bcard.k-tk { border-inline-start-color: #546E7A; } .bcard.k-tk.urg { border-inline-start-color: #C62828; }
  .bcard.k-task { border-inline-start-color: #6C4BD8; background: #FAF8FF; } .bcard.k-task.done { opacity: .65; border-inline-start-color: #2BB45A; background: #fff; }
  .bcard.k-task.late { box-shadow: 0 0 0 2px #6C4BD8; }
  .bcard.k-jr { border-inline-start-color: #00897B; background: #F1FBF9; }
  .bcard .kind { font-size: 11px; font-weight: 800; color: #6B7785; margin-inline-end: 4px; }
  .bacts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bacts .btn { padding: 5px 10px; font-size: 12.5px; }
  .bdesc { font-size: 12.5px; color: #33404D; white-space: pre-wrap; margin-bottom: 4px; }
  .s14 { background: linear-gradient(135deg, #7E57C2, #4527A0); }
  .tkgrp { border: 1px solid #E3E9F1; border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .tkgrp .bar { height: 6px; background: #EEF2F7; border-radius: 4px; overflow: hidden; margin: 5px 0; }
  .tkgrp .bar i { display: block; height: 100%; background: #6C4BD8; }
  .stpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .stpick label { display: flex; gap: 6px; align-items: center; font-weight: 600; }
  .stpick input { width: auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  /* رحلة الفاتورة: 4 كروت كبيرة بأسهم + فلاتر صغيرة تحتها */
  #stats { display: block; }
  #stats .hours { margin-bottom: 10px; }
  .flow { display: flex; align-items: stretch; gap: 8px; }
  .flow .stat.big { flex: 1; min-width: 0; padding: 14px 16px; }
  .flow .stat.big b { font-size: 34px; }
  .flow .arrow { align-self: center; font-size: 22px; color: #A8B4C2; font-weight: 900; }
  .extras { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 13.5px;
    color: #fff; border-radius: 999px; padding: 7px 8px 7px 14px; box-shadow: 0 2px 6px rgba(16,40,70,.12); opacity: .8; transition: opacity .15s, transform .15s, box-shadow .15s; }
  .chip b { background: rgba(255,255,255,.25); border-radius: 999px; min-width: 28px; padding: 1px 8px; text-align: center; font-size: 14px; }
  .chip:hover { opacity: 1; transform: translateY(-1px); }
  .chip.on { opacity: 1; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #0B3D6E; }
  .chip.hot { opacity: 1; animation: urgepulse 1.6s infinite; }
  @media (max-width: 800px) {
    .flow { display: grid; grid-template-columns: 1fr 1fr; }
    .flow .arrow { display: none; }
    .flow .stat.big b { font-size: 28px; }
    .extras { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
    .chip { flex: 0 0 auto; }
  }
  .stat { border-radius: 18px; padding: 14px 16px; color: #fff; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .stat::after { content: ''; position: absolute; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.12); left: -30px; top: -40px; }
  .stat small { opacity: .9; font-weight: 600; }
  .stat b { display: block; font-size: 28px; line-height: 1.2; }
  .s1 { background: linear-gradient(135deg, #FF9F1C, #E67E00); }
  .s2 { background: linear-gradient(135deg, #1E90FF, #0F5FA8); }
  .s3 { background: linear-gradient(135deg, #2BB45A, #1A8A3E); }
  .s4 { background: linear-gradient(135deg, #F0504F, #C62828); }
  .s5 { background: linear-gradient(135deg, #8B6CF0, #5B3CC4); }
  .s6 { background: linear-gradient(135deg, #5B6B7E, #36414F); }
  .s7 { background: linear-gradient(135deg, #F06292, #C2185B); }
  .s8 { background: linear-gradient(135deg, #26A69A, #00796B); }
  .s9 { background: linear-gradient(135deg, #455A64, #263238); }
  /* الكروت الملونة هي الفلاتر: الكارت المختار عليه إطار */
  button.stat { border: 0; font: inherit; text-align: right; cursor: pointer; transition: transform .15s, box-shadow .15s, opacity .15s; }
  button.stat:hover { transform: translateY(-2px); }
  .stats.picking button.stat:not(.on) { opacity: .78; }
  button.stat.on { opacity: 1; transform: translateY(-3px); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #0B3D6E, var(--shadow); }
  button.stat .hint { display: block; font-size: 11px; opacity: .85; margin-top: 2px; }

<script>
// رابط سكريبت "دليل الموظفين" (نفس اللي في التطبيق)
const API = 'https://script.google.com/macros/s/AKfycbxUjxuVtROKO7MrxHtmBfzOxsjgwgfvWMVodCHxUdxuFszmgTyWMQFavjt82iJ8U0s/exec';
const SLA_MIN = 30, WARN_MIN = 20;          // الفاتورة لازم تدخل خلال 30 دقيقة (أصفر من 20)
const ST_NEW = 'جديدة', ST_WORK = 'يتم الادخال', ST_DONE = 'تم الإدخال', ST_REJ = 'مرفوضة', TAB_NOTES = '📝 ملاحظات الفروع';
const ST_QA = 'مستنية الجودة', QA_SLA_MIN = 15; // قسم الجودة بيراجع بعد إدخال الدعم
const QA_ITEMS = ['الأصناف', 'الكميات', 'أسعار الشراء', 'أسعار البيع', 'المورد', 'رقم فاتورة المورد', 'الإجمالي', 'صورة السيستم'];
let myRole = '';
// مواعيد العمل: من 9 الصبح لحد 1 بالليل - برة المواعيد العداد بيقف
const OFF_FROM = 1, OFF_TO = 9;
const PENDING_ALERT_MIN = 5; // تنبيه كل 5 دقايق طول ما فيه فواتير مستنية
let token = '', me = '', all = [], stores = [], tab = ST_NEW, cur = null, shots = [], skew = 0;
let known = null, pIdx = 0, perfRange = 'today', prevStatus = {}, revKnown = null, pendAt = 0;
let chatSum = { threads: [], replies: [] }, chatKnown = null;
const imgCache = {};

// ---------- أدوات ----------
async function api(action, data, post) {
  let res;
  if (post) res = await fetch(API + '?action=' + action, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
  else res = await fetch(API + '?action=' + action + '&data=' + encodeURIComponent(JSON.stringify(data)));
  const j = await res.json();
  if (!j.ok) {
    if ((j.error || '').indexOf('انتهت الجلسة') !== -1) { toast(j.error); setTimeout(logout, 1500); }
    throw new Error(j.error || 'خطأ');
  }
  return j;
}
const $ = id => document.getElementById(id);
function msg(e) { return (e && e.message) ? e.message : String(e); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('hidden'), 3800); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(v) { return Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function num(v) { return Number(v || 0).toLocaleString('en-US', { maximumFractionDigits: 3 }); }
function dt(s) { if (!s) return ''; const d = new Date(s); return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' }) + ' ' + d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }); }
function badge(s) { return '<span class="badge ' + (s === ST_DONE ? 'b-done' : s === ST_WORK ? 'b-work' : s === ST_REJ ? 'b-rej' : s === ST_QA ? 'b-qa' : 'b-new') + '">' + esc(s || ST_NEW) + '</span>'; }
function isQA() { return myRole === 'جودة'; }
function canQA() { return myRole === 'جودة' || myRole === 'مدير'; }
function qaLate(v) { return v.status === ST_QA && v.doneAt && mins(v.doneAt, now()) > QA_SLA_MIN; }
// سجل الجودة: سطور "نوع|وقت|اسم|ملاحظة"
function qaLogList(v) {
  return String(v.qaLog || '').split('\n').filter(Boolean).map(l => { const p = l.split('|'); return { type: p[0], at: p[1], name: p[2], note: p[3] || '', who: p[4] || '' }; });
}
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function now() { return Date.now() + skew; }
// وقت الشغل بس بين وقتين (من غير الفترة من 1 بالليل لـ 9 الصبح)
function workMs(a, b) {
  a = new Date(a).getTime(); b = new Date(b).getTime();
  if (!(b > a)) return 0;
  let off = 0;
  const d = new Date(a); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 1);
  while (d.getTime() < b) {
    const s = new Date(d); s.setHours(OFF_FROM, 0, 0, 0);
    const e = new Date(d); e.setHours(OFF_TO, 0, 0, 0);
    off += Math.max(0, Math.min(b, e.getTime()) - Math.max(a, s.getTime()));
    d.setDate(d.getDate() + 1);
  }
  return b - a - off;
}
function inWork(t) { const h = new Date(t).getHours(); return h >= OFF_TO || h < OFF_FROM; }
function mins(a, b) { return workMs(a, b) / 60000; }
function pending(v) { return v.status === ST_NEW || v.status === ST_WORK || !v.status; }
function clock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function durTxt(m) { m = Math.round(m); return m < 60 ? m + ' د' : Math.floor(m / 60) + ' س ' + (m % 60) + ' د'; }

// العداد: أخضر لحد 20 دقيقة، أصفر لحد 30، وبعدها أحمر "متأخرة"
function timerHtml(v) {
  if (!v.createdAt) return '';
  if (v.status === ST_DONE && v.doneAt) {
    const m = mins(v.createdAt, v.doneAt);
    const c = m <= WARN_MIN ? 'green' : m <= SLA_MIN ? 'yellow' : 'red';
    return '<span class="timer t-done-' + c + '">✓ ' + durTxt(m) + '</span>';
  }
  if (!pending(v)) return '';
  const t = timerState(v.createdAt);
  return '<span class="timer ' + t.cls + '" data-t="' + esc(v.createdAt) + '">' + t.txt + '</span>';
}
// العداد بيحسب وقت الشغل بس، وبرة المواعيد بيقف
function timerState(created) {
  const el = workMs(created, now()), left = SLA_MIN * 60000 - el;
  if (!inWork(now())) return { cls: 't-off', txt: '⏸ ' + (el === 0 ? 'هتبدأ 9 الصبح' : (left > 0 ? clock(left) : 'متأخرة ' + clock(-left))) };
  const c = el < WARN_MIN * 60000 ? 'green' : left > 0 ? 'yellow' : 'red';
  return { cls: 't-' + c, txt: left > 0 ? '⏱ ' + clock(left) : '⚠ متأخرة ' + clock(-left) };
}
setInterval(() => {
  document.querySelectorAll('.timer[data-t]').forEach(el => {
    const t = timerState(el.dataset.t);
    el.className = 'timer ' + t.cls;
    el.textContent = t.txt;
  });
}, 1000);

// ---------- الإشعارات والصوت ----------
let audioCtx = null;
function enableAlerts() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().then(p => { updateBell(); if (p === 'granted') setupPush(true); });
  } else if ('Notification' in window && Notification.permission === 'granted') setupPush(true);
  else if ('Notification' in window && Notification.permission === 'denied') {
    setTimeout(() => toast('الإشعارات مقفولة للموقع ده - افتحها من إعدادات المتصفح (علامة القفل 🔒 جنب العنوان)'), 1500);
  }
  ding();
  ls('alerts', '1');
  updateBell();
  toast('الإشعارات والصوت شغالين 🔔');
}
function updateBell() {
  const ok = 'Notification' in window && Notification.permission === 'granted' && ls('alerts');
  $('bellBtn').classList.toggle('off', !ok);
  $('bellBtn').title = ok ? 'الإشعارات شغالة' : 'دوس هنا علشان تشغّل الإشعارات والصوت';
}
function ding() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [[880, 0], [1175, .16], [1568, .32]].forEach(([f, d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.35, t0 + d + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + d + .45);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + .5);
    });
  } catch (e) {}
}
// نغمة مزعجة (إنذار) - للفواتير المستنية كل 5 دقايق وللاستعجال
function alarm(times) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    const t0 = audioCtx.currentTime, n = times || 8;
    for (let k = 0; k < n; k++) {
      const d = k * .42;
      [[1400, 0], [700, .21]].forEach(([f, e]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + d + e); g.gain.linearRampToValueAtTime(.22, t0 + d + e + .01);
        g.gain.setValueAtTime(.22, t0 + d + e + .18); g.gain.linearRampToValueAtTime(0, t0 + d + e + .2);
        o.connect(g); g.connect(audioCtx.destination); o.start(t0 + d + e); o.stop(t0 + d + e + .21);
      });
    }
  } catch (e) {}
  if (navigator.vibrate) try { navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
}
function alertNew(list) {
  ding();
  const t = list.length === 1 ? (list[0].rejectCount ? 'الفرع عدّل وبعت تاني: ' : 'فاتورة جديدة من ') + list[0].store : list.length + ' فواتير جديدة';
  const b = list.map(v => v.supplier + ' - ' + money(v.total) + ' ج.م').join('\n');
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      showNote('🧾 ' + t, { body: b, tag: 'inv-' + list[0].id, requireInteraction: true }, { inv: list[0].id });
    } catch (e) {}
  }
  toast('🔔 ' + t);
}
// تنبيه متكرر طول ما فيه فواتير مستنية الإدخال (في مواعيد العمل بس)
function notify(title, body, id, tag) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      showNote(title, { body, tag: tag || ('inv-' + id), renotify: true, requireInteraction: true }, { inv: id || '' });
    } catch (e) {}
  }
}
function pendingAlert() {
  if (!token || !all.length || !inWork(now())) return;
  // الجودة: التنبيه على الفواتير المستنية مراجعتهم
  if (isQA()) {
    const q = all.filter(v => v.status === ST_QA);
    if (!q.length) { pendAt = 0; return; }
    if (pendAt && now() - pendAt < PENDING_ALERT_MIN * 60000) return;
    if (!pendAt) { pendAt = now(); return; }
    pendAt = now();
    const t = '🔍 ' + q.length + (q.length === 1 ? ' فاتورة مستنية' : ' فواتير مستنية') + ' مراجعة الجودة';
    alarm(8); notify(t, q.slice(0, 4).map(v => v.store + ' - ' + v.supplier + ' (' + durTxt(mins(v.doneAt, now())) + ')').join('\n'), q[0].id, 'pending');
    toast(t);
    return;
  }
  const list = all.filter(pending).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
  if (!list.length) { pendAt = 0; return; }
  if (pendAt && now() - pendAt < PENDING_ALERT_MIN * 60000) return;
  if (!pendAt) { pendAt = now(); return; } // أول مرة: نستنى الدورة الجاية
  pendAt = now();
  const nNew = list.filter(v => v.status !== ST_WORK).length, nWork = list.length - nNew;
  const t = '⏳ ' + list.length + (list.length === 1 ? ' فاتورة مستنية' : ' فواتير مستنية') + ' الإدخال';
  const b = (nNew ? nNew + ' لسه محدش استلمها' : '') + (nNew && nWork ? ' • ' : '') + (nWork ? nWork + ' بيتدخلوا' : '') + '\n' +
    list.slice(0, 4).map(v => v.store + ' - ' + v.supplier + ' (' + durTxt(mins(v.createdAt, now())) + ')').join('\n');
  alarm(8); notify(t, b, list[0].id, 'pending');
  toast(t);
}
setInterval(pendingAlert, 60000);
let urgeKnown = null;

// ---------- عداد النت (شغال على طول) ----------
const net = { ms: [], fails: 0, last: 0, state: 'good' };
async function netProbe() {
  if (!navigator.onLine) return netSet(null);
  const t = performance.now();
  try {
    const c = new AbortController(), to = setTimeout(() => c.abort(), 8000);
    await fetch('icon.png?n=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: c.signal });
    clearTimeout(to);
    netSet(performance.now() - t);
  } catch (e) { netSet(null); }
}
function netSet(ms) {
  if (ms === null) { net.fails++; } else { net.fails = 0; net.ms.push(ms); if (net.ms.length > 5) net.ms.shift(); net.last = ms; }
  const avg = net.ms.length ? net.ms.reduce((a, b) => a + b, 0) / net.ms.length : 0;
  const st = net.fails >= 2 || !navigator.onLine ? 'off' : net.fails === 1 || avg > 1500 ? 'slow' : avg > 600 ? 'ok' : 'good';
  const bars = { good: 3, ok: 2, slow: 1, off: 0 }[st];
  const txt = { good: 'النت ممتاز', ok: 'النت كويس', slow: 'النت بطيء', off: 'النت فاصل' }[st];
  const pill = $('netPill');
  if (!pill) return;
  pill.className = 'net ' + st;
  pill.querySelectorAll('.bars i').forEach((b, k) => b.classList.toggle('on', k < bars));
  $('netTxt').textContent = txt + (st !== 'off' && net.last ? ' • ' + Math.round(net.last) + 'ms' : '');
  if (st === 'off' && net.state !== 'off') toast('⚠️ النت فاصل - الفواتير الجديدة مش هتوصلك لحد ما يرجع');
  if (st !== 'off' && net.state === 'off') { toast('✅ النت رجع'); loadList(true); }
  net.state = st;
}
function netInfo() {
  const c = navigator.connection || {};
  const avg = net.ms.length ? Math.round(net.ms.reduce((a, b) => a + b, 0) / net.ms.length) : 0;
  toast('سرعة الرد: ' + (net.last ? Math.round(net.last) + 'ms' : '-') + ' • المتوسط: ' + (avg || '-') + 'ms' +
    (c.downlink ? ' • التحميل تقريبًا ' + c.downlink + ' Mbps' : '') + (c.effectiveType ? ' (' + c.effectiveType + ')' : ''));
}
window.addEventListener('online', netProbe);
window.addEventListener('offline', () => netSet(null));
setInterval(netProbe, 5000);
netProbe();

  // رقم على أيقونة التطبيق (لو الجهاز بيدعمها)

}

// ---------- القايمة ----------
async function loadList(quiet) {
  try {
    const r = await api('dList', { token });
    if (r.now) skew = new Date(r.now).getTime() - Date.now();
    const fresh = known ? r.invoices.filter(v => (!known.has(v.id) && v.status === ST_NEW) || (prevStatus[v.id] === ST_REJ && v.status === ST_NEW)) : [];
    const reviews = revKnown ? r.invoices.filter(v => v.reviewedBy && !revKnown.has(v.id)) : [];
    const urged = urgeKnown ? r.invoices.filter(v => (v.urgeCount || 0) > (urgeKnown[v.id] || 0) && pending(v)) : [];
    urgeKnown = {}; r.invoices.forEach(v => { urgeKnown[v.id] = v.urgeCount || 0; });
    known = new Set(r.invoices.map(v => v.id));
    revKnown = new Set(r.invoices.filter(v => v.reviewedBy).map(v => v.id));
    const oldStatus = prevStatus;
    prevStatus = {}; r.invoices.forEach(v => { prevStatus[v.id] = v.status; });
    all = r.invoices; stores = r.stores;
    tks = (r.tickets || []).map(t => Object.assign(t, { kind: 'tk' })); if (r.storePrio) storePrio = r.storePrio;
    tasks = r.tasks || []; jrs = r.jrs || []; if (r.storeColor) storeColor = r.storeColor; if (r.members) members = r.members;
    tasksAfterLoad();
    tkAfterLoad(tks);
    chatSum = r.chat || { threads: [], replies: [] };
    if (r.team) teamTick(r.team);
    if (r.me) { const first = !myRole; myRole = r.me.role || 'دعم'; myPhoto = r.me.photo || ''; renderWho(); if (first && isQA()) { tab = ST_QA; } if (first) setTimeout(() => startTour(false), 900); }
    const newMsgs = chatKnown ? chatSum.threads.filter(t => t.unread > (chatKnown[t.store + '|' + t.inv] || 0) && t.lastFrom === 'فرع') : [];
    chatKnown = {}; chatSum.threads.forEach(t => { chatKnown[t.store + '|' + t.inv] = t.unread; });
    const sel = $('fStore'), val = sel.value;
    sel.innerHTML = '<option value="">كل المحلات</option>' + stores.map(s => '<option>' + esc(s) + '</option>').join('');
    sel.value = val;

function renderList() {

// ---------- تذاكر الدعم الفني: في نفس طابور الفواتير ----------
const TK_NEW = 'جديدة', TK_WORK = 'شغالين عليها', TK_SOLVED = 'اتحلت', TK_CLOSED = 'اتقفلت';
const TK_URGENT = 'مستعجل', TK_NORMAL = 'عادي', TK_SCHED = 'مجدول', TK_PICK_MIN = 5;

const tkOpen = v => v.status === TK_NEW || v.status === TK_WORK;
const tkDue = v => v.priority !== TK_SCHED || !v.scheduledAt || new Date(v.scheduledAt).getTime() <= now();
const tkUrgentWaiting = v => v.kind === 'tk' && v.priority === TK_URGENT && v.status === TK_NEW;
function tkLate(v) {
  if (!tkOpen(v) || !tkDue(v)) return false;
  if (tkUrgentWaiting(v) && (now() - new Date(v.createdAt).getTime()) / 60000 > TK_PICK_MIN) return true;
  const start = v.priority === TK_SCHED && v.scheduledAt ? v.scheduledAt : v.createdAt;
  return mins(start, now()) > v.resolveMin;
}
// التذكرة في أنهي كارت من الكروت اللي فوق
function tkInTab(k, v) {
  switch (k) {
    case ST_NEW: return v.status === TK_NEW && tkDue(v);
    case ST_WORK: return v.status === TK_WORK;
    case ST_DONE: return v.status === TK_SOLVED || v.status === TK_CLOSED;
    case 'late': return tkLate(v);
    case 'urge': return tkOpen(v) && v.priority === TK_URGENT;
    case 'tk': return tkOpen(v);
    case 'sched': return tkOpen(v) && !tkDue(v);
    case 'الكل': return true;
    default: return false;
  }
}
// ترتيب الطابور: مستعجلة (وقف حال) ← الفواتير ← عادية ← مجدولة، وبعدين أهمية العميل، وبعدين الأقدم
function qRank(v) { return v.kind === 'tk' ? (v.priority === TK_URGENT ? 0 : v.priority === TK_SCHED ? 3 : 2) : 1; }
function qTime(v) { return v.kind === 'tk' && v.priority === TK_SCHED && v.scheduledAt ? v.scheduledAt : v.kind === 'task' ? (v.due || v.createdAt) : v.kind === 'jr' ? (v.updatedAt || v.createdAt || v.at) : v.createdAt; }

}
const PRIO_TAG = { [TK_URGENT]: '<span class="tkp tkp-u">🚨 مستعجل</span>', [TK_NORMAL]: '<span class="tkp tkp-n">عادي</span>', [TK_SCHED]: '<span class="tkp tkp-s">📅 مجدول</span>' };
const TK_ST_CLS = { [TK_NEW]: 'b-new', [TK_WORK]: 'b-work', [TK_SOLVED]: 'b-done', [TK_CLOSED]: 'b-done' };
function tkBadge(v) { return '<span class="badge ' + (TK_ST_CLS[v.status] || 'b-new') + '">' + esc(v.status) + '</span>'; }
function stars(n) { return n ? '<span class="stars">' + '★'.repeat(n) + '<i>' + '★'.repeat(5 - n) + '</i></span>' : ''; }
// عداد التذكرة: المستعجلة لحد ما تتستلم (5 دقايق)، وبعدها وقت الحل المكتوب في الكارت
function tkTimer(v) {
  if (v.status === TK_SOLVED || v.status === TK_CLOSED) {
    if (!v.solvedAt) return '';
    const m = mins(v.createdAt, v.solvedAt);
    return '<span class="timer t-done-' + (m <= v.resolveMin ? 'green' : 'red') + '">✓ ' + durTxt(m) + '</span>';
  }
  if (!tkDue(v)) return '<span class="timer t-off">📅 ' + dt(v.scheduledAt) + '</span>';

}
function tkTimerState(v) {

    const left = TK_PICK_MIN * 60000 - (now() - new Date(v.createdAt).getTime());
    return { cls: left > 0 ? 't-red blink' : 't-red', txt: left > 0 ? '🚨 استلمها خلال ' + clock(left) : '🚨 متأخرة في الاستلام ' + clock(-left) };
  }
  const start = v.priority === TK_SCHED && v.scheduledAt ? v.scheduledAt : v.createdAt;
  const el = workMs(start, now()), left = v.resolveMin * 60000 - el;
  if (!inWork(now())) return { cls: 't-off', txt: '⏸ ' + (left > 0 ? clock(left) : 'متأخرة ' + clock(-left)) };

// بانر الإنذار: طول ما فيه تذكرة مستعجلة محدش استلمها، الصوت شغال كل 4 ثواني

// بعد كل تحميل للقايمة: تنبيه بالتذاكر الجديدة وردود الفروع
function tkAfterLoad(list) {
  const prev = tkKnown;
  tkKnown = {}; list.forEach(v => { tkKnown[v.id] = v.updatedAt + '|' + v.status; });
  if (!prev || isQA()) return;
  list.forEach(v => {
    if (!(v.id in prev)) {
      if (v.priority === TK_SCHED && !tkDue(v)) return;
      v.priority === TK_URGENT ? alarm(6) : ding();
      notifyTk((v.priority === TK_URGENT ? '🚨 تذكرة مستعجلة - ' : '🛠️ تذكرة دعم - ') + v.store, v.title + (v.desc ? ': ' + v.desc : ''), v.id);
      toast('🛠️ تذكرة جديدة من ' + v.store + ': ' + v.title);

      notifyTk('💬 ' + v.store + ' - ' + v.title, v.status === TK_WORK && v.reopens ? 'الفرع فتح التذكرة تاني' : 'الفرع رد على التذكرة', v.id);

let vs = { s: 1, x: 0, y: 0, r: 0 };
function initViewer() {

  const st = $('vstage');

  st.onwheel = e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : .89); };
  st.onpointerdown = e => { drag = { x: e.clientX - vs.x, y: e.clientY - vs.y }; st.setPointerCapture(e.pointerId); st.style.cursor = 'grabbing'; };
  st.onpointermove = e => { if (drag) { vs.x = e.clientX - drag.x; vs.y = e.clientY - drag.y; apply(); } };
  st.onpointerup = () => { drag = null; st.style.cursor = 'grab'; };
  st.ondblclick = () => zoom(1.6);
  showPic(Math.min(pIdx, Math.max(P.length - 1, 0)));
}
async function showPic(k) {
  const P = pics(); if (!P.length) return;
  pIdx = k;
  document.querySelectorAll('.th').forEach((el, j) => el.classList.toggle('on', j === k));
  $('pg').textContent = P[k].label + ' • ' + (k + 1) + ' من ' + P.length;

}
function fit() {
  const im = $('vimg'), st = $('vstage'); if (!im || !im.naturalWidth) return;
  const rotated = vs.r % 180 !== 0;
  const w = rotated ? im.naturalHeight : im.naturalWidth, h = rotated ? im.naturalWidth : im.naturalHeight;
  vs.s = Math.min(st.clientWidth / w, st.clientHeight / h) * .98; vs.x = 0; vs.y = 0; apply();
}
function zoom(k) { vs.s = Math.min(8, Math.max(.1, vs.s * k)); apply(); }
function rot() { vs.r = (vs.r + 90) % 360; fit(); }
function apply() { const im = $('vimg'); if (im) im.style.transform = 'translate(-50%,-50%) translate(' + vs.x + 'px,' + vs.y + 'px) scale(' + vs.s + ') rotate(' + vs.r + 'deg)'; }

// ---------- الإكسل: 4 أعمدة (xlsx أو xls 2003) ----------
function saveSheet(rows, cols, sheet, name, type) {
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = cols.map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, sheet);
  const file = name.replace(/[\\/:*?"<>|]/g, '-') + '.' + type;
  try {
    const data = XLSX.write(wb, { bookType: type === 'xls' ? 'biff8' : 'xlsx', type: 'array' });
    const mime = type === 'xls' ? 'application/vnd.ms-excel' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    saveBlob(new Blob([data], { type: mime }), file);
  } catch (e) { toast('ما قدرناش نعمل الإكسل: ' + msg(e)); }
}
// تنزيل ملف: على الموبايل بيفتح المشاركة، وعلى الكمبيوتر بينزل في التنزيلات
async function saveBlob(blob, file) {
  const mobile = matchMedia('(pointer:coarse)').matches;
  if (mobile && navigator.canShare) {
    try {
      const f = new File([blob], file, { type: blob.type });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: file }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = file; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
  toast('⬇️ اتنزل: ' + file + ' - هتلاقيه في التنزيلات (Downloads)');
}
function excel(type) {
  const v = cur.invoice;
  const rows = [['اسم الصنف', 'الكمية', 'السعر', 'الإجمالي']].concat(cur.lines.map(l => [l.name, l.pieces, Math.round(l.piecePrice * 10000) / 10000, l.total]));
  saveSheet(rows, [40, 10, 12, 14], 'الفاتورة', 'فاتورة ' + v.supplier + ' - ' + v.store, type || 'xlsx');
}
// الأصناف اللي سعر بيعها اتعدل بس: اسم الصنف والسعر الجديد
function pricesExcel() {
  const v = cur.invoice;
  const rows = [['اسم الصنف', 'سعر البيع الجديد']].concat(cur.lines.filter(l => l.newSale !== null).map(l => [l.name, l.newSale]));
  saveSheet(rows, [40, 16], 'الأسعار', 'أسعار بيع - ' + v.supplier + ' - ' + v.store, 'xls');
}

function bindDrop() {
  const d = $('drop');
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); });
}
document.addEventListener('paste', e => {
  if (!$('drop')) return;
  const files = [...(e.clipboardData?.items || [])].filter(x => x.type.startsWith('image/')).map(x => x.getAsFile());
  if (files.length) { e.preventDefault(); addFiles(files); }
});
function addFiles(list) {
  [...list].filter(f => f && f.type.startsWith('image/')).forEach(async f => { shots.push(await shrinkScreen(f)); renderShots(); });
}

function shrinkScreen(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 1800, k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function renderShots() {
  const el = $('shots'); if (!el) return;

function loadImage(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function buildMerged() {

        ? '<button class="btn" onclick="copyImg()">1️⃣ انسخ الصورة</button>' +

  } catch (e) { box.innerHTML = '<div class="err">ما قدرناش نعمل الصورة المدمجة: ' + esc(msg(e)) + '</div>'; }

function draw(pairs, v, logo) {
  const H = 1100, gap = 24, pad = 30, labelH = 56;
  const rows = pairs.map(([branch, sys]) => {
    const wb = branch.width * H / branch.height, ws = sys.width * H / sys.height;
    return { branch, sys, wb, ws, w: wb + ws + gap };
  });
  let W = Math.max(1400, Math.max(...rows.map(r => r.w)) + pad * 2);
  const c = document.createElement('canvas'), x0 = c.getContext('2d');
  x0.font = 'bold 46px Cairo, Tahoma, Arial';
  const logoH = 120, logoW = logo.width * logoH / logo.height;
  const lines = wrap(x0, captionText(v), W - pad * 3 - logoW);
  const head = Math.max(logoH + 50, 50 + lines.length * 64 + 20);
  c.width = W; c.height = head + rows.length * (H + labelH + gap) + pad + 60;
  const x = c.getContext('2d');
  x.fillStyle = '#F3F7FC'; x.fillRect(0, 0, c.width, c.height);
  const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#1479D3'); g.addColorStop(1, '#0B3D6E');
  x.fillStyle = g; x.fillRect(0, 0, W, head);
  // اللوجو في كارت أبيض على اليمين
  x.fillStyle = '#fff'; roundRect(x, W - pad - logoW - 30, (head - logoH - 20) / 2, logoW + 30, logoH + 20, 22); x.fill();
  x.drawImage(logo, W - pad - logoW - 15, (head - logoH) / 2, logoW, logoH);
  x.fillStyle = '#fff'; x.font = 'bold 46px Cairo, Tahoma, Arial'; x.textAlign = 'right'; x.direction = 'rtl'; x.textBaseline = 'top';
  const tx = W - pad * 2 - logoW - 30, ty = (head - lines.length * 64) / 2;
  lines.forEach((ln, k) => x.fillText(ln, tx, ty + k * 64));
  let y = head + gap;
  x.textAlign = 'center';
  rows.forEach(r => {
    const left = (W - r.w) / 2;
    x.drawImage(r.sys, left, y + labelH, r.ws, H);                 // شمال: السيستم
    x.drawImage(r.branch, left + r.ws + gap, y + labelH, r.wb, H); // يمين: فاتورة الفرع
    x.font = 'bold 36px Cairo, Tahoma, Arial'; x.fillStyle = '#0B3D6E';
    x.fillText('🖥 السيستم', left + r.ws / 2, y + 6);
    x.fillText('🧾 فاتورة الفرع', left + r.ws + gap + r.wb / 2, y + 6);
    y += H + labelH + gap;
  });
  x.fillStyle = '#6B7785'; x.font = '600 28px Cairo, Tahoma, Arial';
  x.fillText('مدقق - ' + v.doneBy + ' - ' + dt(v.doneAt), W / 2, c.height - 50);
  const max = 2600;
  if (c.width > max) {
    const k = max / c.width, s = document.createElement('canvas');
    s.width = max; s.height = Math.round(c.height * k);
    s.getContext('2d').drawImage(c, 0, 0, s.width, s.height);
    return s.toDataURL('image/jpeg', 0.86);
  }
  return c.toDataURL('image/jpeg', 0.86);
}
function roundRect(x, l, t, w, h, r) { x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r); x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath(); }
function wrap(ctx, text, maxW) {
  const words = text.split(' '), out = []; let line = '';
  words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
  if (line) out.push(line);
  return out;
}
function mergedName() { const v = cur.invoice; return ('فاتورة ' + v.supplier + ' - ' + v.systemNo).replace(/[\\/:*?"<>|]/g, '-') + '.jpg'; }

  } catch (e) { if (e && e.name === 'AbortError') return; }

  toast('نزّلت الصورة ونسخت الجملة - افتح واتساب وابعتهم للفرع');
}
// ينسخ الصورة المدمجة (بعدها الدعم يفتح الجروب ويلصق Ctrl+V)
async function copyImg() {
  try {
    const im = await loadImage($('mergedImg').src);
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    c.getContext('2d').drawImage(im, 0, 0);
    const png = await new Promise(r => c.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
    toast('✅ الصورة اتنسخت - دوس "افتح الجروب" والصق Ctrl+V');
  } catch (e) {
    download();
    toast('ما قدرتش أنسخ الصورة، فنزّلتها - ابعتها في الجروب');
  }
}
function download() { const a = document.createElement('a'); a.href = $('mergedImg').src; a.download = mergedName(); a.click(); }
async function copyCap() {
  try { await navigator.clipboard.writeText(captionText(cur.invoice)); toast('اتنسخت الجملة 📋'); }
  catch (e) { const r = document.createRange(); r.selectNode($('cap')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('حدّد الجملة وانسخها'); }
}

// kind: 'perf' = تقرير الأداء (الفواتير)، 'price' = تقرير أسعار الشراء (الأصناف)
async function makeReport(kind) {
  const isPrice = kind === 'price';
  const st = $('repStore').value, from = new Date($('repFrom').value + 'T00:00:00'), to = new Date($('repTo').value + 'T23:59:59');
  // نفتح النافذة الأول علشان المتصفح ما يمنعهاش
  const w = window.open('', '_blank');
  if (!w) return toast('المتصفح منع فتح التقرير - اسمح بالنوافذ المنبثقة للموقع ده');
  const wait = t => { try { w.document.body.innerHTML = '<div style="font-family:Tahoma;padding:40px;text-align:center;direction:rtl">⏳ ' + t + '</div>'; } catch (e) {} };
  w.document.write('<body dir="rtl"></body>'); wait('جاري تجهيز التقرير...');

  const done = all.filter(v => v.store === st && v.status === ST_DONE && v.doneAt && new Date(v.doneAt) >= from && new Date(v.doneAt) <= to)
    .sort((a, b) => a.doneAt.localeCompare(b.doneAt));
  // الأصناف: مرة واحدة لكل الفواتير، ولو ما نفعش نجيب كل فاتورة لوحدها
  let L = {};
  if (isPrice && done.length) {
    try { L = (await api('dLinesBulk', { token, ids: done.map(v => v.id) }, true)).lines || {}; } catch (e) { L = {}; }
    const miss = done.filter(v => !(L[v.id] && L[v.id].length) && v.count > 0);
    for (let i = 0; i < miss.length; i += 4) {
      wait('بحمّل أصناف الفواتير... ' + Math.min(i + 4, miss.length) + ' / ' + miss.length);
      await Promise.all(miss.slice(i, i + 4).map(v => api('dInvoice', { token, id: v.id }).then(r => { L[v.id] = r.lines || []; }).catch(() => {})));
    }
  }
  const waiting = all.filter(v => v.store === st && v.status !== ST_DONE).length;
  // التاسكات والتذاكر وطلبات الجرد في الفترة (تقرير الأداء)
  let SR = { tasks: [], tickets: [], jrs: [] }, srErr = '';
  if (!isPrice) {
    wait('بحمّل التاسكات والتذاكر...');
    try { SR = await api('dStoreReport', { token, store: st, from: from.toISOString(), to: to.toISOString() }); } catch (e) { srErr = msg(e); }
  }
  const total = done.reduce((s, v) => s + v.total, 0);
  const avg = done.length ? done.reduce((s, v) => s + mins(v.createdAt, v.doneAt), 0) / done.length : 0;
  const ontime = done.length ? done.filter(v => mins(v.createdAt, v.doneAt) <= SLA_MIN).length / done.length : 0;
  const pch = done.reduce((s, v) => s + (v.priceChanges || 0), 0);
  const d2 = x => new Date(x).toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric', year: 'numeric' });
  const logo = new URL('logo_wide.png', location.href).href;

  // ---- سطر الصنف بشكل موحّد (السعر = سعر القطعة)
  const P = l => Number(l.price != null ? l.price : l.piecePrice) || 0;
  const Q = l => Number(l.pieces != null ? l.pieces : l.qty) || 0;
  const O = l => (l.oldPrice === null || l.oldPrice === undefined || l.oldPrice === '') ? null : Number(l.oldPrice);
  const chg = l => {
    const o = O(l), p = P(l);
    if (o === null || !(o > 0) || !(p > 0)) return null;
    if (Math.abs(p - o) < 0.01) return 0;
    return (p - o) / o * 100;
  };
  const pctTxt = p => (p > 0 ? '▲ +' : '▼ ') + Math.abs(p).toFixed(1) + '%';
  const pctHtml = l => {
    const p = chg(l);
    if (p === null) return l.isNew ? '<span class="tg new">🆕 جديد</span>' : '<span class="mut">-</span>';
    if (p === 0) return '<span class="tg eq">ثابت</span>';
    return '<span class="tg ' + (p > 0 ? 'up' : 'dn') + '" dir="ltr">' + pctTxt(p) + '</span>';
  };

  // ---- تجميع الأصناف على الفترة كلها (الصنف بالباركود، ولو مفيش بالاسم)
  const items = {};
  done.forEach(v => (L[v.id] || []).forEach(l => {
    const key = (l.barcode && String(l.barcode).trim()) || String(l.name || '').trim();
    if (!key) return;
    const it = items[key] = items[key] || { name: l.name, barcode: l.barcode || '', sup: {}, qty: 0, spend: 0, impact: 0, first: null, last: null, isNew: false, n: 0 };
    it.n++; it.qty += Q(l); it.spend += Number(l.total) || 0; it.sup[v.supplier] = 1; it.isNew = it.isNew || !!l.isNew;
    const o = O(l), p = P(l);
    if (o > 0 && p > 0) it.impact += (p - o) * Q(l);
    if (!it.first) it.first = { o: o > 0 ? o : null, p: p, at: v.doneAt };
    it.last = { p: p, at: v.doneAt, sup: v.supplier };
  }));
  const list = Object.values(items).map(it => {
    const base = it.first.o || null, now2 = it.last.p;
    it.pct = base > 0 && now2 > 0 ? (Math.abs(now2 - base) < 0.01 ? 0 : (now2 - base) / base * 100) : null;
    it.base = base; it.now = now2; it.supTxt = Object.keys(it.sup).join('، ');
    return it;
  });
  const ups = list.filter(i => i.pct > 0).sort((a, b) => b.pct - a.pct);
  const dns = list.filter(i => i.pct < 0).sort((a, b) => a.pct - b.pct);
  const flat = list.filter(i => i.pct === 0).length;
  const fresh = list.filter(i => i.pct === null && i.isNew).length;
  const impactUp = list.reduce((s, i) => s + Math.max(0, i.impact), 0), impactDn = list.reduce((s, i) => s + Math.min(0, i.impact), 0);

  const supRows = Object.entries(bySup).sort((a, b) => b[1].t - a[1].t);

  // ---- أهم الملاحظات (بالكلام)
  const notes = [];
  if (ups.length) notes.push('📈 <b>' + ups.length + ' صنف</b> سعر شرائه زاد' + (impactUp > 0 ? '، وده زوّد تكلفة المشتريات بـ <b class="up">' + money(impactUp) + ' ج.م</b> في الفترة' : ''));
  if (ups[0]) notes.push('🔺 أكبر زيادة: <b>' + esc(ups[0].name) + '</b> (' + esc(ups[0].last.sup) + ') <b class="up" dir="ltr">+' + ups[0].pct.toFixed(1) + '%</b> - من ' + money(ups[0].base) + ' لـ ' + money(ups[0].now));
  if (dns.length) notes.push('📉 <b>' + dns.length + ' صنف</b> سعره قل' + (impactDn < 0 ? '، ووفّر <b class="dn">' + money(-impactDn) + ' ج.م</b>' : ''));
  if (dns[0]) notes.push('🔻 أكبر نقص: <b>' + esc(dns[0].name) + '</b> (' + esc(dns[0].last.sup) + ') <b class="dn" dir="ltr">' + dns[0].pct.toFixed(1) + '%</b> - من ' + money(dns[0].base) + ' لـ ' + money(dns[0].now));
  if (supRows[0] && total > 0) notes.push('🏷 أكبر مورد: <b>' + esc(supRows[0][0]) + '</b> بـ ' + Math.round(supRows[0][1].t / total * 100) + '% من المشتريات (' + supRows[0][1].n + ' فاتورة)');
  if (bySpend[0] && total > 0) notes.push('🛒 أكبر صنف اتصرف عليه: <b>' + esc(bySpend[0].name) + '</b> بـ ' + money(bySpend[0].spend) + ' ج.م');
  if (fresh) notes.push('🆕 <b>' + fresh + ' صنف جديد</b> اتشرى لأول مرة');
  if (hasLines && !ups.length && !dns.length) notes.push('✅ مفيش أي تغيير في أسعار الشراء في الفترة دي');

  // ---- رسم: أكبر التغييرات (أحمر زيادة / أخضر نقص)
  const top = ups.slice(0, 8).concat(dns.slice(0, 8)).sort((a, b) => b.pct - a.pct);
  const maxAbs = Math.max(1, ...top.map(i => Math.abs(i.pct)));
  const chart = top.length ? '<div class="chart">' + top.map(i => {

function openChat(store, inv, boxId, title) {

async function loadChat(quiet) {
  if (!chatOpen) return;
  const c = chatOpen;
  try {
    const r = await api('dChat', { token, store: c.store, inv: c.inv });
    if (chatOpen !== c) return;
    c.msgs = r.messages;
    renderMsgs();
    // اتقرت: نصفّر العداد محليًا
    const t = chatSum.threads.find(x => x.store === c.store && x.inv === c.inv);
    if (t && t.unread) { t.unread = 0; if (chatKnown) chatKnown[c.store + '|' + c.inv] = 0; renderStats(); renderList(); if (!$('pageStores').classList.contains('hidden')) renderBoard(); }
  } catch (e) { if (!quiet && chatEl('.msgs')) chatEl('.msgs').innerHTML = '<div class="err">' + esc(msg(e)) + '</div>'; }
}
function renderMsgs() {
  const el = chatEl('.msgs');

  const L = chatOpen.msgs;
  el.innerHTML = L.length ? L.map(m => {

// تصغير الصورة قبل الرفع (أقصى ضلع [max] بكسل) ← base64 من غير البادئة
function shrink(file, max, q) {
  return new Promise((ok, bad) => {
    const r = new FileReader();
    r.onerror = bad;
    r.onload = () => {
      const im = new Image();
      im.onerror = () => bad(new Error('الملف ده مش صورة'));
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', q).split(',')[1]);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function tourVisible(sel) {
  const el = sel && document.querySelector(sel);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0 ? el : null;
}
function tourShow(i) {
  // الخطوات اللي جزءها مش ظاهر (زي الموبايل) بنعديها
  while (i >= 0 && i < tourL.length && tourL[i].el && !tourVisible(tourL[i].el)) i += (i >= tourI ? 1 : -1);
  if (i < 0) i = 0;
  if (i >= tourL.length) return endTour();
  tourI = i;
  const s = tourL[i], last = i === tourL.length - 1;
  $('tourTip').innerHTML = '<h4>' + esc(s.t) + '</h4><p>' + esc(s.b) + '</p>' + (s.html || '') +
    '<div class="tb"><span class="dots">' + (i + 1) + ' / ' + tourL.length + '</span><span class="sp"></span>' +
    (last ? '' : '<button class="btn ghost" onclick="endTour()">تخطي</button>') +
    (i > 0 ? '<button class="btn soft" onclick="tourShow(tourI-1)">السابق</button>' : '') +
    '<button class="btn" onclick="tourShow(tourI+1)">' + (last ? 'تمام 👍' : 'التالي ←') + '</button></div>';
  const el = tourVisible(s.el);
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  setTimeout(tourPos, el ? 260 : 0);
  tourPos();
}
function tourPos() {
  const hole = $('tourHole'), tip = $('tourTip');
  if (!hole || !tourL[tourI]) return;
  const el = tourVisible(tourL[tourI].el), vw = innerWidth, vh = innerHeight, pad = 6;
  if (!el) {
    Object.assign(hole.style, { left: vw / 2 + 'px', top: vh / 2 + 'px', width: '0px', height: '0px', outlineWidth: '0px' });
    Object.assign(tip.style, { left: Math.max(16, (vw - tip.offsetWidth) / 2) + 'px', top: Math.max(16, (vh - tip.offsetHeight) / 2) + 'px' });
    return;
  }
  const r = el.getBoundingClientRect();
  const top = Math.max(4, r.top - pad), h = Math.min(vh - 8, r.bottom + pad) - top;
  Object.assign(hole.style, { left: (r.left - pad) + 'px', top: top + 'px', width: (r.width + pad * 2) + 'px', height: h + 'px', outlineWidth: '3px' });
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let y = top + h + 12;
  if (y + th > vh - 8) y = top - th - 12;
  if (y < 8) y = Math.max(8, vh - th - 16); // الجزء كبير: الشرح تحت الشاشة
  const x = Math.min(vw - tw - 16, Math.max(16, r.left + r.width / 2 - tw / 2));
  Object.assign(tip.style, { left: x + 'px', top: y + 'px' });
}

function teamTyping(t) {
  t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px';

  const old = $('tComp').querySelector('.mpop'); if (old) old.remove();

  const list = [{ email: 'all', name: 'الكل', photo: '' }].concat(team.members.filter(x => x.email !== team.me)).filter(x => !q || x.name.indexOf(q) !== -1);

function teamMention(k) {

  const x = p.list[k], end = t.selectionStart;
  t.value = t.value.slice(0, p.start) + '@' + x.name + ' ' + t.value.slice(end);
  const pos = p.start + x.name.length + 2; t.setSelectionRange(pos, pos); t.focus();
  const pop = $('tComp').querySelector('.mpop'); if (pop) pop.remove(); team.mpop = null;

function teamKey(e) {
  const p = team.mpop;
  if (p) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); p.i = (p.i + (e.key === 'ArrowDown' ? 1 : p.list.length - 1)) % p.list.length;
      $('tComp').querySelectorAll('.mpop div').forEach((d, k) => d.classList.toggle('on', k === p.i)); return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return teamMention(p.i); }
    if (e.key === 'Escape') { $('tComp').querySelector('.mpop').remove(); team.mpop = null; return; }

const TEAM_MAX_MB = 20;
function fileB64(file) {
  return new Promise((ok, bad) => { const r = new FileReader(); r.onerror = bad; r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(file); });
}
async function teamAttach(file, kind) {
  if (!file) return;
  if (file.size > TEAM_MAX_MB * 1048576) return toast('الملف أكبر من ' + TEAM_MAX_MB + ' ميجا - ابعت فيديو أقصر');
  kind = kind || (file.type.indexOf('image/') === 0 ? 'image' : file.type.indexOf('video/') === 0 ? 'video' : file.type.indexOf('audio/') === 0 ? 'audio' : 'file');
  try {
    const b64 = kind === 'image' && !/gif/.test(file.type) ? await shrink(file, 1600, .8) : await fileB64(file);
    const mime = kind === 'image' && !/gif/.test(file.type) ? 'image/jpeg' : (file.type || 'application/octet-stream');
    team.att = { kind, b64, mime, fileName: file.name || kind, size: Math.round(b64.length * .75), preview: URL.createObjectURL(file) };
    renderComposer();
  } catch (e) { toast(msg(e)); }
}
function teamFilePicked(inp) { const f = inp.files[0]; inp.value = ''; teamAttach(f); }
function teamPaste(e) {
  const it = [...((e.clipboardData || {}).items || [])].find(x => x.kind === 'file');
  if (it) { e.preventDefault(); teamAttach(it.getAsFile()); }
}

let rec = null;
async function recStart() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('المتصفح ده مش بيسجل صوت');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const mr = new MediaRecorder(stream, type ? { mimeType: type } : {});
    rec = { mr, stream, chunks: [], t0: Date.now(), send: false, tick: 0 };
    mr.ondataavailable = e => { if (e.data.size) rec.chunks.push(e.data); };
    mr.onstop = async () => {
      const r = rec; rec = null; clearInterval(r.tick);
      r.stream.getTracks().forEach(t => t.stop());
      team.recording = false;
      if (r.send && r.chunks.length) {
        const blob = new Blob(r.chunks, { type: mr.mimeType || 'audio/webm' });
        const ext = /mp4/.test(blob.type) ? 'm4a' : /ogg/.test(blob.type) ? 'ogg' : 'webm';
        const f = new File([blob], 'رسالة صوتية.' + ext, { type: blob.type.split(';')[0] });
        await teamAttach(f, 'audio');
        teamSend();
      } else renderComposer();
    };
    mr.start(250);
    team.recording = true; renderComposer();
    rec.tick = setInterval(() => { const s = Math.floor((Date.now() - rec.t0) / 1000), el = $('recT'); if (el) el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (s >= 300) recStop(true); }, 500);
  } catch (e) { toast('اسمح للمتصفح يستخدم المايك 🎤'); }
}
function recStop(send) { if (!rec) return; rec.send = send; rec.mr.stop(); }

let sh = { week: null, data: null, att: [] };
function dlg(html) { closeDlg(); document.body.insertAdjacentHTML('beforeend', '<div id="dlg" onclick="if(event.target===this)closeDlg()"><div class="box">' + html + '</div></div>'); }

// أول الأسبوع = السبت (حسب يوم الشغل اللي بيبدأ 9 الصبح)
function weekStart_(key) { const p = key.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2])); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 1) % 7)); return d.toISOString().slice(0, 10); }
function dayAdd_(key, n) { const p = key.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return d.toISOString().slice(0, 10); }
function dayName_(key) { const p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12).toLocaleDateString('ar-EG', { weekday: 'long' }); }
function dayShort_(key) { const p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12).toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' }); }
// بداية/نهاية وردية في يوم شغل (الساعة قبل 9 = اليوم اللي بعده)
function shiftAt_(key, hm) { const p = key.split('-').map(Number), q = hm.split(':').map(Number); return new Date(p[0], p[1] - 1, p[2] + (q[0] < 9 ? 1 : 0), q[0], q[1]).getTime(); }
const SHIFT_X = { id: 'X', name: 'وردية خاصة', from: '12:00', to: '20:00' };
// مواعيد الشخص في الوردية: مواعيده الخاصة لو متكتبة، وإلا مواعيد الوردية
function rowTimes_(r, defs) { if (r.from && r.to) return { from: r.from, to: r.to }; const df = defs.find(x => x.id === r.shift); return df ? { from: df.from, to: df.to } : null; }
function rowSpan_(r, defs) { const t = rowTimes_(r, defs); return t ? shiftSpan_(r.day, t) : null; }
function shiftSpan_(key, def) { const a = shiftAt_(key, def.from); let b = shiftAt_(key, def.to); if (b <= a) b += 864e5; return [a, b]; }
async function renderShifts(keep) {
  const today = dayKey9_(now());
  if (!sh.week) sh.week = weekStart_(today);
  const from = sh.week, to = dayAdd_(sh.week, 6);
  sh.cache = sh.cache || {};
  const wk = sh.week, hit = sh.cache[wk];
  // لو الأسبوع ده اتفتح قبل كده بنعرضه فورًا ونحدّث من السيرفر في الخلفية
  if (hit) { sh.data = hit; sh.att = sh.att || []; drawShifts_(); }
  else if (!keep || !sh.data) $('pageShifts').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try {
    const [d, a] = await Promise.all([api('dShifts', { token, from, to }), api('dAttendance', { token, from: today, to: today }).catch(() => ({ rows: [] }))]);
    if (sh.pending) return;                    // فيه حفظ لسه رايح للسيرفر: ما نكتبش فوق التعديل
    sh.cache[wk] = d; sh.att = a.rows || [];
    if (sh.week !== wk) return;
    sh.data = d;
  } catch (e) { if (!hit) $('pageShifts').innerHTML = '<div class="pane err">' + esc(msg(e)) + '</div>'; else toast(msg(e)); return; }
  drawShifts_();
}
function onlineNow_(email) { const r = sh.att.find(x => x.email === email); return r && (now() - new Date(r.last).getTime()) < 4 * 60000; }
// ---------- الورديات كتايم لاين: كل يوم خط من 9 الصبح، وكل موظف شريط بلونه ----------
const TL_COLORS = ['#1479D3', '#6C4BD8', '#E67E00', '#16A085', '#C2185B', '#2E7D32', '#8D6E63', '#0097A7', '#D84315', '#5E35B1', '#AD1457', '#558B2F'];
function tlColor_(email) { const L = (sh.data.members || []).map(m => m.email).sort(); const i = L.indexOf(email); return TL_COLORS[(i < 0 ? L.length : i) % TL_COLORS.length]; }
function tlH_(hm) { const q = String(hm).split(':').map(Number); let h = q[0] + (q[1] || 0) / 60; if (h < 9) h += 24; return h; }      // 08:00 = 32 (بكرة الصبح)
function tlHM_(h) { h = ((h % 24) + 24) % 24; const H = Math.floor(h + 1e-9), M = Math.round((h - H) * 60) % 60; return String(H).padStart(2, '0') + ':' + String(M).padStart(2, '0'); }
function tlSpanH_(r, defs) { const t = rowTimes_(r, defs); if (!t) return null; const a = tlH_(t.from); let b = tlH_(t.to); if (b <= a) b += 24; return [a, b]; }
function tlRange_(rows, defs) {
  let S = 9, E = 25;
  defs.forEach(df => { const a = tlH_(df.from); let b = tlH_(df.to); if (b <= a) b += 24; E = Math.max(E, b); });
  rows.forEach(r => { const s = tlSpanH_(r, defs); if (s) { S = Math.min(S, Math.floor(s[0])); E = Math.max(E, Math.ceil(s[1])); } });

function tlCover_(rows, defs, S, E) {
  const out = [];

    const m = h + 0.25;
    out.push(new Set(rows.filter(r => { const s = tlSpanH_(r, defs); return s && s[0] <= m && s[1] > m; }).map(r => r.email)).size);
  }
  return out;
}
function tlDayLevel_(day) {
  const d = sh.data, rows = d.rows.filter(r => r.day === day);

}

      (nowPpl.length ? nowPpl.map(r => '<span class="chip2' + (r.email === d.me ? ' me' : '') + '">' + (onlineNow_(r.email) ? '<i class="on"></i>' : '⚪') + esc(r.name) +

// ---------- السحب: نقل الشريط أو تكبيره وتصغيره (كل ربع ساعة) ----------
function tlBindDrag_(S, E) {
  const box = $('tlBox'); if (!box) return;
  box.querySelectorAll('.tbar.drag').forEach(bar => {
    bar.onpointerdown = ev => {
      if (ev.button > 0) return;
      const r = sh.data.rows[+bar.dataset.ix]; if (!r) return;
      const mode = ev.target.dataset && ev.target.dataset.m || 'move';
      const w = bar.parentNode.getBoundingClientRect().width, span = E - S, s0 = tlSpanH_(r, sh.data.defs);
      const x0 = ev.clientX; let a = s0[0], b = s0[1], moved = false;
      bar.setPointerCapture(ev.pointerId);
      bar.onpointermove = e => {
        const dh = Math.round((-(e.clientX - x0) / w * span) * 4) / 4;      // الوقت ماشي من اليمين للشمال
        if (Math.abs(e.clientX - x0) > 4) moved = true;
        if (!moved) return;
        if (mode === 'move') { const L = s0[1] - s0[0]; a = Math.min(Math.max(S, s0[0] + dh), E - L); b = a + L; }
        else if (mode === 'a') a = Math.max(S, Math.min(s0[0] + dh, b - 0.5));
        else b = Math.min(E, Math.max(s0[1] + dh, a + 0.5));
        bar.style.right = ((a - S) / span * 100) + '%'; bar.style.width = ((b - a) / span * 100) + '%';
        bar.querySelector('.tx b').textContent = tlHM_(a) + ' ← ' + tlHM_(b);
      };
      bar.onpointerup = () => {
        bar.onpointermove = bar.onpointerup = null;
        if (!moved) return tlEdit_(+bar.dataset.ix);
        if (a === s0[0] && b === s0[1]) return;
        tlSetTimes_(r, tlHM_(a), tlHM_(b));
      };
    };
  });
}
// تغيير مواعيد شريط: لو رجع لمواعيد ورديته الأصلية بيتشال "الخاص"
function tlSetTimes_(r, f, t, shift) {
  const d = sh.data, old = r.shift;
  r.shift = shift || r.shift;
  const df = d.defs.find(x => x.id === r.shift);
  if (df && df.from === f && df.to === t) { r.from = ''; r.to = ''; } else { r.from = f; r.to = t; }
  // نفس الشخص ما يتكررش في نفس الوردية في نفس اليوم
  d.rows = d.rows.filter(x => x === r || !(x.day === r.day && x.shift === r.shift && x.email === r.email));
  drawShifts_();
  tlPush_(r.day, r.shift); if (old !== r.shift) tlPush_(r.day, old);
}

let attCache_ = null;
const ATT_REQ = 480; // 8 ساعات

// نبضة الحضور: كل دقيقة وإنت مسجل دخول (الباكإند بيسجل أول دخول وآخر نشاط والدقايق المتصلة)
function attBeat_() { if (token) api('dBeat', { token }, true).catch(() => {}); }
