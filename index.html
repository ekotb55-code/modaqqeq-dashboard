// يوم الشغل بيبدأ 9 الصبح (اللي قبل 9 بيتحسب على اليوم اللي قبله) - بيطابق الباكإند
function dayKey9_(t) {
  const d = new Date(new Date(t).getTime() - 9 * 3600000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dayStart9_(key) { const p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 9, 0, 0).getTime(); }
function perfBounds_() {
  const toKey = dayKey9_(now());
  if (perfRange === 'all') return { from: new Date(2000, 0, 1).getTime(), fromKey: '2000-01-01', toKey: toKey };
  const back = { today: 0, week: 6, month: 29 }[perfRange] || 0;
  const from = dayStart9_(toKey) - back * 864e5;
  return { from: from, fromKey: dayKey9_(from), toKey: toKey };
}
function hh_(m) { return (m / 60).toFixed(1); }
// خصم المرتجعات بيزيد مع كل مرتجع: 1 ← 4 ، 2 ← 10 ، 3 ← 18 ، 4 ← 28
function retPenalty_(n) { return n * 4 + n * (n - 1); }

function perfCalc_(b, A, reps, SC) {
  const ppl = {};
  const P = n => ppl[n] || (ppl[n] = { name: n, n: 0, total: 0, mins: 0, ontime: 0, pick: 0, pickN: 0, lines: 0, qaN: 0, firstOk: 0, ret: 0, openRet: 0, retList: [], open: 0, cr: 0, crN: 0, att: null });
  const firstOpen = {};
  A.forEach(a => {
    firstOpen[a.name + '|' + a.day] = new Date(a.first).getTime();
    const p = P(a.name);
    const s = p.att = p.att || { days: 0, mins: 0, paid: 0, late: 0, lateDays: 0, deduct: 0, pay: 0, hasPay: false, pen: 0, rows: [] };
    s.days++; s.mins += a.mins; s.paid += a.paidMin; s.late += a.lateMin; s.deduct += a.deductMin; s.rows.push(a);
    if (a.lateMin > 15) s.lateDays++;
    if (a.pay != null) { s.pay += a.pay; s.hasPay = true; }
    s.pen += a.lateMin > 30 ? 8 : a.lateMin > 15 ? 3 : 0;                          // خصم التأخير
    if (a.day < b.toKey) s.pen += Math.max(0, ATT_REQ - a.mins) / ATT_REQ * 6;     // ساعات ناقصة (أيام خلصت بس)
  });

  // ---- الحضور على جدول الورديات (لو فيه جدول): تأخير بعد السماح، غياب، مغادرة بدري، وتغطية الزميل المتأخر
  const sched = {};   // اسم|يوم ← [بداية، نهاية]
  const hasSched = !!(SC && SC.rows && SC.rows.length);
  if (hasSched) {
    const grace = SC.grace || 5, nowT = now();
    const attOf = (n, day) => A.find(a => a.name === n && a.day === day);
    const byDayShift = {};
    SC.rows.forEach(r => {
      if (r.day < b.fromKey || r.day > b.toKey) return;
      const sp = rowSpan_(r, SC.defs); if (!sp) return;
      (sched[r.name + '|' + r.day] = sched[r.name + '|' + r.day] || []).push(sp);
      (byDayShift[r.day] = byDayShift[r.day] || []).push({ name: r.name, sp: sp });
    });
    Object.keys(sched).forEach(k => {
      const [n, day] = k.split('|'), sps = sched[k].sort((x, y) => x[0] - y[0]);
      const st = sps[0][0], en = Math.max(...sps.map(x => x[1]));
      if (st > nowT) return;                                   // الوردية لسه ما بدأتش
      const p = P(n);
      const s = p.sa = p.sa || { days: 0, late: 0, lateDays: 0, absent: 0, early: 0, cover: 0, covered: 0 };
      s.days++;
      const a = attOf(n, day);
      if (!a) { if (nowT > st + grace * 60000) s.absent++; return; }
      const late = Math.max(0, (new Date(a.first).getTime() - st) / 60000);
      if (late > grace) { s.late += late - grace; s.lateDays++; }
      if (en < nowT) { const e = (en - new Date(a.last).getTime()) / 60000; if (e > 5) s.early += e; }
    });
    // التسليم: لو اللي جاي اتأخر وزميل الوردية اللي قبله فضل مكمّل، الدقايق دي بتتحسب للي غطّى
    Object.keys(byDayShift).forEach(day => {
      const L = byDayShift[day];
      L.forEach(nx => L.forEach(pv => {
        if (pv.name === nx.name || Math.abs(pv.sp[1] - nx.sp[0]) > 60000) return;   // pv قبل nx على طول
        const an = attOf(nx.name, day), ap = attOf(pv.name, day);
        if (!ap) return;
        const lateN = an ? Math.max(0, (new Date(an.first).getTime() - nx.sp[0]) / 60000) : (nx.sp[1] - nx.sp[0]) / 60000;
        if (lateN <= (SC.grace || 5)) return;
        const stayed = Math.max(0, (new Date(ap.last).getTime() - nx.sp[0]) / 60000);
        const c = Math.min(lateN, stayed);
        if (c > 0) { P(pv.name).sa = P(pv.name).sa || { days: 0, late: 0, lateDays: 0, absent: 0, early: 0, cover: 0, covered: 0 }; P(pv.name).sa.cover += c;
          P(nx.name).sa = P(nx.name).sa || { days: 0, late: 0, lateDays: 0, absent: 0, early: 0, cover: 0, covered: 0 }; P(nx.name).sa.covered += c; }
      }));
    });
  }
  // مين كان فاتح إمتى (علشان "شغال لوحده")
  const openWin = A.map(a => ({ name: a.name, a: new Date(a.first).getTime(), b: new Date(a.last).getTime() }));
  const busy = {};
  all.forEach(v => { if (v.doneBy && v.receivedAt && v.doneAt) (busy[v.doneBy] = busy[v.doneBy] || []).push({ id: v.id, a: new Date(v.receivedAt).getTime(), b: new Date(v.doneAt).getTime() }); });

  all.forEach(v => {
    // 1) المرتجعات من سجل الجودة نفسه (حتى لو الفاتورة لسه "يتم الادخال" عند نفس الموظف)
    qaLogList(v).forEach(e => {
      if (e.type !== 'رجوع' || !e.at || new Date(e.at).getTime() < b.from) return;
      const who = e.who || v.doneBy; if (!who) return;
      const p = P(who); p.ret++; p.retList.push({ v: v, note: e.note, at: e.at });
    });
    if (v.qaRejects > 0 && v.status !== ST_DONE && v.doneBy) P(v.doneBy).openRet++;
    if (v.status === ST_WORK && v.receivedBy) P(v.receivedBy).open++;

    // 2) الفواتير اللي خلصت: الوقت بيتحسب من وقت دخول الموظف (مش من وقت رفع الفرع)
    if (v.status !== ST_DONE || !v.doneAt || !v.doneBy || new Date(v.doneAt).getTime() < b.from) return;
    const p = P(v.doneBy);
    const dk = dayKey9_(v.doneAt);
    let start = new Date(v.createdAt).getTime();
    const sps = sched[v.doneBy + '|' + dk];
    if (sps) {
      // في جدول: الوقت بيتحسب من وصول الفاتورة في ورديته (التأخير في الفتح بيتحسب عليه)
      const inShift = sps.find(sp => start >= sp[0] && start < sp[1]);
      if (!inShift) start = Math.max(start, Math.min(...sps.map(sp => sp[0])));
    } else {
      const fo = firstOpen[v.doneBy + '|' + dk]; if (fo) start = Math.max(start, fo);
    }
    let m = mins(start, v.doneAt);                         // mins بتحسب وقت الشغل بس
    // شغال لوحده ومشغول بفاتورة تانية: وقت انشغاله ما يتحسبش عليه
    const wEnd = v.receivedAt ? new Date(v.receivedAt).getTime() : new Date(v.doneAt).getTime();
    if (wEnd > start) {
      const alone = !openWin.some(o => o.name !== v.doneBy && o.a < wEnd && o.b > start);
      if (alone) {
        const iv = (busy[v.doneBy] || []).filter(x => x.id !== v.id).map(x => [Math.max(x.a, start), Math.min(x.b, wEnd)]).filter(x => x[1] > x[0]).sort((x, y) => x[0] - y[0]);
        let ov = 0, ce = -Infinity;
        iv.forEach(([a1, b1]) => { if (b1 <= ce) return; ov += b1 - Math.max(a1, ce); ce = b1; });
        if (ov > 0) { m = Math.max(0, m - ov / 60000); p.excused = (p.excused || 0) + ov / 60000; }
      }
    }
    p.n++; p.total += v.total; p.mins += m; p.lines += v.count;
    if (m <= SLA_MIN) p.ontime++;
    if (v.receivedAt) { p.pick += mins(start, v.receivedAt); p.pickN++; }
    if (v.qaBy) { p.qaN++; if (!v.qaRejects) p.firstOk++; }
  });
  reps.forEach(x => { const p = P(x.by); p.cr += mins(x.asked, x.at); p.crN++; });
  // ---- تذاكر الدعم: اللي حلّها + تقييم الفرع، والمستعجلة اللي اتأخرت في الاستلام (على اللي كانوا في الوردية)
  const TK = p => p.tk || (p.tk = { n: 0, ontime: 0, mins: 0, rated: 0, stars: 0, late: 0, lateMin: 0 });
  const from = b.from;
  tks.forEach(v => {
    if (v.solvedAt && new Date(v.solvedAt).getTime() >= from && v.assigneeName) {
      const t = TK(P(v.assigneeName)), st = v.priority === TK_SCHED && v.scheduledAt ? v.scheduledAt : v.createdAt, m = mins(st, v.solvedAt);
      t.n++; t.mins += m; if (m <= v.resolveMin) t.ontime++;
      if (v.rating) { t.rated++; t.stars += v.rating; }
    }
    if (v.priority === TK_URGENT && new Date(v.createdAt).getTime() >= from) {
      const picked = v.pickedAt ? new Date(v.pickedAt).getTime() : (tkOpen(v) ? now() : 0);
      const late = picked ? (picked - new Date(v.createdAt).getTime()) / 60000 - TK_PICK_MIN : 0;
      if (late > 0) {
        const c = new Date(v.createdAt).getTime(), day = dayKey9_(c);
        const onShift = hasSched ? Object.keys(sched).filter(k => k.split('|')[1] === day && sched[k].some(sp => c >= sp[0] && c < sp[1])).map(k => k.split('|')[0]) : [];
        (onShift.length ? onShift : v.assigneeName ? [v.assigneeName] : []).forEach(n => { const t = TK(P(n)); t.late++; t.lateMin += late; });
      }
    }
  });

  const maxN = Math.max(1, ...Object.values(ppl).map(x => x.n + (x.tk ? x.tk.n : 0)));
  return Object.values(ppl).map(p => {
    const T = p.tk || { n: 0, ontime: 0, rated: 0, stars: 0, late: 0, lateMin: 0 };
    p.tasks = p.n + T.n;
    p.avg = p.n ? p.mins / p.n : 0; p.rate = p.tasks ? (p.ontime + T.ontime) / p.tasks : 0;
    const handled = p.qaN + p.openRet;
    p.fp = handled ? p.firstOk / handled : null;
    p.retRate = (p.n + p.openRet) ? p.ret / (p.n + p.openRet) : (p.ret ? 1 : 0);
    const cnt = p.tasks / maxN;
    const perInv = {}; p.retList.forEach(x => { perInv[x.v.id] = (perInv[x.v.id] || 0) + 1; });
    p.multi = Object.values(perInv).filter(c => c > 1).length;                    // فاتورة رجعت أكتر من مرة
    // ---- التقييم: الجودة 35 + السرعة 25 + الحضور 25 + حجم الشغل 15
    // الجودة = نسبة الصح من أول مرة (ولو مفيش مراجعة جودة: 1 - نسبة المرتجعات)، وكل فاتورة رجعت أكتر من مرة بتنزّلها 5%
    let q = Math.max(0, (p.fp !== null ? p.fp : 1 - Math.min(1, p.retRate)) - p.multi * 0.05);
    // تقييم الفروع للتذاكر (من 5) بيدخل في الجودة
    if (T.rated) { const r = T.stars / T.rated / 5; q = p.n ? q * 0.7 + r * 0.3 : r; }
    let at = p.att ? Math.max(0, 1 - p.att.pen / 25) : null;                      // الحضور والتأخير والساعات الناقصة
    if (p.sa && p.sa.days) {
      // على الجدول: كل دقيقة تأخير بعد السماح نص نقطة، الغياب 60 نقطة، المغادرة بدري ربع نقطة، والتغطية بتعوّض
      const s = p.sa, pen = s.late * 0.5 + s.absent * 60 + s.early * 0.25 + s.covered * 0.25 - s.cover * 0.5;
      at = Math.max(0, Math.min(1, 1 - pen / (s.days * 60)));
    }
    // تذكرة مستعجلة ما اتستلمتش في 5 دقايق: كل دقيقة تأخير بنقطة من الحضور والالتزام
    if (T.lateMin) at = Math.max(0, (at === null ? 1 : at) - T.lateMin / 100);
    const W = at === null ? { q: 35 / 75, s: 25 / 75, a: 0, v: 15 / 75 } : { q: .35, s: .25, a: .25, v: .15 };
    p.parts = { q: Math.round(q * 100), s: Math.round(p.rate * 100), a: at === null ? null : Math.round(at * 100), v: Math.round(cnt * 100) };
    p.base = !p.tasks ? 0 : Math.round(100 * (W.q * q + W.s * p.rate + W.a * (at || 0) + W.v * cnt));
    // سقف: اللي عنده مرتجعات كتير ما ياخدش تقييم عالي مهما كانت سرعته
    p.cap = p.ret >= 3 ? 69 : p.ret === 2 ? 84 : 100;
    p.penRet = Math.max(0, p.base - p.cap);
    p.penAtt = 0;
    p.score = Math.min(p.base, p.cap);
    p.grade = !p.tasks ? '' : p.score >= 85 ? 'ممتاز' : p.score >= 70 ? 'جيد' : 'محتاج تحسين';
    p.flag = p.ret >= 3 || (p.ret >= 2 && p.retRate >= 0.2);                      // تنبيه أحمر حتى لو الدرجة كويسة
    return p;
  }).sort((x, y) => y.score - x.score || y.tasks - x.tasks);
}

function renderPerf() {
  drawPerf_();
  const b = perfBounds_(), key = perfRange;
  Promise.all([api('dAttendance', { token, from: b.fromKey, to: b.toKey }), api('dShifts', { token, from: b.fromKey, to: b.toKey }).catch(() => null)])
    .then(([j, sc]) => { attCache_ = { key: key, rows: j.rows, sched: sc }; if (key === perfRange) drawPerf_(); })
    .catch(e => { attCache_ = { key: key, rows: [], err: msg(e) }; if (key === perfRange) drawPerf_(); });
}

function drawPerf_() {
  const b = perfBounds_(), start = new Date(b.from);
  const A = (attCache_ && attCache_.key === perfRange) ? attCache_.rows : [];
  const done = all.filter(v => v.status === ST_DONE && v.doneAt && new Date(v.doneAt) >= start);
  const reps = (chatSum.replies || []).filter(x => new Date(x.at) >= start);
  const SC = (attCache_ && attCache_.key === perfRange) ? attCache_.sched : null;
  const list = perfCalc_(b, A, reps, SC);
  const colors = r => r >= .9 ? 'var(--green)' : r >= .7 ? 'var(--yellow)' : 'var(--red)';
  const medals = ['🥇', '🥈', '🥉'];
  let medalK = 0;
  let h = '<div class="perf-head"><h2>🏆 أداء الدعم في إدخال الفواتير</h2><select onchange="perfRange=this.value;renderPerf()">' +
    [['today', 'النهارده'], ['week', 'آخر 7 أيام'], ['month', 'آخر 30 يوم'], ['all', 'الكل']].map(([k, t]) => '<option value="' + k + '"' + (perfRange === k ? ' selected' : '') + '>' + t + '</option>').join('') +
    '</select></div>';
  const tot = done.length, avgAll = tot ? done.reduce((s, v) => s + mins(v.createdAt, v.doneAt), 0) / tot : 0;
  const onAll = tot ? done.filter(v => mins(v.createdAt, v.doneAt) <= SLA_MIN).length / tot : 0;
  const totRet = list.reduce((s, p) => s + p.ret, 0);
  h += '<div class="stats"><div class="stat s3"><small>فواتير دخلت</small><b>' + tot + '</b></div>' +
    '<div class="stat s2"><small>متوسط الوقت</small><b>' + durTxt(avgAll) + '</b></div>' +
    '<div class="stat s1"><small>في الميعاد (≤ ' + SLA_MIN + ' د)</small><b>' + Math.round(onAll * 100) + '%</b></div>' +
    '<div class="stat s4"><small>متأخرة دلوقتي</small><b>' + all.filter(v => pending(v) && mins(v.createdAt, now()) > SLA_MIN).length + '</b></div>' +
    '<div class="stat s7"><small>↩️ رجوع من الجودة</small><b>' + totRet + '</b></div>' +
    '<div class="stat s10"><small>💬 متوسط الرد على الشات</small><b>' + (reps.length ? durTxt(reps.reduce((a, x) => a + mins(x.asked, x.at), 0) / reps.length) : '-') + '</b></div></div>';

  h += list.length ? '<div class="people">' + list.map(p => {
    const medal = (p.n && !p.flag && p.ret < 2 && p.score >= 70 && medalK < 3) ? medals[medalK++] : '';
    const a = p.att;
    const gc = p.score >= 85 ? 'var(--green)' : p.score >= 70 ? 'var(--yellow)' : 'var(--red)';
    return '<div class="person' + (p.flag ? ' flagged' : '') + '"><div class="ph"><div class="av">' + esc((p.name || '?').trim().charAt(0)) + '</div><div class="nm">' + esc(p.name) +
      (p.grade ? ' <span class="grade" style="background:' + gc + '">' + p.grade + ' ' + p.score + '</span>' : '') + '</div><div class="medal">' + medal + '</div></div>' +
      (p.ret ? '<div class="retbig"><b>↩️ ' + p.ret + '</b> ' + (p.ret === 1 ? 'فاتورة رجعت' : 'فواتير رجعت') + ' من الجودة' + (p.multi ? ' • منها ' + p.multi + ' رجعت أكتر من مرة' : '') +
        ' <a href="#" onclick="document.getElementById(\'retTbl\').scrollIntoView({behavior:\'smooth\'});return false">شوف الأسباب</a></div>' : '') +
      '<div class="kpis">' +
      '<div class="kpi"><small>فواتير</small><b>' + p.n + '</b></div>' +
      '<div class="kpi"><small>أصناف</small><b>' + p.lines + '</b></div>' +
      '<div class="kpi"><small>متوسط الوقت (من دخوله)</small><b>' + (p.n ? durTxt(p.avg) : '-') + '</b></div>' +
      '<div class="kpi"><small>متوسط الاستلام</small><b>' + (p.pickN ? durTxt(p.pick / p.pickN) : '-') + '</b></div>' +
      '<div class="kpi"><small>في الميعاد</small><b style="color:' + colors(p.rate) + '">' + Math.round(p.rate * 100) + '%</b></div>' +
      '<div class="kpi"><small>شغّال عليها دلوقتي</small><b>' + p.open + '</b></div>' +
      '<div class="kpi"><small>💬 متوسط الرد على الشات</small><b>' + (p.crN ? durTxt(p.cr / p.crN) + ' (' + p.crN + ')' : '-') + '</b></div>' +
      '<div class="kpi"><small>🔍 عدّت الجودة من أول مرة</small><b style="color:' + (p.fp === null ? 'inherit' : colors(p.fp)) + '">' + (p.fp === null ? '-' : Math.round(p.fp * 100) + '%') + '</b></div>' +
      '<div class="kpi"><small>↩️ رجوع من الجودة</small><b style="' + (p.ret ? 'color:var(--red);font-size:22px' : '') + '">' + p.ret + '</b></div>' +
      '<div class="kpi"><small>⏱ ساعات الاتصال</small><b>' + (a ? hh_(a.mins) + ' س' : '-') + '</b></div>' +
      (p.tk ? '<div class="kpi"><small>🛠️ تذاكر اتحلت</small><b>' + p.tk.n + (p.tk.n ? ' <small style="font-size:12px">(' + Math.round(p.tk.ontime / p.tk.n * 100) + '% في الميعاد)</small>' : '') + '</b></div>' +
        '<div class="kpi"><small>⭐ تقييم الفروع</small><b style="color:#B8860B">' + (p.tk.rated ? (p.tk.stars / p.tk.rated).toFixed(1) + '/5' : '-') + '</b></div>' : '') +
      '</div><div class="bar"><i style="width:' + p.score + '%;background:' + colors(p.score / 100) + '"></i></div>' +
      '<div class="parts"><span>🔍 الجودة <b>' + p.parts.q + '%</b></span><span>⚡ السرعة <b>' + p.parts.s + '%</b></span>' +
      '<span>⏱ الحضور <b>' + (p.parts.a === null ? '-' : p.parts.a + '%') + '</b></span><span>📦 حجم الشغل <b>' + p.parts.v + '%</b></span></div>' +
      '<small style="color:var(--muted)">الدرجة ' + p.score + '/100' +
      (p.penRet ? ' <b style="color:var(--red)">(اتقفلت على ' + p.cap + ' بسبب ' + p.ret + ' مرتجعات)</b>' : '') + '</small>' +
      (p.flag ? '<div class="urgebox" style="margin-bottom:0"><b>⚠ ' + p.ret + ' فواتير مرتجعة من الجودة</b>' + (p.multi ? ' (منها ' + p.multi + ' رجعت أكتر من مرة)' : '') + ' - مراجعة مطلوبة حتى لو الدرجة كويسة</div>' : '') +
      (p.sa ? ((p.sa.lateDays || p.sa.absent || p.sa.early > 10) ? '<div class="warnbox" style="margin-bottom:0">📅 على الجدول: ' + [p.sa.lateDays ? '⏰ اتأخر ' + p.sa.lateDays + ' يوم (' + durTxt(p.sa.late) + ' بعد السماح)' : '', p.sa.absent ? '🚫 غاب ' + p.sa.absent + ' وردية' : '', p.sa.early > 10 ? '🏃 مشي بدري ' + durTxt(p.sa.early) : ''].filter(Boolean).join(' • ') + '</div>' : '') +
        (p.sa.cover > 0 ? '<div class="warnbox" style="margin-bottom:0;background:#E6F4EA;color:#1E7D3A">🤝 غطّى زميله ' + durTxt(p.sa.cover) + '</div>' : '')
        : (a && a.lateDays ? '<div class="warnbox" style="margin-bottom:0">⏰ اتأخر ' + a.lateDays + ' يوم (إجمالي ' + durTxt(a.late) + ')</div>' : '')) +
      (p.tk && p.tk.late ? '<div class="urgebox" style="margin-bottom:0">🚨 ' + p.tk.late + ' تذكرة مستعجلة اتأخرت في الاستلام (' + durTxt(p.tk.lateMin) + ' بعد الـ 5 دقايق) وهو في الوردية</div>' : '') +
      (p.excused > 1 ? '<small style="color:var(--muted)">⏳ ' + durTxt(p.excused) + ' ما اتحسبتش عليه لأنه كان شغال لوحده على فاتورة تانية</small>' : '') +
      '</div>';
  }).join('') + '</div><p style="color:var(--muted);font-size:13px;margin:6px 4px 14px">📐 التقييم = 🔍 الجودة (الصح من أول مرة) 35% + ⚡ السرعة (في الميعاد) 25% + ⏱ الحضور والالتزام 25% + 📦 حجم الشغل 15% • اللي عنده 2 مرتجعات أقصاه 84 (جيد)، و3 أو أكتر أقصاه 69 (محتاج تحسين) • ممتاز ≥ 85</p>' : '<div class="pane empty">مفيش فواتير دخلت في الفترة دي</div>';

  // ---------- الفواتير اللي الجودة رجّعتها ----------
  const rets = [].concat.apply([], list.map(p => p.retList.map(x => ({ p: p, x: x })))).sort((u, w) => w.x.at.localeCompare(u.x.at));
  if (rets.length) {
    h += '<div class="pane stores-perf" id="retTbl"><h3 style="margin-top:0;color:#C62828">↩️ الفواتير اللي الجودة رجّعتها (' + rets.length + ')</h3><table><thead><tr><th>الموظف</th><th>المحل</th><th>المورد</th><th>سبب الرجوع</th><th>الوقت</th></tr></thead><tbody>' +
      rets.map(r => '<tr><td><b>' + esc(r.p.name) + '</b></td><td>' + esc(r.x.v.store) + '</td><td>' + esc(r.x.v.supplier) + '</td><td>' + esc(r.x.note) + '</td><td>' + dt(r.x.at) + '</td></tr>').join('') + '</tbody></table></div>';
  }

  // ---------- تقييم قسم الجودة (زي ما كان) ----------
  const qa = {};
  all.forEach(v => {
    const log = qaLogList(v);
    log.forEach((x, k) => {
      if ((x.type !== 'اعتماد' && x.type !== 'رجوع') || new Date(x.at) < start) return;
      const q = qa[x.name] = qa[x.name] || { name: x.name, ok: 0, ret: 0, mins: 0, n: 0, compl: 0, late: 0 };
      const sent = log.slice(0, k).reverse().find(y => y.type === 'للجودة');
      if (sent) { const m = mins(sent.at, x.at); q.mins += m; q.n++; if (m > QA_SLA_MIN) q.late++; }
      if (x.type === 'اعتماد') { q.ok++; if (v.reviewNotes) q.compl++; } else q.ret++;
    });
  });
  const qal = Object.values(qa).sort((a, c) => (c.ok + c.ret) - (a.ok + a.ret));
  if (qal.length) {
    h += '<div class="pane stores-perf"><h3 style="margin-top:0;color:#4527A0">🔍 تقييم قسم الجودة</h3>' +
      '<small style="color:var(--muted)">الشكاوى = فواتير الجودة اعتمدتها والفرع كتب عليها ملاحظة وهو بيراجع صورة الإثبات</small>' +
      '<table><thead><tr><th>الاسم</th><th>اعتمد</th><th>رجّع للدعم</th><th>متوسط وقت المراجعة</th><th>متأخرة (&gt; ' + QA_SLA_MIN + ' د)</th><th>شكاوى الفروع</th><th>التقييم</th></tr></thead><tbody>' +
      qal.map(q => {
        const rate = q.ok ? 1 - q.compl / q.ok : 1, onT = q.n ? 1 - q.late / q.n : 1;
        const sc = Math.round(rate * 60 + onT * 40);
        return '<tr><td>' + esc(q.name) + '</td><td class="num">' + q.ok + '</td><td class="num">' + q.ret + '</td><td>' + (q.n ? durTxt(q.mins / q.n) : '-') +
          '</td><td class="num">' + q.late + '</td><td class="num" style="color:' + (q.compl ? '#C62828' : 'inherit') + '">' + q.compl +
          '</td><td><b style="color:' + colors(sc / 100) + '">' + sc + '/100</b></td></tr>';
      }).join('') + '</tbody></table><small style="color:var(--muted)">التقييم = خلو الفواتير من شكاوى الفروع 60 + المراجعة في الميعاد 40</small></div>';
  }

  // ---------- سجل الحضور والمرتب ----------
  const withAtt = list.filter(p => p.att);
  const hasPay = withAtt.some(p => p.att.hasPay);
  h += '<div class="pane stores-perf"><h3 style="margin-top:0;color:var(--navy)">⏱️ سجل الحضور' + (hasPay ? ' والمرتب' : '') + '</h3>' +
    '<small style="color:var(--muted)">الحضور بيتسجل أوتوماتيك من وقت فتح الداش بورد. المطلوب 8 ساعات متصلة من 9 ص لـ 1 ص. تأخير لحد 15 د: تنبيه • 15-30 د: خصم ربع ساعة • أكتر من 30 د: خصم ساعة.</small>' +
    (withAtt.length ? '<table><thead><tr><th>الاسم</th><th>أيام</th>' + (perfRange === 'today' ? '<th>فتح</th><th>آخر نشاط</th>' : '') + '<th>ساعات متصلة</th><th>تأخير</th><th>خصم</th><th>ساعات محسوبة</th>' + (hasPay ? '<th>المرتب</th>' : '') + '</tr></thead><tbody>' +
      withAtt.map(p => {
        const a = p.att, r0 = a.rows[0];
        return '<tr><td><b>' + esc(p.name) + '</b></td><td class="num">' + a.days + '</td>' +
          (perfRange === 'today' ? '<td>' + tm(r0.first) + '</td><td>' + tm(r0.last) + '</td>' : '') +
          '<td><b style="color:' + (a.mins >= ATT_REQ * a.days ? 'var(--green)' : 'inherit') + '">' + hh_(a.mins) + ' س</b></td>' +
          '<td>' + (a.late > 15 ? '<b style="color:var(--red)">' + durTxt(a.late) + '</b>' : a.late ? durTxt(a.late) : '-') + '</td>' +
          '<td>' + (a.deduct ? '<b style="color:var(--red)">- ' + durTxt(a.deduct) + '</b>' : '-') + '</td>' +
          '<td>' + hh_(a.paid) + ' س</td>' + (hasPay ? '<td class="num">' + (a.hasPay ? a.pay + ' ج.م' : '-') + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table>'
      : '<div class="empty">' + (attCache_ && attCache_.err ? 'تعذر تحميل الحضور: ' + esc(attCache_.err) : 'مفيش حضور مسجل في الفترة دي') + '</div>') + '</div>';

  // ---------- الفروع (زي ما كان) ----------
  const byStore = {};
  all.filter(v => new Date(v.createdAt) >= start).forEach(v => {
    const s = byStore[v.store] = byStore[v.store] || { n: 0, done: 0, mins: 0, total: 0 };
    s.n++; s.total += v.total;
    if (v.status === ST_DONE) { s.done++; s.mins += mins(v.createdAt, v.doneAt); }
  });
  const sl = Object.entries(byStore).sort((a, c) => c[1].n - a[1].n);
  if (sl.length) h += '<div class="pane stores-perf"><h3 style="margin-top:0;color:var(--navy)">🏪 الفروع</h3><table><thead><tr><th>الفرع</th><th>فواتير</th><th>دخلت</th><th>متوسط وقت الإدخال</th><th>قيمة الفواتير</th></tr></thead><tbody>' +
    sl.map(([n, s]) => '<tr><td>' + esc(n) + '</td><td class="num">' + s.n + '</td><td class="num">' + s.done + '</td><td>' + (s.done ? durTxt(s.mins / s.done) : '-') + '</td><td class="num">' + money(s.total) + '</td></tr>').join('') + '</tbody></table></div>';
  $('pagePerf').innerHTML = h;
}

// لو كان داخل قبل كده
(function () {
  $('lEmail').value = ls('dashEmail') || '';
  const t = ls('dashToken');
  if (t) { token = t; me = ls('dashName') || ''; showApp(); }
})();
</script>
</body>
</html>
