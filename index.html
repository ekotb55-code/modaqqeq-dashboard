<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فواتير المشتريات - مدقق</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --blue: #1479D3; --blue-2: #0F5FA8; --navy: #0B3D6E; --sky: #E8F2FC; --red: #E0393E; --green: #22A04B;
    --yellow: #F2A900; --orange: #E67E00; --purple: #6C4BD8;
    --bg: #F3F7FC; --card: #FFFFFF; --text: #17212E; --muted: #6B7785; --line: #DFE7F1;
    --shadow: 0 4px 18px rgba(11, 61, 110, .07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  button { font-family: inherit; font-size: 15px; cursor: pointer; border: 0; border-radius: 12px; padding: 9px 16px; font-weight: 700; transition: transform .08s, box-shadow .15s; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font-family: inherit; font-size: 15px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; width: 100%; color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(20,121,211,.12); }
  a { color: inherit; }
  .btn { background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: #fff; box-shadow: 0 4px 12px rgba(20,121,211,.25); }
  .btn.green { background: linear-gradient(135deg, #2BB45A, #1A8A3E); box-shadow: 0 4px 12px rgba(34,160,75,.25); }
  .btn.ghost { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); box-shadow: none; }
  .btn.soft { background: var(--sky); color: var(--blue-2); box-shadow: none; }
  .btn.red { background: linear-gradient(135deg, #F0504F, #C62828); box-shadow: 0 4px 12px rgba(224,57,62,.25); }
  .hidden { display: none !important; }

  /* ---------- الدخول ---------- */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(circle at 20% 10%, #DCEBFB 0, transparent 40%), radial-gradient(circle at 90% 90%, #E7E1FB 0, transparent 40%), var(--bg); }
  .login-card { width: 100%; max-width: 400px; background: #fff; padding: 30px 26px; border-radius: 24px; box-shadow: 0 20px 50px rgba(11,61,110,.12); }
  .login-card img { display: block; width: 220px; max-width: 70%; margin: 0 auto 6px; }
  .login-card h2 { margin: 6px 0 2px; text-align: center; color: var(--navy); }
  .login-card p { margin: 0 0 20px; text-align: center; color: var(--muted); }
  .login-card input { margin-bottom: 12px; }
  .login-card button { width: 100%; padding: 13px; font-size: 17px; }
  .err { color: var(--red); margin: 10px 0; text-align: center; font-weight: 600; }

  /* ---------- الهيدر ---------- */
  header { background: #fff; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
  .hbar { display: flex; align-items: center; gap: 14px; padding: 8px 18px; max-width: 1500px; margin: 0 auto; }
  .hbar img { height: 46px; }
  .hbar .title { font-weight: 800; color: var(--navy); font-size: 18px; border-inline-start: 2px solid var(--line); padding-inline-start: 14px; }
  .hbar .sp { flex: 1; }
  .who { color: var(--muted); font-weight: 600; }
  .accent { height: 4px; background: linear-gradient(90deg, var(--blue), var(--purple), #2BB45A, var(--yellow)); }
  .nav { display: flex; gap: 6px; }
  .nav button { background: transparent; color: var(--muted); padding: 8px 14px; }
  .nav button.on { background: var(--sky); color: var(--blue-2); }
  .bell { position: relative; }
  /* عداد النت */
  .net { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: background .4s, color .4s; white-space: nowrap; }
  .net .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .net .bars i { width: 4px; border-radius: 2px; background: currentColor; opacity: .25; transition: opacity .4s; }
  .net .bars i:nth-child(1) { height: 5px; } .net .bars i:nth-child(2) { height: 9px; } .net .bars i:nth-child(3) { height: 14px; }
  .net .bars i.on { opacity: 1; }
  .net.good { background: #E7F6EC; color: #1E7D3A; border-color: #BFE5CB; }
  .net.ok { background: #FFF6E0; color: #9A6700; border-color: #F5DD9C; }
  .net.slow { background: #FFEBD9; color: #C25400; border-color: #F7C9A0; }
  .net.off { background: #FDECEA; color: #B3261E; border-color: #F5C2BD; animation: netblink 1s infinite; }
  @keyframes netblink { 50% { opacity: .55; } }
  /* الاستعجال */
  .urge { display: inline-block; background: #B3261E; color: #fff; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 800; animation: urgepulse 1.2s infinite; }
  @keyframes urgepulse { 50% { box-shadow: 0 0 0 5px rgba(179,38,30,.18); } }
  .card.urged { border-inline-start: 5px solid #B3261E; }
  .urgebox { background: #FDECEA; border: 1px solid #F5C2BD; color: #8C1D18; border-radius: 12px; padding: 10px 14px; margin: 10px 0; line-height: 1.8; }
  .urgebox ul { margin: 4px 0 0; padding-inline-start: 20px; }
  .pricebox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .pricebox .up { background: #FDECEA; color: #B3261E; border-radius: 999px; padding: 3px 10px; font-weight: 700; }
  .pricebox .down { background: #E7F6EC; color: #1E7D3A; border-radius: 999px; padding: 3px 10px; font-weight: 700; }
  .bell.off::after { content: ''; position: absolute; top: 6px; left: 8px; width: 9px; height: 9px; background: var(--red); border-radius: 50%; }

  /* ---------- الإحصائيات ---------- */
  .main { max-width: 1500px; margin: 0 auto; padding: 16px; }
  /* ---------- الشات ---------- */
  .s10 { background: linear-gradient(135deg, #00ACC1, #00838F); }
  .chatwrap { background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 12px; margin: 12px 0; }
  .chatwrap h3 { margin: 0 0 8px; font-size: 16px; color: #0B3D6E; display: flex; align-items: center; gap: 8px; }
  .msgs { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px; background: #F4F7FB; border-radius: 12px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.br { align-self: flex-start; background: #fff; border: 1px solid #DFE7F1; border-start-start-radius: 4px; }
  .msg.sp { align-self: flex-end; background: #DCEBFB; border-start-end-radius: 4px; }
  .msg.int { align-self: flex-end; background: #FFF6D6; border: 1px dashed #E6C14D; }
  .msg.auto { align-self: center; background: #EEF1F5; color: #4A5868; font-size: 13px; }
  .msg .who { font-size: 12px; font-weight: 800; color: #0B3D6E; display: block; }
  .msg .mt { display: block; font-size: 11px; color: #6B7785; margin-top: 2px; direction: rtl; }
  .msg .tick { color: #1479D3; font-weight: 800; }
  .msg .tick.no { color: #9AA6B2; }
  .qr { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 6px; }
  .qr button { border: 1px solid #CFE0F3; background: #F2F7FD; color: #0F5FA8; border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .chatin { display: flex; gap: 8px; align-items: flex-end; }
  .chatin textarea { flex: 1; min-height: 44px; max-height: 120px; resize: vertical; }
  .chatin .btn { padding: 11px 16px; }
  .chatopt { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6B7785; margin-top: 4px; }
  .chatopt label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .chatopt input { width: auto; }
  .cbadge { display: inline-block; background: #00838F; color: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 800; line-height: 20px; }
  .cbadge.new { background: #C62828; animation: urgepulse 1.2s infinite; }
  .bchat { border: 0; background: #fff; border-radius: 10px; padding: 4px 10px; font: inherit; font-size: 12.5px; font-weight: 700; color: #00838F; cursor: pointer; margin-top: 6px; }
  #chatModal { position: fixed; inset: 0; background: rgba(10,25,45,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #chatModal .chatwrap { width: min(620px, 100%); margin: 0; }
  /* ---------- لوحة المحلات (زي تريلو) ---------- */
  .board-page { padding: 12px 16px 0; }
  .bbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .bbar > b { font-size: 18px; color: #0B3D6E; }
  .bbar input#bText { width: 240px; max-width: 100%; }
  .seg { display: inline-flex; background: #fff; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .seg button { border: 0; background: none; padding: 8px 14px; font: inherit; font-weight: 700; color: #4A5868; cursor: pointer; }
  .seg button.on { background: #1479D3; color: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: #4A5868; cursor: pointer; }
  .chk input { width: auto; }
  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 14px; height: calc(100vh - 150px); align-items: flex-start; }
  .bcol { flex: 0 0 310px; background: #E9EEF5; border-radius: 16px; display: flex; flex-direction: column; max-height: 100%; }
  .bhead { padding: 12px 14px 8px; border-bottom: 1px solid #D6DFEA; }
  .bhead h3 { margin: 0; font-size: 16px; color: #0B3D6E; display: flex; align-items: center; gap: 6px; }
  .bhead h3 .dot { width: 10px; height: 10px; border-radius: 50%; background: #2BB45A; display: inline-block; }
  .bhead h3 .dot.warn { background: #E67E00; } .bhead h3 .dot.bad { background: #C62828; }
  .bstats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bstats span { background: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; color: #4A5868; }
  .bstats span.r { color: #C62828; } .bstats span.o { color: #E67E00; } .bstats span.g { color: #1A8A3E; }
  .bbody { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .bcard { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(16,40,70,.12); cursor: pointer; border-inline-start: 5px solid #FF9F1C; transition: transform .12s; }
  .bcard:hover { transform: translateY(-2px); }
  .bcard.st-work { border-inline-start-color: #1E90FF; } .bcard.st-done { border-inline-start-color: #2BB45A; } .bcard.st-rej { border-inline-start-color: #5B6B7E; }
  .bcard.late { box-shadow: 0 0 0 2px #F0504F; }
  .bcard .bt { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .bcard .bt b { font-size: 15px; }
  .bcard .bm { font-size: 12px; color: #6B7785; margin: 2px 0 6px; }
  .tl { list-style: none; margin: 0; padding: 0; border-top: 1px dashed #DFE7F1; padding-top: 6px; }
  .tl li { font-size: 12.5px; line-height: 1.55; display: flex; gap: 6px; }
  .tl li .tm { color: #6B7785; margin-inline-start: auto; white-space: nowrap; direction: ltr; font-size: 11.5px; }
  .tl li.note { color: #8C1D18; }
  .bempty { text-align: center; color: #8A96A3; padding: 18px 6px; font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { border-radius: 18px; padding: 14px 16px; color: #fff; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .stat::after { content: ''; position: absolute; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.12); left: -30px; top: -40px; }
  .stat small { opacity: .9; font-weight: 600; }
  .stat b { display: block; font-size: 28px; line-height: 1.2; }
  .s1 { background: linear-gradient(135deg, #FF9F1C, #E67E00); }
  .s2 { background: linear-gradient(135deg, #1E90FF, #0F5FA8); }
  .s3 { background: linear-gradient(135deg, #2BB45A, #1A8A3E); }
  .s4 { background: linear-gradient(135deg, #F0504F, #C62828); }
  .s5 { background: linear-gradient(135deg, #8B6CF0, #5B3CC4); }
  .s6 { background: linear-gradient(135deg, #5B6B7E, #36414F); }
  .s7 { background: linear-gradient(135deg, #F06292, #C2185B); }
  .s8 { background: linear-gradient(135deg, #26A69A, #00796B); }
  .s9 { background: linear-gradient(135deg, #455A64, #263238); }
  /* الكروت الملونة هي الفلاتر: الكارت المختار عليه إطار */
  button.stat { border: 0; font: inherit; text-align: right; cursor: pointer; transition: transform .15s, box-shadow .15s, opacity .15s; }
  button.stat:hover { transform: translateY(-2px); }
  .stats.picking button.stat:not(.on) { opacity: .78; }
  button.stat.on { opacity: 1; transform: translateY(-3px); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #0B3D6E, var(--shadow); }
  button.stat .hint { display: block; font-size: 11px; opacity: .85; margin-top: 2px; }
  .hours { grid-column: 1 / -1; border-radius: 12px; padding: 8px 14px; font-weight: 700; background: #E2F5E6; color: #15803D; }
  .hours.off { background: #EEF1F5; color: #4A5868; }
  @media (max-width: 800px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  /* ---------- القايمة والتفاصيل ---------- */
  .wrap { display: grid; grid-template-columns: 360px 1fr; gap: 16px; }
  @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } .wrap.open #listPane { display: none; } .wrap:not(.open) #detailPane { display: none; } }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabnow { font-size: 14px; color: #4A5868; padding: 2px 4px; }
  .tab { background: #fff; color: var(--text); border: 1.5px solid var(--line); padding: 7px 12px; }
  .tab.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .tab .n { display: inline-block; min-width: 22px; padding: 0 6px; margin-inline-start: 6px; border-radius: 10px; background: rgba(0,0,0,.08); font-size: 13px; }
  .tab.on .n { background: rgba(255,255,255,.2); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  #list { max-height: calc(100vh - 330px); overflow: auto; padding: 2px; }
  .card { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 9px; box-shadow: var(--shadow); cursor: pointer; border-inline-start: 5px solid var(--orange); transition: transform .1s; }
  .card:hover { transform: translateY(-1px); }
  .card.sel { outline: 2.5px solid var(--blue); }
  .card.st-work { border-inline-start-color: var(--blue); }
  .card.st-done { border-inline-start-color: var(--green); }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .card .sup { font-weight: 800; font-size: 16px; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
  .b-new { background: #FFF1DC; color: var(--orange); }
  .b-work { background: #E3F0FD; color: var(--blue); }
  .b-done { background: #E2F5E6; color: var(--green); }
  .b-rej { background: #FDE2E2; color: #C62828; }
  .b-qa { background: #EDE7F6; color: #5B3CC4; }
  .card.st-qa, .bcard.st-qa { border-inline-start-color: #6C4BD8; }
  .s11 { background: linear-gradient(135deg, #7E57C2, #4527A0); }
  .qabox { background: #F6F2FF; border: 1px solid #D9CCF7; border-radius: 16px; padding: 14px; margin: 12px 0; }
  .qabox h3 { margin: 0 0 8px; color: #4527A0; font-size: 16px; }
  .qaitems { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 8px 0; }
  .qait { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 1px solid #E3DAF7; border-radius: 12px; padding: 7px 10px; font-weight: 700; }
  .qait .tg { display: inline-flex; gap: 4px; }
  .qait .tg button { border: 1px solid #D6DFEA; background: #fff; border-radius: 10px; width: 40px; height: 32px; font-size: 16px; cursor: pointer; }
  .qait .tg button.ok.on { background: #2BB45A; color: #fff; border-color: #2BB45A; }
  .qait .tg button.bad.on { background: #E53935; color: #fff; border-color: #E53935; }
  .qaret { background: #FDECEA; border: 1px solid #F5C2BD; border-radius: 14px; padding: 12px; margin: 10px 0; color: #8C1D18; line-height: 1.8; }
  .qalog { font-size: 13px; color: #4A5868; margin-top: 6px; line-height: 1.8; }
  .card.st-rej { border-inline-start-color: var(--red); opacity: .85; }
  .rv { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 20px; }
  .rv-ok { background: #E2F5E6; color: #15803D; } .rv-wait { background: #FFF5D6; color: #A16207; } .rv-note { background: #F4EEFF; color: #4B2FB5; }
  .t-off { background: #EEF1F5; color: #4A5868; }
  .money { font-weight: 800; color: var(--navy); }
  .timer { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; padding: 2px 10px; border-radius: 20px; direction: ltr; font-variant-numeric: tabular-nums; }
  .t-green { background: #E2F5E6; color: #15803D; }
  .t-yellow { background: #FFF5D6; color: #A16207; }
  .t-red { background: #FDE2E2; color: #C62828; animation: pulse 1.4s infinite; }
  .t-done-green { background: #E2F5E6; color: #15803D; }
  .t-done-yellow { background: #FFF5D6; color: #A16207; }
  .t-done-red { background: #FDE2E2; color: #C62828; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(224,57,62,.15); } }
  .pane { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); min-height: 300px; }
  .empty { color: var(--muted); text-align: center; padding: 50px 10px; }
  .dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dhead h2 { margin: 0; font-size: 22px; color: var(--navy); }
  .dhead .sp { flex: 1; }
  .info { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
  .info div { background: var(--bg); border-radius: 12px; padding: 7px 10px; }
  .info small { color: var(--muted); display: block; font-size: 12px; }
  .info b { font-size: 15px; }
  .wabtn { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; text-decoration: none; padding: 9px 16px; border-radius: 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 4px 12px rgba(37,211,102,.3); }
  .sysbtn { background: linear-gradient(135deg, var(--purple), #4B2FB5); color: #fff; text-decoration: none; padding: 9px 16px; border-radius: 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 4px 12px rgba(108,75,216,.25); }

  /* الصورة كبيرة جنب الأصناف */
  .compare { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 1250px) { .compare { grid-template-columns: 1fr; } }
  .viewer { position: sticky; top: 90px; background: #1B2430; border-radius: 16px; overflow: hidden; }
  .vstage { height: calc(100vh - 220px); min-height: 420px; overflow: hidden; position: relative; cursor: grab; touch-action: none; }
  .vstage img { position: absolute; top: 50%; left: 50%; transform-origin: center; max-width: none; user-select: none; -webkit-user-drag: none; }
  .vtools { display: flex; gap: 6px; padding: 8px; background: #111A24; align-items: center; flex-wrap: wrap; }
  .vtools button { background: #26323F; color: #fff; padding: 6px 12px; }
  .vtools .pg { color: #9FB3C8; margin-inline-start: auto; font-weight: 600; font-size: 13px; }
  .thumbs { display: flex; gap: 6px; padding: 0 8px 8px; background: #111A24; overflow-x: auto; }
  .thumbs .th { width: 54px; height: 54px; border-radius: 8px; background: #26323F center/cover no-repeat; cursor: pointer; flex: none; border: 2px solid transparent; }
  .thumbs .th.on { border-color: var(--yellow); }
  .thumbs .th small { display: block; text-align: center; color: #fff; font-size: 10px; margin-top: 36px; text-shadow: 0 1px 2px #000; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  th { background: var(--sky); color: var(--navy); position: sticky; top: 0; }
  tr:hover td { background: #FAFCFF; }
  td.num { direction: ltr; text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }

<body>

<div id="viewerFull" class="hidden" onclick="this.classList.add('hidden')"><img id="viewerFullImg"></div>
<div id="toast" class="hidden"></div>
<div id="chatModal" class="hidden" onclick="if(event.target===this)closeChatModal()"><div class="chatwrap" id="chatModalBox"></div></div>

<script>
// رابط سكريبت "دليل الموظفين" (نفس اللي في التطبيق)
const API = 'https://script.google.com/macros/s/AKfycbxUjxuVtROKO7MrxHtmBfzOxsjgwgfvWMVodCHxUdxuFszmgTyWMQFavjt82iJ8U0s/exec';
const SLA_MIN = 30, WARN_MIN = 20;          // الفاتورة لازم تدخل خلال 30 دقيقة (أصفر من 20)
const ST_NEW = 'جديدة', ST_WORK = 'يتم الادخال', ST_DONE = 'تم الإدخال', ST_REJ = 'مرفوضة', TAB_NOTES = '📝 ملاحظات الفروع';
const ST_QA = 'مستنية الجودة', QA_SLA_MIN = 15; // قسم الجودة بيراجع بعد إدخال الدعم
const QA_ITEMS = ['الأصناف', 'الكميات', 'أسعار الشراء', 'أسعار البيع', 'المورد', 'رقم فاتورة المورد', 'الإجمالي', 'صورة السيستم'];
let myRole = '';
// مواعيد العمل: من 9 الصبح لحد 1 بالليل - برة المواعيد العداد بيقف
const OFF_FROM = 1, OFF_TO = 9;
const PENDING_ALERT_MIN = 5; // تنبيه كل 5 دقايق طول ما فيه فواتير مستنية
let token = '', me = '', all = [], stores = [], tab = ST_NEW, cur = null, shots = [], skew = 0;
let known = null, pIdx = 0, perfRange = 'today', prevStatus = {}, revKnown = null, pendAt = 0;
let chatSum = { threads: [], replies: [] }, chatKnown = null;
const imgCache = {};

// ---------- أدوات ----------
async function api(action, data, post) {
  let res;
  if (post) res = await fetch(API + '?action=' + action, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
  else res = await fetch(API + '?action=' + action + '&data=' + encodeURIComponent(JSON.stringify(data)));
  const j = await res.json();
  if (!j.ok) {
    if ((j.error || '').indexOf('انتهت الجلسة') !== -1) { toast(j.error); setTimeout(logout, 1500); }
    throw new Error(j.error || 'خطأ');
  }
  return j;
}
const $ = id => document.getElementById(id);
function msg(e) { return (e && e.message) ? e.message : String(e); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('hidden'), 3800); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(v) { return Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function num(v) { return Number(v || 0).toLocaleString('en-US', { maximumFractionDigits: 3 }); }
function dt(s) { if (!s) return ''; const d = new Date(s); return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' }) + ' ' + d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }); }
function badge(s) { return '<span class="badge ' + (s === ST_DONE ? 'b-done' : s === ST_WORK ? 'b-work' : s === ST_REJ ? 'b-rej' : s === ST_QA ? 'b-qa' : 'b-new') + '">' + esc(s || ST_NEW) + '</span>'; }
function isQA() { return myRole === 'جودة'; }
function canQA() { return myRole === 'جودة' || myRole === 'مدير'; }
function qaLate(v) { return v.status === ST_QA && v.doneAt && mins(v.doneAt, now()) > QA_SLA_MIN; }
// سجل الجودة: سطور "نوع|وقت|اسم|ملاحظة"
function qaLogList(v) {
  return String(v.qaLog || '').split('\n').filter(Boolean).map(l => { const p = l.split('|'); return { type: p[0], at: p[1], name: p[2], note: p[3] || '' }; });
}
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function now() { return Date.now() + skew; }
// وقت الشغل بس بين وقتين (من غير الفترة من 1 بالليل لـ 9 الصبح)
function workMs(a, b) {
  a = new Date(a).getTime(); b = new Date(b).getTime();
  if (!(b > a)) return 0;
  let off = 0;
  const d = new Date(a); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 1);
  while (d.getTime() < b) {
    const s = new Date(d); s.setHours(OFF_FROM, 0, 0, 0);
    const e = new Date(d); e.setHours(OFF_TO, 0, 0, 0);
    off += Math.max(0, Math.min(b, e.getTime()) - Math.max(a, s.getTime()));
    d.setDate(d.getDate() + 1);
  }
  return b - a - off;
}
function inWork(t) { const h = new Date(t).getHours(); return h >= OFF_TO || h < OFF_FROM; }
function mins(a, b) { return workMs(a, b) / 60000; }
function pending(v) { return v.status === ST_NEW || v.status === ST_WORK || !v.status; }
function clock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function durTxt(m) { m = Math.round(m); return m < 60 ? m + ' د' : Math.floor(m / 60) + ' س ' + (m % 60) + ' د'; }

// العداد: أخضر لحد 20 دقيقة، أصفر لحد 30، وبعدها أحمر "متأخرة"
function timerHtml(v) {
  if (!v.createdAt) return '';
  if (v.status === ST_DONE && v.doneAt) {
    const m = mins(v.createdAt, v.doneAt);
    const c = m <= WARN_MIN ? 'green' : m <= SLA_MIN ? 'yellow' : 'red';
    return '<span class="timer t-done-' + c + '">✓ ' + durTxt(m) + '</span>';
  }
  if (!pending(v)) return '';
  const t = timerState(v.createdAt);
  return '<span class="timer ' + t.cls + '" data-t="' + esc(v.createdAt) + '">' + t.txt + '</span>';
}
// العداد بيحسب وقت الشغل بس، وبرة المواعيد بيقف
function timerState(created) {
  const el = workMs(created, now()), left = SLA_MIN * 60000 - el;
  if (!inWork(now())) return { cls: 't-off', txt: '⏸ ' + (el === 0 ? 'هتبدأ 9 الصبح' : (left > 0 ? clock(left) : 'متأخرة ' + clock(-left))) };
  const c = el < WARN_MIN * 60000 ? 'green' : left > 0 ? 'yellow' : 'red';
  return { cls: 't-' + c, txt: left > 0 ? '⏱ ' + clock(left) : '⚠ متأخرة ' + clock(-left) };
}
setInterval(() => {
  document.querySelectorAll('.timer[data-t]').forEach(el => {
    const t = timerState(el.dataset.t);
    el.className = 'timer ' + t.cls;
    el.textContent = t.txt;
  });
}, 1000);

// ---------- الدخول ----------
async function doLogin() {
  const b = $('lBtn'), err = $('lErr');
  err.textContent = ''; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    const r = await api('dLogin', { email: $('lEmail').value, password: $('lPass').value }, true);
    token = r.token; me = r.name; ls('dashToken', token); ls('dashName', me); ls('dashEmail', $('lEmail').value);
    showApp();
  } catch (e) { err.textContent = msg(e); }
  b.disabled = false; b.textContent = 'دخول';
}
$('lPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
function logout() { ls('dashToken', null); token = ''; location.reload(); }
function showApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = '👤 ' + me;
  updateBell();
  loadList();
  setInterval(() => loadList(true), 20000);
}
function page(p) {
  $('pageRep').classList.toggle('hidden', p !== 'rep');
  $('navRep').classList.toggle('on', p === 'rep');
  if (p === 'rep') renderRepForm();
  $('pageInv').classList.toggle('hidden', p !== 'inv');
  $('pagePerf').classList.toggle('hidden', p !== 'perf');
  $('pageStores').classList.toggle('hidden', p !== 'stores');
  $('navStores').classList.toggle('on', p === 'stores');
  if (p === 'stores') renderBoard();
  $('navInv').classList.toggle('on', p === 'inv');
  $('navPerf').classList.toggle('on', p === 'perf');
  if (p === 'perf') renderPerf();
}

// ---------- الإشعارات والصوت ----------
let audioCtx = null;
function enableAlerts() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().then(updateBell);
  }
  ding();
  ls('alerts', '1');
  updateBell();
  toast('الإشعارات والصوت شغالين 🔔');
}
function updateBell() {
  const ok = 'Notification' in window && Notification.permission === 'granted' && ls('alerts');
  $('bellBtn').classList.toggle('off', !ok);
  $('bellBtn').title = ok ? 'الإشعارات شغالة' : 'دوس هنا علشان تشغّل الإشعارات والصوت';
}
function ding() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [[880, 0], [1175, .16], [1568, .32]].forEach(([f, d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.35, t0 + d + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + d + .45);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + .5);
    });
  } catch (e) {}
}
// نغمة مزعجة (إنذار) - للفواتير المستنية كل 5 دقايق وللاستعجال
function alarm(times) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    const t0 = audioCtx.currentTime, n = times || 8;
    for (let k = 0; k < n; k++) {
      const d = k * .42;
      [[1400, 0], [700, .21]].forEach(([f, e]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + d + e); g.gain.linearRampToValueAtTime(.22, t0 + d + e + .01);
        g.gain.setValueAtTime(.22, t0 + d + e + .18); g.gain.linearRampToValueAtTime(0, t0 + d + e + .2);
        o.connect(g); g.connect(audioCtx.destination); o.start(t0 + d + e); o.stop(t0 + d + e + .21);
      });
    }
  } catch (e) {}
  if (navigator.vibrate) try { navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
}
function alertNew(list) {
  ding();
  const t = list.length === 1 ? (list[0].rejectCount ? 'الفرع عدّل وبعت تاني: ' : 'فاتورة جديدة من ') + list[0].store : list.length + ' فواتير جديدة';
  const b = list.map(v => v.supplier + ' - ' + money(v.total) + ' ج.م').join('\n');
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      const n = new Notification('🧾 ' + t, { body: b, icon: 'icon.png', tag: 'inv-' + list[0].id, requireInteraction: true });
      n.onclick = () => { window.focus(); page('inv'); openInv(list[0].id); n.close(); };
    } catch (e) {}
  }
  toast('🔔 ' + t);
}
// تنبيه متكرر طول ما فيه فواتير مستنية الإدخال (في مواعيد العمل بس)
function notify(title, body, id, tag) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      const n = new Notification(title, { body, icon: 'icon.png', tag: tag || ('inv-' + id), renotify: true, requireInteraction: true });
      n.onclick = () => { window.focus(); page('inv'); if (id) openInv(id); n.close(); };
    } catch (e) {}
  }
}
function pendingAlert() {
  if (!token || !all.length || !inWork(now())) return;
  // الجودة: التنبيه على الفواتير المستنية مراجعتهم
  if (isQA()) {
    const q = all.filter(v => v.status === ST_QA);
    if (!q.length) { pendAt = 0; return; }
    if (pendAt && now() - pendAt < PENDING_ALERT_MIN * 60000) return;
    if (!pendAt) { pendAt = now(); return; }
    pendAt = now();
    const t = '🔍 ' + q.length + (q.length === 1 ? ' فاتورة مستنية' : ' فواتير مستنية') + ' مراجعة الجودة';
    alarm(8); notify(t, q.slice(0, 4).map(v => v.store + ' - ' + v.supplier + ' (' + durTxt(mins(v.doneAt, now())) + ')').join('\n'), q[0].id, 'pending');
    toast(t);
    return;
  }

const net = { ms: [], fails: 0, last: 0, state: 'good' };
async function netProbe() {
  if (!navigator.onLine) return netSet(null);
  const t = performance.now();
  try {
    const c = new AbortController(), to = setTimeout(() => c.abort(), 8000);
    await fetch('icon.png?n=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: c.signal });
    clearTimeout(to);
    netSet(performance.now() - t);
  } catch (e) { netSet(null); }
}
function netSet(ms) {
  if (ms === null) { net.fails++; } else { net.fails = 0; net.ms.push(ms); if (net.ms.length > 5) net.ms.shift(); net.last = ms; }
  const avg = net.ms.length ? net.ms.reduce((a, b) => a + b, 0) / net.ms.length : 0;
  const st = net.fails >= 2 || !navigator.onLine ? 'off' : net.fails === 1 || avg > 1500 ? 'slow' : avg > 600 ? 'ok' : 'good';
  const bars = { good: 3, ok: 2, slow: 1, off: 0 }[st];
  const txt = { good: 'النت ممتاز', ok: 'النت كويس', slow: 'النت بطيء', off: 'النت فاصل' }[st];
  const pill = $('netPill');
  if (!pill) return;
  pill.className = 'net ' + st;
  pill.querySelectorAll('.bars i').forEach((b, k) => b.classList.toggle('on', k < bars));
  $('netTxt').textContent = txt + (st !== 'off' && net.last ? ' • ' + Math.round(net.last) + 'ms' : '');
  if (st === 'off' && net.state !== 'off') toast('⚠️ النت فاصل - الفواتير الجديدة مش هتوصلك لحد ما يرجع');
  if (st !== 'off' && net.state === 'off') { toast('✅ النت رجع'); loadList(true); }
  net.state = st;
}
function netInfo() {
  const c = navigator.connection || {};
  const avg = net.ms.length ? Math.round(net.ms.reduce((a, b) => a + b, 0) / net.ms.length) : 0;
  toast('سرعة الرد: ' + (net.last ? Math.round(net.last) + 'ms' : '-') + ' • المتوسط: ' + (avg || '-') + 'ms' +
    (c.downlink ? ' • التحميل تقريبًا ' + c.downlink + ' Mbps' : '') + (c.effectiveType ? ' (' + c.effectiveType + ')' : ''));
}
window.addEventListener('online', netProbe);
window.addEventListener('offline', () => netSet(null));

let vs = { s: 1, x: 0, y: 0, r: 0 };
function initViewer() {
  const P = pics();

  const st = $('vstage');
  let drag = null;
  st.onwheel = e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : .89); };
  st.onpointerdown = e => { drag = { x: e.clientX - vs.x, y: e.clientY - vs.y }; st.setPointerCapture(e.pointerId); st.style.cursor = 'grabbing'; };
  st.onpointermove = e => { if (drag) { vs.x = e.clientX - drag.x; vs.y = e.clientY - drag.y; apply(); } };
  st.onpointerup = () => { drag = null; st.style.cursor = 'grab'; };
  st.ondblclick = () => zoom(1.6);
  showPic(Math.min(pIdx, Math.max(P.length - 1, 0)));
}
async function showPic(k) {
  const P = pics(); if (!P.length) return;
  pIdx = k;
  document.querySelectorAll('.th').forEach((el, j) => el.classList.toggle('on', j === k));
  $('pg').textContent = P[k].label + ' • ' + (k + 1) + ' من ' + P.length;

}
function fit() {
  const im = $('vimg'), st = $('vstage'); if (!im || !im.naturalWidth) return;
  const rotated = vs.r % 180 !== 0;
  const w = rotated ? im.naturalHeight : im.naturalWidth, h = rotated ? im.naturalWidth : im.naturalHeight;
  vs.s = Math.min(st.clientWidth / w, st.clientHeight / h) * .98; vs.x = 0; vs.y = 0; apply();
}
function zoom(k) { vs.s = Math.min(8, Math.max(.1, vs.s * k)); apply(); }
function rot() { vs.r = (vs.r + 90) % 360; fit(); }
function apply() { const im = $('vimg'); if (im) im.style.transform = 'translate(-50%,-50%) translate(' + vs.x + 'px,' + vs.y + 'px) scale(' + vs.s + ') rotate(' + vs.r + 'deg)'; }

// ---------- الإكسل: 4 أعمدة (xlsx أو xls 2003) ----------
function saveSheet(rows, cols, sheet, name, type) {
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = cols.map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, sheet);
  const file = name.replace(/[\\/:*?"<>|]/g, '-') + '.' + type;
  try {
    const data = XLSX.write(wb, { bookType: type === 'xls' ? 'biff8' : 'xlsx', type: 'array' });
    const mime = type === 'xls' ? 'application/vnd.ms-excel' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    saveBlob(new Blob([data], { type: mime }), file);
  } catch (e) { toast('ما قدرناش نعمل الإكسل: ' + msg(e)); }
}
// تنزيل ملف: على الموبايل بيفتح المشاركة، وعلى الكمبيوتر بينزل في التنزيلات
async function saveBlob(blob, file) {
  const mobile = matchMedia('(pointer:coarse)').matches;
  if (mobile && navigator.canShare) {
    try {
      const f = new File([blob], file, { type: blob.type });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: file }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = file; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
  toast('⬇️ اتنزل: ' + file + ' - هتلاقيه في التنزيلات (Downloads)');
}
function excel(type) {
  const v = cur.invoice;
  const rows = [['اسم الصنف', 'الكمية', 'السعر', 'الإجمالي']].concat(cur.lines.map(l => [l.name, l.pieces, Math.round(l.piecePrice * 10000) / 10000, l.total]));
  saveSheet(rows, [40, 10, 12, 14], 'الفاتورة', 'فاتورة ' + v.supplier + ' - ' + v.store, type || 'xlsx');
}
// الأصناف اللي سعر بيعها اتعدل بس: اسم الصنف والسعر الجديد
function pricesExcel() {
  const v = cur.invoice;
  const rows = [['اسم الصنف', 'سعر البيع الجديد']].concat(cur.lines.filter(l => l.newSale !== null).map(l => [l.name, l.newSale]));
  saveSheet(rows, [40, 16], 'الأسعار', 'أسعار بيع - ' + v.supplier + ' - ' + v.store, 'xls');
}

function bindDrop() {
  const d = $('drop');
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); });
}
document.addEventListener('paste', e => {
  if (!$('drop')) return;
  const files = [...(e.clipboardData?.items || [])].filter(x => x.type.startsWith('image/')).map(x => x.getAsFile());
  if (files.length) { e.preventDefault(); addFiles(files); }
});
function addFiles(list) {
  [...list].filter(f => f && f.type.startsWith('image/')).forEach(async f => { shots.push(await shrink(f)); renderShots(); });
}
function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 1800, k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function renderShots() {
  const el = $('shots'); if (!el) return;

function loadImage(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function buildMerged() {
  const v = cur.invoice, box = $('merged');

    if (v.merged) url = await img(v.merged);
    else {
      const n = Math.min(v.photos.length, v.screens.length); // أول صورة مع أول صورة، والباقي بيتهمل

      try { await document.fonts.load('bold 46px Cairo'); } catch (e) {}

        : '<button class="btn green" onclick="share()">📲 مشاركة (واتساب)</button>') +

  } catch (e) { box.innerHTML = '<div class="err">ما قدرناش نعمل الصورة المدمجة: ' + esc(msg(e)) + '</div>'; }
}
function draw(pairs, v, logo) {
  const H = 1100, gap = 24, pad = 30, labelH = 56;
  const rows = pairs.map(([branch, sys]) => {
    const wb = branch.width * H / branch.height, ws = sys.width * H / sys.height;
    return { branch, sys, wb, ws, w: wb + ws + gap };
  });
  let W = Math.max(1400, Math.max(...rows.map(r => r.w)) + pad * 2);
  const c = document.createElement('canvas'), x0 = c.getContext('2d');
  x0.font = 'bold 46px Cairo, Tahoma, Arial';
  const logoH = 120, logoW = logo.width * logoH / logo.height;
  const lines = wrap(x0, captionText(v), W - pad * 3 - logoW);
  const head = Math.max(logoH + 50, 50 + lines.length * 64 + 20);
  c.width = W; c.height = head + rows.length * (H + labelH + gap) + pad + 60;
  const x = c.getContext('2d');
  x.fillStyle = '#F3F7FC'; x.fillRect(0, 0, c.width, c.height);
  const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#1479D3'); g.addColorStop(1, '#0B3D6E');
  x.fillStyle = g; x.fillRect(0, 0, W, head);
  // اللوجو في كارت أبيض على اليمين
  x.fillStyle = '#fff'; roundRect(x, W - pad - logoW - 30, (head - logoH - 20) / 2, logoW + 30, logoH + 20, 22); x.fill();
  x.drawImage(logo, W - pad - logoW - 15, (head - logoH) / 2, logoW, logoH);
  x.fillStyle = '#fff'; x.font = 'bold 46px Cairo, Tahoma, Arial'; x.textAlign = 'right'; x.direction = 'rtl'; x.textBaseline = 'top';
  const tx = W - pad * 2 - logoW - 30, ty = (head - lines.length * 64) / 2;
  lines.forEach((ln, k) => x.fillText(ln, tx, ty + k * 64));
  let y = head + gap;
  x.textAlign = 'center';
  rows.forEach(r => {
    const left = (W - r.w) / 2;
    x.drawImage(r.sys, left, y + labelH, r.ws, H);                 // شمال: السيستم
    x.drawImage(r.branch, left + r.ws + gap, y + labelH, r.wb, H); // يمين: فاتورة الفرع
    x.font = 'bold 36px Cairo, Tahoma, Arial'; x.fillStyle = '#0B3D6E';
    x.fillText('🖥 السيستم', left + r.ws / 2, y + 6);
    x.fillText('🧾 فاتورة الفرع', left + r.ws + gap + r.wb / 2, y + 6);
    y += H + labelH + gap;
  });
  x.fillStyle = '#6B7785'; x.font = '600 28px Cairo, Tahoma, Arial';
  x.fillText('مدقق - ' + v.doneBy + ' - ' + dt(v.doneAt), W / 2, c.height - 50);
  const max = 2600;
  if (c.width > max) {
    const k = max / c.width, s = document.createElement('canvas');
    s.width = max; s.height = Math.round(c.height * k);
    s.getContext('2d').drawImage(c, 0, 0, s.width, s.height);
    return s.toDataURL('image/jpeg', 0.86);
  }
  return c.toDataURL('image/jpeg', 0.86);
}
function roundRect(x, l, t, w, h, r) { x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r); x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath(); }
function wrap(ctx, text, maxW) {
  const words = text.split(' '), out = []; let line = '';
  words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
  if (line) out.push(line);
  return out;
}
function mergedName() { const v = cur.invoice; return ('فاتورة ' + v.supplier + ' - ' + v.systemNo).replace(/[\\/:*?"<>|]/g, '-') + '.jpg'; }
async function share() {

const QUICK_REPLIES = ['تمام، جاري الإدخال 👍', 'الصورة مش واضحة - صوّرها تاني من فضلك', 'ناقص صفحة من الفاتورة', 'راجع الإجمالي من فضلك', 'الفاتورة دخلت السيستم ✅', 'شكرًا 🙏'];

// ---------- لوحة المحلات: عمود لكل محل، وكل فاتورة كارت بالأحداث بتاعتها بالترتيب ----------
let boardDays = 3;
function tm(s) {
  if (!s) return '';
  const d = new Date(s), today = new Date(now());
  const t = d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
  return d.toDateString() === today.toDateString() ? t : d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' }) + ' ' + t;
}
// أحداث الفاتورة بالترتيب الزمني
function invEvents(v) {
  const ev = [];
  if (v.createdAt) ev.push({ t: v.createdAt, i: '📤', x: 'رفعها ' + (v.user || 'الفرع') + (v.rejectCount ? ' (اتبعتت تاني بعد الرفض)' : '') });
  (v.urgeLog || '').split('\n').filter(Boolean).forEach(line => {
    const m = line.match(/^(.*) - (\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})$/);
    ev.push({ t: m ? m[2] + 'T' + m[3] + ':00' : v.urgedAt, i: '🔥', x: 'استعجال من ' + (m ? m[1] : line), local: !!m });
  });
  if (v.receivedAt) ev.push({ t: v.receivedAt, i: '📥', x: 'استلمها ' + v.receivedBy + ' (بعد ' + durTxt(mins(v.createdAt, v.receivedAt)) + ')' });
  if (v.rejectedAt) ev.push({ t: v.rejectedAt, i: '❌', x: 'رفضها ' + v.rejectedBy + ': ' + v.rejectReason, cls: 'note' });
  const ql = qaLogList(v);
  if (ql.length) {
    ql.forEach(x => {
      if (x.type === 'للجودة') ev.push({ t: x.at, i: '📤', x: 'دخّلها ' + x.name + ' وبعتها للجودة' });
      else if (x.type === 'رجوع') ev.push({ t: x.at, i: '↩️', x: 'الجودة (' + x.name + ') رجّعتها: ' + x.note, cls: 'note' });
      else if (x.type === 'اعتماد') ev.push({ t: x.at, i: '✅', x: 'اعتمدتها الجودة (' + x.name + ') - دخلت السيستم #' + v.systemNo + ' (بعد ' + durTxt(mins(v.createdAt, x.at)) + ')' });
    });
  } else if (v.doneAt) ev.push({ t: v.doneAt, i: '✅', x: 'دخلت السيستم #' + v.systemNo + ' - ' + v.doneBy + ' (بعد ' + durTxt(mins(v.createdAt, v.doneAt)) + ')' });
  if (v.reviewedAt) ev.push({ t: v.reviewedAt, i: v.reviewNotes ? '📝' : '👀', x: 'راجعها الفرع: ' + v.reviewedBy + (v.reviewNotes ? ' - ' + v.reviewNotes : ''), cls: v.reviewNotes ? 'note' : '' });
  ev.forEach(e => { e.ms = e.local ? new Date(e.t).getTime() : new Date(e.t).getTime(); });
  return ev.sort((a, b) => a.ms - b.ms);
}
function renderBoard() {
  if (!$('board')) return;
  document.querySelectorAll('#bRange button').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.d) === boardDays);
    b.onclick = () => { boardDays = Number(b.dataset.d); renderBoard(); };
  });
  const since = new Date(now()); since.setHours(0, 0, 0, 0); since.setDate(since.getDate() - (boardDays - 1));
  const q = $('bText').value.trim(), onlyOpen = $('bOpen').checked;
  const last = v => Math.max(...invEvents(v).map(e => e.ms).filter(x => !isNaN(x)), 0);
  const list = all.filter(v => (pending(v) || v.status === ST_REJ || last(v) >= since.getTime()) &&
    (!onlyOpen || pending(v) || v.status === ST_REJ) &&
    (!q || (v.supplier + ' ' + v.user + ' ' + v.number + ' ' + v.systemNo + ' ' + (v.receivedBy || '') + ' ' + (v.doneBy || '')).indexOf(q) !== -1));
  const names = stores.length ? stores.slice() : [...new Set(all.map(v => v.store))];
  // المحلات اللي فيها شغل مستني الأول
  const by = {}; names.forEach(n => by[n] = []);
  list.forEach(v => (by[v.store] = by[v.store] || []).push(v));
  const score = n => by[n].filter(pending).length * 1000 + by[n].length;
  const order = Object.keys(by).sort((a, b) => score(b) - score(a) || a.localeCompare(b));
  $('bInfo').textContent = list.length + ' فاتورة في ' + order.filter(n => by[n].length).length + ' محل';
  $('board').innerHTML = order.map(n => {
    const vs = by[n].slice().sort((a, b) => (pending(b) ? 1 : 0) - (pending(a) ? 1 : 0) || last(b) - last(a));
    const pend = vs.filter(pending), late = pend.filter(v => mins(v.createdAt, now()) > SLA_MIN).length;
    const today = new Date(now()); today.setHours(0, 0, 0, 0);
    const doneToday = all.filter(v => v.store === n && v.status === ST_DONE && new Date(v.doneAt) >= today).length;
    const rej = vs.filter(v => v.status === ST_REJ).length, rev = vs.filter(v => v.status === ST_DONE && !v.reviewedBy).length;
    const urge = pend.filter(v => v.urgeCount).length;
    return '<div class="bcol"><div class="bhead"><h3><span class="dot' + (late || urge ? ' bad' : pend.length ? ' warn' : '') + '"></span>' + esc(n) + '</h3>' +
      '<div class="bstats">' + (pend.length ? '<span class="o">⏳ ' + pend.length + ' مستنية</span>' : '') + (late ? '<span class="r">⚠️ ' + late + ' متأخرة</span>' : '') +
      (urge ? '<span class="r">🔥 ' + urge + ' مستعجلة</span>' : '') + '<span class="g">✅ ' + doneToday + ' النهارده</span>' +
      (rej ? '<span>↩️ ' + rej + ' مرفوضة</span>' : '') + (rev ? '<span>👀 ' + rev + ' مستنية مراجعة</span>' : '') + '</div>' +
      '<button class="bchat" onclick="openChatModal(\'' + esc(n).replace(/'/g, "\\'") + '\')">💬 شات الفرع' + (chatUnread(n, '') ? ' <span class="cbadge new">' + chatUnread(n, '') + '</span>' : '') + '</button></div>' +
      '<div class="bbody">' + (vs.length ? vs.map(v => {
        const isLate = pending(v) && mins(v.createdAt, now()) > SLA_MIN;
        return '<div class="bcard ' + (v.status === ST_DONE ? 'st-done' : v.status === ST_WORK ? 'st-work' : v.status === ST_REJ ? 'st-rej' : '') + (isLate ? ' late' : '') +
          (v.status === ST_QA ? ' st-qa' : '') + '" onclick="page(\'inv\');tab=\'الكل\';openInv(\'' + v.id + '\')">' +
          '<div class="bt"><b>' + esc(v.supplier) + (v.urgeCount && pending(v) ? ' <span class="urge">🔥' + (v.urgeCount > 1 ? '×' + v.urgeCount : '') + '</span>' : '') + chatTag(v.store, v.id) + '</b>' + badge(v.status) + '</div>' +
          '<div class="bm">' + v.count + ' صنف • <b>' + money(v.total) + ' ج.م</b>' + (v.priceUps ? ' • 📈' + v.priceUps : '') + (v.priceDowns ? ' • 📉' + v.priceDowns : '') +
          (pending(v) ? ' • ' + timerHtml(v) : '') + '</div>' +
          '<ul class="tl">' + invEvents(v).map(e => '<li class="' + (e.cls || '') + '"><span>' + e.i + '</span><span>' + esc(e.x) + '</span><span class="tm">' + tm(e.t) + '</span></li>').join('') + '</ul></div>';
      }).join('') : '<div class="bempty">مفيش حركة في الفترة دي</div>') + '</div></div>';
  }).join('');
}

// ---------- أداء الدعم ----------
function renderPerf() {
  const start = new Date(now());
  if (perfRange === 'today') start.setHours(0, 0, 0, 0);
  else if (perfRange === 'week') start.setDate(start.getDate() - 7);
  else if (perfRange === 'month') start.setDate(start.getDate() - 30);
  else start.setFullYear(2000);
  const done = all.filter(v => v.status === ST_DONE && v.doneAt && new Date(v.doneAt) >= start);
  const ppl = {};
  done.forEach(v => {
    const p = ppl[v.doneBy] = ppl[v.doneBy] || { name: v.doneBy, n: 0, total: 0, mins: 0, ontime: 0, pick: 0, pickN: 0, lines: 0 };
    const m = mins(v.createdAt, v.doneAt);
    p.n++; p.total += v.total; p.mins += m; p.lines += v.count;
    if (m <= SLA_MIN) p.ontime++;
    if (v.receivedAt) { p.pick += mins(v.createdAt, v.receivedAt); p.pickN++; }
    if (v.qaBy) { p.qaN = (p.qaN || 0) + 1; if (!v.qaRejects) p.first = (p.first || 0) + 1; p.qaR = (p.qaR || 0) + v.qaRejects; }
  });
  all.filter(v => v.status === ST_WORK && v.receivedBy).forEach(v => {
    const p = ppl[v.receivedBy] = ppl[v.receivedBy] || { name: v.receivedBy, n: 0, total: 0, mins: 0, ontime: 0, pick: 0, pickN: 0, lines: 0 };
    p.open = (p.open || 0) + 1;
  });
  // وقت الرد على الشات (بمواعيد العمل)
  const reps = (chatSum.replies || []).filter(x => new Date(x.at) >= start);
  reps.forEach(x => {
    const p = ppl[x.by] = ppl[x.by] || { name: x.by, n: 0, total: 0, mins: 0, ontime: 0, pick: 0, pickN: 0, lines: 0 };
    p.cr = (p.cr || 0) + mins(x.asked, x.at); p.crN = (p.crN || 0) + 1;
  });
  const list = Object.values(ppl).map(p => {
    p.avg = p.n ? p.mins / p.n : 0; p.rate = p.n ? p.ontime / p.n : 0;
    const cnt = Math.min(1, p.n / Math.max(...Object.values(ppl).map(x => x.n || 0), 1));
    p.fp = p.qaN ? p.first / p.qaN : null; // نسبة اللي عدّت من الجودة من أول مرة
    p.score = !p.n ? 0 : p.fp === null ? Math.round(p.rate * 60 + cnt * 40) : Math.round(p.rate * 40 + cnt * 30 + p.fp * 30);
    return p;
  }).sort((a, b) => b.score - a.score || b.n - a.n);
  const colors = r => r >= .9 ? 'var(--green)' : r >= .7 ? 'var(--yellow)' : 'var(--red)';
  const medals = ['🥇', '🥈', '🥉'];
  let h = '<div class="perf-head"><h2>🏆 أداء الدعم في إدخال الفواتير</h2><select onchange="perfRange=this.value;renderPerf()">' +
    [['today', 'النهارده'], ['week', 'آخر 7 أيام'], ['month', 'آخر 30 يوم'], ['all', 'الكل']].map(([k, t]) => '<option value="' + k + '"' + (perfRange === k ? ' selected' : '') + '>' + t + '</option>').join('') +
    '</select></div>';
  const tot = done.length, avgAll = tot ? done.reduce((s, v) => s + mins(v.createdAt, v.doneAt), 0) / tot : 0;
  const onAll = tot ? done.filter(v => mins(v.createdAt, v.doneAt) <= SLA_MIN).length / tot : 0;
  h += '<div class="stats"><div class="stat s3"><small>فواتير دخلت</small><b>' + tot + '</b></div>' +
    '<div class="stat s2"><small>متوسط الوقت</small><b>' + durTxt(avgAll) + '</b></div>' +
    '<div class="stat s1"><small>في الميعاد (≤ ' + SLA_MIN + ' د)</small><b>' + Math.round(onAll * 100) + '%</b></div>' +
    '<div class="stat s4"><small>متأخرة دلوقتي</small><b>' + all.filter(v => pending(v) && mins(v.createdAt, now()) > SLA_MIN).length + '</b></div>' +
    '<div class="stat s10"><small>💬 متوسط الرد على الشات</small><b>' + (reps.length ? durTxt(reps.reduce((a, x) => a + mins(x.asked, x.at), 0) / reps.length) : '-') + '</b></div></div>';
  h += list.length ? '<div class="people">' + list.map((p, k) =>
    '<div class="person"><div class="ph"><div class="av">' + esc((p.name || '?').trim().charAt(0)) + '</div><div class="nm">' + esc(p.name) + '</div><div class="medal">' + (p.n ? (medals[k] || '') : '') + '</div></div>' +
    '<div class="kpis">' +
    '<div class="kpi"><small>فواتير</small><b>' + p.n + '</b></div>' +
    '<div class="kpi"><small>أصناف</small><b>' + p.lines + '</b></div>' +
    '<div class="kpi"><small>متوسط الوقت</small><b>' + (p.n ? durTxt(p.avg) : '-') + '</b></div>' +
    '<div class="kpi"><small>متوسط الاستلام</small><b>' + (p.pickN ? durTxt(p.pick / p.pickN) : '-') + '</b></div>' +
    '<div class="kpi"><small>في الميعاد</small><b style="color:' + colors(p.rate) + '">' + Math.round(p.rate * 100) + '%</b></div>' +
    '<div class="kpi"><small>شغّال عليها دلوقتي</small><b>' + (p.open || 0) + '</b></div>' +
    '<div class="kpi"><small>💬 متوسط الرد على الشات</small><b>' + (p.crN ? durTxt(p.cr / p.crN) + ' (' + p.crN + ')' : '-') + '</b></div>' +
    '<div class="kpi"><small>🔍 عدّت الجودة من أول مرة</small><b style="color:' + (p.fp === null ? 'inherit' : colors(p.fp)) + '">' + (p.fp === null ? '-' : Math.round(p.fp * 100) + '%') + '</b></div>' +
    '<div class="kpi"><small>↩️ رجوع من الجودة</small><b>' + (p.qaR || 0) + '</b></div>' +
    '</div><div class="bar"><i style="width:' + p.score + '%;background:' + colors(p.rate) + '"></i></div>' +
    '<small style="color:var(--muted)">الدرجة ' + p.score + '/100 ' + (p.fp === null ? '(الالتزام بالوقت 60 + عدد الفواتير 40)' : '(الوقت 40 + عدد الفواتير 30 + الجودة من أول مرة 30)') + '</small></div>'
  ).join('') + '</div>' : '<div class="pane empty">مفيش فواتير دخلت في الفترة دي</div>';
  // ---------- تقييم قسم الجودة ----------
  const qa = {};
  all.forEach(v => {
    const log = qaLogList(v);
    log.forEach((x, k) => {
      if ((x.type !== 'اعتماد' && x.type !== 'رجوع') || new Date(x.at) < start) return;
      const q = qa[x.name] = qa[x.name] || { name: x.name, ok: 0, ret: 0, mins: 0, n: 0, compl: 0, late: 0 };
      const sent = log.slice(0, k).reverse().find(y => y.type === 'للجودة');
      if (sent) { const m = mins(sent.at, x.at); q.mins += m; q.n++; if (m > QA_SLA_MIN) q.late++; }
      if (x.type === 'اعتماد') { q.ok++; if (v.reviewNotes) q.compl++; } else q.ret++;
    });
  });
  const qal = Object.values(qa).sort((a, b) => (b.ok + b.ret) - (a.ok + a.ret));
  if (qal.length) {
    h += '<div class="pane stores-perf"><h3 style="margin-top:0;color:#4527A0">🔍 تقييم قسم الجودة</h3>' +
      '<small style="color:var(--muted)">الشكاوى = فواتير الجودة اعتمدتها والفرع كتب عليها ملاحظة وهو بيراجع صورة الإثبات</small>' +
      '<table><thead><tr><th>الاسم</th><th>اعتمد</th><th>رجّع للدعم</th><th>متوسط وقت المراجعة</th><th>متأخرة (&gt; ' + QA_SLA_MIN + ' د)</th><th>شكاوى الفروع</th><th>التقييم</th></tr></thead><tbody>' +
      qal.map(q => {
        const rate = q.ok ? 1 - q.compl / q.ok : 1, onT = q.n ? 1 - q.late / q.n : 1;
        const sc = Math.round(rate * 60 + onT * 40);
        return '<tr><td>' + esc(q.name) + '</td><td class="num">' + q.ok + '</td><td class="num">' + q.ret + '</td><td>' + (q.n ? durTxt(q.mins / q.n) : '-') +
          '</td><td class="num">' + q.late + '</td><td class="num" style="color:' + (q.compl ? '#C62828' : 'inherit') + '">' + q.compl +
          '</td><td><b style="color:' + colors(sc / 100) + '">' + sc + '/100</b></td></tr>';
      }).join('') + '</tbody></table><small style="color:var(--muted)">التقييم = خلو الفواتير من شكاوى الفروع 60 + المراجعة في الميعاد 40</small></div>';
  }
  // الفروع
  const byStore = {};
  all.filter(v => new Date(v.createdAt) >= start).forEach(v => {
    const s = byStore[v.store] = byStore[v.store] || { n: 0, done: 0, mins: 0, total: 0 };
    s.n++; s.total += v.total;
    if (v.status === ST_DONE) { s.done++; s.mins += mins(v.createdAt, v.doneAt); }
  });
  const sl = Object.entries(byStore).sort((a, b) => b[1].n - a[1].n);
  if (sl.length) h += '<div class="pane stores-perf"><h3 style="margin-top:0;color:var(--navy)">🏪 الفروع</h3><table><thead><tr><th>الفرع</th><th>فواتير</th><th>دخلت</th><th>متوسط وقت الإدخال</th><th>قيمة الفواتير</th></tr></thead><tbody>' +
    sl.map(([n, s]) => '<tr><td>' + esc(n) + '</td><td class="num">' + s.n + '</td><td class="num">' + s.done + '</td><td>' + (s.done ? durTxt(s.mins / s.done) : '-') + '</td><td class="num">' + money(s.total) + '</td></tr>').join('') + '</tbody></table></div>';
  $('pagePerf').innerHTML = h;
}

// لو كان داخل قبل كده
(function () {
  $('lEmail').value = ls('dashEmail') || '';
  const t = ls('dashToken');
  if (t) { token = t; me = ls('dashName') || ''; showApp(); }
})();
</script>
