<!DOCTYPE html>
<!-- مفيش dir="rtl" هنا: بيزق فيديو الكاميرا برا الشاشة على الويب (Flutter بيظبط الاتجاه لوحده) -->
<html lang="ar">
<head>
  <base href="/modaqqeq-dashboard/purchases/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="مشتريات ودعم فني">
  <meta name="theme-color" content="#1479D3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مشتريات ودعم فني">
  <link rel="apple-touch-icon" href="icons/Icon-maskable.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>مشتريات ودعم فني</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F3F7FC; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; color: #fff; background: linear-gradient(180deg, #2696F0, #09488C); z-index: 1; }
    #splash img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    #splash b { font-size: 22px; }
    #splash .bar { width: 140px; height: 5px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #fff; border-radius: 4px; animation: mv 1.1s infinite ease-in-out; }
    @keyframes mv { 0% { transform: translateX(160%); } 100% { transform: translateX(-260%); } }
  </style>
  <!-- إشعارات (Firebase) - نفس مشروع مدقق -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</head>
<body>
  <div id="splash" dir="rtl"><img src="icons/Icon-192.png" alt=""><b>مشتريات ودعم فني</b><div class="bar"><i></i></div></div>
  <script>
    // ---- الجسر بين التطبيق والمتصفح: تخزين الملفات (IndexedDB) + الإشعارات ----
    window.mdq = {
      _db: null,
      _open() {
        return this._db || (this._db = new Promise((ok, bad) => {
          const r = indexedDB.open('mdq-files', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('f');
          r.onsuccess = () => ok(r.result);
          r.onerror = () => bad(r.error);
        }));
      },
      async _tx(mode, fn) {
        const db = await this._open();
        return new Promise((ok, bad) => {
          const t = db.transaction('f', mode), q = fn(t.objectStore('f'));
          t.oncomplete = () => ok(q && q.result);
          t.onerror = () => bad(t.error);
        });
      },
      async get(k) { const v = await this._tx('readonly', s => s.get(k)); return v ? new Uint8Array(v) : null; },
      put(k, b) { return this._tx('readwrite', s => s.put(b.slice().buffer, k)); },
      del(k) { return this._tx('readwrite', s => s.delete(k)); },
      // الإشعارات
      _cfg: { apiKey: 'AIzaSyD9oDfJSrYrPa1iQEDcg-Oa-iGEmFnR1ok', authDomain: 'modaqqeq-54f57.firebaseapp.com', projectId: 'modaqqeq-54f57',
        messagingSenderId: '894594212138', appId: '1:894594212138:web:35cf6a1aa4b99a7ccffe53' },
      _vapid: 'BKobeqFRKZa2eY7VwglxfttYN8pj4sHu3SNDTkJYuUAxPD4Ld0zveWKNGktx7U9-YAiJhwGSn_-hpfI-VxonoaI',
      pushState() {
        if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
        return Notification.permission;
      },
      async enablePush() {
        if (this.pushState() === 'unsupported') return 'unsupported';
        try { return await Notification.requestPermission(); } catch (e) { return 'denied'; }
      },
      async pushToken() {
        if (this.pushState() !== 'granted' || !window.firebase) return null;
        if (!firebase.apps.length) firebase.initializeApp(this._cfg);
        const reg = await navigator.serviceWorker.ready;
        return await firebase.messaging().getToken({ vapidKey: this._vapid, serviceWorkerRegistration: reg });
      },
      // الإشعار اللي فتح التطبيق
      openTarget() { return new URLSearchParams(location.search).get('open') || ''; },
      // تنزيل ملف (تقرير إكسل) باسمه الصح
      saveFile(name, mime, bytes) {
        const url = URL.createObjectURL(new Blob([bytes.slice()], { type: mime }));
        const a = document.createElement('a');
        a.href = url; a.download = name; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      },
      // مشاركة ملف (واتساب...) - لو المتصفح مش بيقبل الإكسل بنجرب نسخة CSV
      // بيرجع: shared / cancel / needtap (محتاج دوسة جديدة) / unsupported
      async shareFile(name, mime, bytes, csvName, csvBytes, text) {
        if (!navigator.share || !navigator.canShare) return 'unsupported';
        // CSV الأول: كل المتصفحات بتقبل تشاركه (وبيتفتح على الإكسل) - الإكسل نفسه كروم بيرفضه
        const cands = [];
        if (csvBytes && csvBytes.length) cands.push(new File([csvBytes.slice()], csvName, { type: 'text/csv' }));
        cands.push(new File([bytes.slice()], name, { type: mime }));
        for (const f of cands) {
          let ok = false;
          try { ok = navigator.canShare({ files: [f] }); } catch (e) {}
          if (!ok) continue;
          try { await navigator.share({ files: [f], title: text, text: text }); return 'shared'; }
          catch (e) {
            if (!(e && e.name === 'NotAllowedError')) return 'cancel';
            // المتصفح عاوز دوسة جديدة: زرار حقيقي في الصفحة يفتح المشاركة على طول من الدوسة
            return await mdq.shareTap(f, text);
          }
        }
        return 'unsupported';
      },
      shareTap(f, text) {
        return new Promise(resolve => {
          const bg = document.createElement('div');
          bg.dir = 'rtl';
          bg.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif';
          const box = document.createElement('div');
          box.style.cssText = 'background:#fff;border-radius:22px;padding:22px 18px;width:min(86vw,360px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)';
          box.innerHTML = '<div style="font-size:44px">✅</div><div style="font-size:20px;font-weight:800;margin:6px 0 4px">الملف جاهز</div>' +
            '<div style="color:#555;font-size:15px;margin-bottom:16px"></div>';
          box.children[2].textContent = text || '';
          const go = document.createElement('button');
          go.textContent = '📤 ابعته واتساب';
          go.style.cssText = 'width:100%;height:54px;border:0;border-radius:16px;background:#25D366;color:#fff;font-size:18px;font-weight:800;margin-bottom:8px';
          const no = document.createElement('button');
          no.textContent = 'رجوع';
          no.style.cssText = 'width:100%;height:44px;border:0;border-radius:14px;background:#eef2f6;color:#333;font-size:16px';
          box.append(go, no);
          bg.append(box);
          document.body.append(bg);
          const done = r => { bg.remove(); resolve(r); };
          no.onclick = () => done('cancel');
          go.onclick = () => {
            navigator.share({ files: [f], title: text, text: text })
              .then(() => done('shared'))
              .catch(e => {
                if (e && e.name === 'AbortError') return done('cancel');
                mdq.lastShareErr = (e && (e.name + ': ' + e.message)) || 'error';
                console.log('share failed', mdq.lastShareErr);
                done('unsupported');
              });
          };
        });
      }
    };
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    // ---- زرار "ثبّت التطبيق" تحت (بيختفي لو التطبيق متثبت أو الموظف قفله) ----
    (function () {
      const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      let evt = null;
      const KEY = 'mdq-install-hidden';
      const hiddenRecently = () => { try { return Date.now() - Number(localStorage.getItem(KEY) || 0) < 3 * 86400000; } catch (e) { return false; } };
      function bar() {
        if (standalone() || hiddenRecently() || document.getElementById('mdqInstall')) return;
        if (!evt && !ios) return;
        const d = document.createElement('div');
        d.id = 'mdqInstall';
        d.setAttribute('dir', 'rtl');
        d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9999;' +
          'background:#0B4F94;color:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;' +
          'padding:10px 12px;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px';
        d.innerHTML = '<img src="icons/Icon-192.png" alt="" style="width:40px;height:40px;border-radius:10px;background:#fff">' +
          '<div style="flex:1;line-height:1.4"><b>ثبّت التطبيق على موبايلك</b><br><span style="font-size:13px;opacity:.85">يفتح من الأيقونة زي أي تطبيق</span></div>' +
          '<button id="mdqInstallGo" style="border:0;border-radius:12px;background:#fff;color:#0B4F94;font-weight:bold;font-size:15px;padding:10px 14px;font-family:inherit">ثبّت</button>' +
          '<button id="mdqInstallX" aria-label="قفل" style="border:0;background:transparent;color:#fff;font-size:22px;padding:4px 6px">×</button>';
        document.body.appendChild(d);
        document.getElementById('mdqInstallX').onclick = () => { try { localStorage.setItem(KEY, Date.now()); } catch (e) {} d.remove(); };
        document.getElementById('mdqInstallGo').onclick = async () => {
          if (evt) {
            evt.prompt();
            const r = await evt.userChoice.catch(() => null);
            if (r && r.outcome === 'accepted') d.remove();
            evt = null;
            return;
          }
          // آيفون: نشرح الطريقة
          const h = document.createElement('div');
          h.setAttribute('dir', 'rtl');
          h.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(8,25,45,.6);display:flex;align-items:flex-end;justify-content:center';
          h.innerHTML = '<div style="background:#fff;color:#0B3D6E;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:min(520px,100%);line-height:1.9;font-family:-apple-system,Tahoma,sans-serif;font-size:16px">' +
            '<b style="font-size:18px">ثبّت التطبيق على الآيفون</b><br>1- افتح الصفحة دي من <b>Safari</b><br>2- دوس زرار المشاركة <b>⬆️</b> اللي تحت<br>' +
            '3- اختار <b>"إضافة إلى الشاشة الرئيسية"</b> وبعدين <b>إضافة</b>' +
            '<div style="text-align:center;margin-top:12px"><button style="border:0;border-radius:12px;background:#1479D3;color:#fff;font-weight:bold;font-size:16px;padding:10px 28px">تمام</button></div></div>';
          h.onclick = (e) => { if (e.target === h || e.target.tagName === 'BUTTON') h.remove(); };
          document.body.appendChild(h);
        };
      }
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); evt = e; bar(); });
      window.addEventListener('appinstalled', () => { const d = document.getElementById('mdqInstall'); if (d) d.remove(); });
      if (ios) setTimeout(bar, 4000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
