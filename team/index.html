  <script>
    // ---- الجسر بين التطبيق والمتصفح: تخزين الملفات (IndexedDB) + الإشعارات ----
    document.addEventListener('visibilitychange', () => {
      // الموبايل بيلغي طلب الشاشة لما التطبيق يروح الخلفية - نرجّعه أول ما يرجع
      if (document.visibilityState === 'visible' && window.mdq && mdq._wlWant) mdq.wakeLock(true);
    });
    window.mdq = {
      _db: null,
      _open() {
        return this._db || (this._db = new Promise((ok, bad) => {
          const r = indexedDB.open('mdq-files', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('f');
          r.onsuccess = () => ok(r.result);
          r.onerror = () => bad(r.error);
        }));
      },
      async _tx(mode, fn) {
        const db = await this._open();
        return new Promise((ok, bad) => {
          const t = db.transaction('f', mode), q = fn(t.objectStore('f'));
          t.oncomplete = () => ok(q && q.result);
          t.onerror = () => bad(t.error);
        });
      },
      async get(k) { const v = await this._tx('readonly', s => s.get(k)); return v ? new Uint8Array(v) : null; },
      put(k, b) { return this._tx('readwrite', s => s.put(b.slice().buffer, k)); },
      del(k) { return this._tx('readwrite', s => s.delete(k)); },
      // الإشعارات
      _cfg: { apiKey: 'AIzaSyD9oDfJSrYrPa1iQEDcg-Oa-iGEmFnR1ok', authDomain: 'modaqqeq-54f57.firebaseapp.com', projectId: 'modaqqeq-54f57',
        messagingSenderId: '894594212138', appId: '1:894594212138:web:35cf6a1aa4b99a7ccffe53' },
      _vapid: 'BKobeqFRKZa2eY7VwglxfttYN8pj4sHu3SNDTkJYuUAxPD4Ld0zveWKNGktx7U9-YAiJhwGSn_-hpfI-VxonoaI',
      pushState() {
        if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
        return Notification.permission;
      },
      async enablePush() {
        if (this.pushState() === 'unsupported') return 'unsupported';
        try { return await Notification.requestPermission(); } catch (e) { return 'denied'; }
      },
      async pushToken() {
        if (this.pushState() !== 'granted' || !window.firebase) return null;
        if (!firebase.apps.length) firebase.initializeApp(this._cfg);
        const reg = await navigator.serviceWorker.ready;
        return await firebase.messaging().getToken({ vapidKey: this._vapid, serviceWorkerRegistration: reg });
      },
      // الشاشة ما تنطفيش لوحدها طول ما فيه أصناف جرد لسه ما اترفعتش
      _wl: null, _wlWant: false,
      async wakeLock(on) {
        this._wlWant = on;
        try {
          if (on && !this._wl && navigator.wakeLock && document.visibilityState === 'visible') {
            this._wl = await navigator.wakeLock.request('screen');
            this._wl.addEventListener('release', () => { this._wl = null; });
          } else if (!on && this._wl) {
            const w = this._wl; this._wl = null; await w.release();
          }
        } catch (e) { this._wl = null; }
      },
      // بصمة كلمة السر (PBKDF2-SHA256) للدخول من غير نت - كلمة السر نفسها ما بتتحفظش
      async pbkdf2(pass, salt, iter) {
        const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
        const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt.slice(), iterations: iter }, k, 256);
        return new Uint8Array(b);
      },
      // الإشعار اللي فتح التطبيق
      openTarget() { return new URLSearchParams(location.search).get('open') || ''; },
      // تنزيل ملف (تقرير إكسل) باسمه الصح
      saveFile(name, mime, bytes) {
        const url = URL.createObjectURL(new Blob([bytes.slice()], { type: mime }));
        const a = document.createElement('a');
        a.href = url; a.download = name; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      },
      // تحديث التطبيق لآخر نسخة من غير ما يقفله ويفتحه
      async update() {
        const o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(9,72,140,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:bold 20px system-ui;gap:14px';
        o.innerHTML = '<div style="font-size:46px">🔄</div><div>بنجيب أحدث نسخة...</div>';
        document.body.append(o);
        const reload = () => { const u = new URL(location.href); u.searchParams.set('v', Date.now()); location.replace(u.toString()); };
        // النسخة الجديدة بتتنزل الأول (والقديمة شغالة لحد ما تكمل)، وبعدين يفتح عليها
        if (await mdq.swCheck(true, 180000) !== null) return reload();
        try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {}
        try { const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } catch (e) {}
        await Promise.all(['./', 'index.html', 'flutter_bootstrap.js', 'main.dart.js', 'manifest.json']
          .map(u => fetch(u, { cache: 'reload' }).catch(() => {})));
        const u = new URL(location.href);
        u.searchParams.set('v', Date.now());
        location.replace(u.toString());
      },
      // يسأل الـ service worker يشوف فيه نسخة جديدة وينزّلها: true = اتنزلت، false = مفيش جديد، null = مش متاح / النت وقع
      // ---- كاميرا الباركود (نسخة التجربة): تقريب / تركيز / تصوير صورة ----
      _camTrack() {
        const vids = [];
        const walk = r => { if (!r) return; r.querySelectorAll('video').forEach(v => vids.push(v));
          r.querySelectorAll('*').forEach(e => { if (e.shadowRoot) walk(e.shadowRoot); }); };
        walk(document);
        for (const v of vids) {
          const s = v.srcObject;
          const t = s && s.getVideoTracks && s.getVideoTracks()[0];
          if (t && t.readyState === 'live') return t;
        }
        return null;
      },
      // {w,h,zmin,zmax,zoom,focus,dev,saved} أو '' لو الكاميرا لسه ما فتحتش
      camInfo() {
        try {
          const t = mdq._camTrack(); if (!t) return '';
          const s = t.getSettings ? t.getSettings() : {};
          const c = t.getCapabilities ? t.getCapabilities() : {};
          let saved = ''; try { saved = localStorage.getItem('mdqCamDev') || ''; } catch (e) {}
          return JSON.stringify({ w: s.width || 0, h: s.height || 0,
            zmin: c.zoom ? c.zoom.min : 0, zmax: c.zoom ? c.zoom.max : 0, zoom: s.zoom || 1,
            focus: (c.focusMode || []).join(','), dev: s.deviceId || '', saved });
        } catch (e) { return ''; }
      },
      // كاميرات الموبايل اللي ورا: [{id,label}]
      async camList() {
        try {
          const ds = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
          const back = ds.filter(d => /back|rear|environment|خلف/i.test(d.label || ''));
          const list = back.length ? back : ds.filter(d => !/front|user|أمام/i.test(d.label || ''));
          return JSON.stringify(list.map(d => ({ id: d.deviceId, label: d.label || '' })));
        } catch (e) { return '[]'; }
      },
      // نفتح كاميرا معينة ونحطها مكان اللي شغالة في نفس شاشة القراية (اللي بتقرا الباركود من الفيديو نفسه)
      async camUse(id, save) {
        try {
          const old = mdq._camTrack(); if (!old) return 'no';
          let v = null;
          const walk = r => { if (!r || v) return; r.querySelectorAll('video').forEach(x => { if (!v && x.srcObject && x.srcObject.getVideoTracks && x.srcObject.getVideoTracks()[0] === old) v = x; });
            r.querySelectorAll('*').forEach(e => { if (e.shadowRoot) walk(e.shadowRoot); }); };
          walk(document);
          if (!v) return 'no';
          old.stop();
          const st = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: id }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
          const t = st.getVideoTracks()[0];
          try {
            const f = (t.getCapabilities && t.getCapabilities().focusMode) || [];
            if (f.includes('continuous')) await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          } catch (e) {}
          mdq._camExtra = st;
          v.srcObject = st;
          try { await v.play(); } catch (e) {}
          if (save) try { localStorage.setItem('mdqCamDev', id); } catch (e) {}
          return 'ok';
        } catch (e) { return 'no'; }
      },
      // نقفل الكاميرا اللي إحنا فتحناها (لما الشاشة تتقفل أو قبل كاميرا الموبايل)
      camRelease() {
        try { if (mdq._camExtra) mdq._camExtra.getTracks().forEach(t => t.stop()); } catch (e) {}
        mdq._camExtra = null;
      },
      async camZoom(z) {
        try {
          const t = mdq._camTrack(); if (!t) return 'no';
          const c = t.getCapabilities ? t.getCapabilities() : {};
          if (!c.zoom) return 'no';
          z = Math.max(c.zoom.min, Math.min(c.zoom.max, z));
          await t.applyConstraints({ advanced: [{ zoom: z }] });
          return 'ok';
        } catch (e) { return 'no'; }
      },
      // دوسة على الصورة: الكاميرا تظبط الصورة من الأول
      async camFocus() {
        try {
          const t = mdq._camTrack(); if (!t) return;
          const f = (t.getCapabilities && t.getCapabilities().focusMode) || [];
          if (f.includes('single-shot')) await t.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          if (f.includes('continuous')) setTimeout(() => t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}), 1500);
        } catch (e) {}
      },
      // «صوّر الباركود»: يفتح كاميرا الموبايل العادية، ويقرا الباركود من الصورة بجودتها الكاملة
      // kind: qr / line / any ← بيرجع الرقم، أو '' لو ما اتقراش، أو 'cancel'
      scanPhoto(kind) {
        return new Promise(res => {
          const inp = document.createElement('input');
          inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
          inp.style.display = 'none';
          let done = false;
          const fin = v => { if (done) return; done = true; inp.remove(); res(v); };
          inp.onchange = async () => {
            const f = inp.files && inp.files[0];
            if (!f) return fin('cancel');
            try { fin(await mdq._readPhoto(f, kind)); } catch (e) { fin(''); }
          };
          inp.addEventListener('cancel', () => fin('cancel'));
          document.body.append(inp);
          inp.click();
        });
      },
      async _readPhoto(file, kind) {
        const line = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar'];
        const want = kind === 'qr' ? ['qr_code'] : kind === 'line' ? line : line.concat(['qr_code']);
        const bmp = await createImageBitmap(file);
        // نجرب الصورة كاملة، وبعدين نسخة أصغر (بعض الموبايلات بتفشل في الصور الكبيرة أوي)
        const sizes = [0, 1600, 1000];
        const canv = max => {
          const k = max ? Math.min(1, max / Math.max(bmp.width, bmp.height)) : 1;
          const c = document.createElement('canvas');
          c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
          c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
          return c;
        };
        if (window.BarcodeDetector) {
          try {
            const sup = await BarcodeDetector.getSupportedFormats();
            const fm = want.filter(x => sup.includes(x));
            if (fm.length) {
              const d = new BarcodeDetector({ formats: fm });
              for (const m of sizes) {
                const r = await d.detect(m ? canv(m) : bmp);
                const v = r.map(b => (b.rawValue || '').trim()).find(x => x);
                if (v) return v;
              }
            }
          } catch (e) {}
        }
        // احتياطي (آيفون مثلاً): مكتبة zxing نفس اللي الكاميرا بتستخدمها
        try {
          if (!window.ZXingWASM) await new Promise((ok, no) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js';
            s.onload = ok; s.onerror = no; document.head.append(s);
          });
          const zf = { qr_code: 'QRCode', ean_13: 'EAN-13', ean_8: 'EAN-8', upc_a: 'UPC-A', upc_e: 'UPC-E',
            code_128: 'Code128', code_39: 'Code39', code_93: 'Code93', itf: 'ITF', codabar: 'Codabar' };
          for (const m of [1600, 0]) {
            const c = canv(m);
            const img = c.getContext('2d').getImageData(0, 0, c.width, c.height);
            const r = await ZXingWASM.readBarcodes(img, { formats: want.map(x => zf[x]), tryHarder: true, maxNumberOfSymbols: 1 });
            const v = r.map(b => (b.text || '').trim()).find(x => x);
            if (v) return v;
          }
        } catch (e) {}
        return '';
      },
      // الدخول بالبصمة (WebAuthn): البصمة بتتأكد على الموبايل نفسه، والتطبيق بيفتح الحساب المحفوظ عليه
      async bioCan() {
        try { return window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable() ? 'yes' : 'no'; }
        catch (e) { return 'no'; }
      },
      bioHas(u) { try { return localStorage.getItem('mdqBio:' + u) ? '1' : ''; } catch (e) { return ''; } },
      bioOff(u) { try { localStorage.removeItem('mdqBio:' + u); } catch (e) {} },
      async bioEnable(u, name) {
        try {
          const rnd = n => crypto.getRandomValues(new Uint8Array(n));
          const cred = await navigator.credentials.create({ publicKey: {
            challenge: rnd(32), rp: { name: 'مدقق' },
            user: { id: rnd(16), name: u, displayName: name || u },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
            timeout: 60000, attestation: 'none' } });
          const id = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
          localStorage.setItem('mdqBio:' + u, id);
          return 'ok';
        } catch (e) { return (e && e.name === 'NotAllowedError') ? 'cancel' : 'error:' + (e && e.name || e); }
      },
      async bioCheck(u) {
        try {
          const id = localStorage.getItem('mdqBio:' + u);
          if (!id) return 'none';
          const raw = Uint8Array.from(atob(id), c => c.charCodeAt(0));
          await navigator.credentials.get({ publicKey: {
            challenge: crypto.getRandomValues(new Uint8Array(32)),
            allowCredentials: [{ type: 'public-key', id: raw, transports: ['internal'] }],
            userVerification: 'required', timeout: 60000 } });
          return 'ok';
        } catch (e) { return (e && e.name === 'NotAllowedError') ? 'cancel' : 'error:' + (e && e.name || e); }
      },
      swCheck(force, ms) {
        return new Promise(res => {
          const c = navigator.serviceWorker && navigator.serviceWorker.controller;
          if (!c) return res(null);
          const ch = new MessageChannel();
          const t = setTimeout(() => res(null), ms || 120000);
          ch.port1.onmessage = ev => { clearTimeout(t); res(!!(ev.data && ev.data.updated)); };
          try { c.postMessage({ type: 'mdq-check', force: !!force }, [ch.port2]); } catch (e) { clearTimeout(t); res(null); }
        });
      },
      // أي غلط من المتصفح بيتترجم لكلام عربي مفهوم (مفيش إنجليزي يظهر للموظف)
      arErr(e) {
        const n = (e && e.name) || '', m = ((e && e.message) || String(e || '')).toLowerCase();
        if (n === 'NotAllowedError' || m.includes('gesture')) return 'المتصفح محتاج تدوس على الزرار بإيدك - دوس تاني';
        if (n === 'AbortError') return 'اتلغت';
        if (n === 'DataError' || n === 'TypeError' && m.includes('share')) return 'المتصفح ده مش بيقبل يبعت الملف ده';
        if (m.includes('fetch') || m.includes('network')) return 'النت فاصل أو ضعيف - اتأكد من النت وجرّب تاني';
        return 'حصلت مشكلة في المشاركة - جرّب تاني';
      },
      // رسالة صفرا فوق بسبب فشل المشاركة (بالعربي)
      shareWhy(msg) {
        const t = document.createElement('div');
        t.dir = 'rtl';
        t.style.cssText = 'position:fixed;left:12px;right:12px;top:70px;z-index:2147483647;background:#fff3cd;color:#5c4400;border:1px solid #e0b84c;border-radius:14px;padding:12px;font:15px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.2)';
        t.textContent = '⚠️ ' + msg + ' (دوس هنا يقفل)';
        t.onclick = () => t.remove();
        document.body.append(t);
        setTimeout(() => t.remove(), 15000);
      },
      // يفتح المشاركة - ولو المتصفح عاوز دوسة جديدة: يطلع زرار كبير يفتحها من الدوسة
      // بيرجع: shared / cancel / unsupported
      async _share(data, label) {
        try { await navigator.share(data); return 'shared'; }
        catch (e) {
          if (e && e.name === 'AbortError') return 'cancel';
          if (e && e.name === 'NotAllowedError') return await mdq.shareTap(data, label);
          mdq.shareWhy(mdq.arErr(e));
          return 'cancel';
        }
      },
      // مشاركة ملف (واتساب...) - لو المتصفح مش بيقبل الإكسل بنجرب نسخة CSV
      async shareFile(name, mime, bytes, csvName, csvBytes, text) {
        if (!navigator.share || !navigator.canShare) return 'unsupported';
        // CSV الأول: كل المتصفحات بتقبل تشاركه (وبيتفتح على الإكسل) - الإكسل نفسه كروم بيرفضه
        const cands = [];
        if (csvBytes && csvBytes.length) cands.push(new File([csvBytes.slice()], csvName, { type: 'text/csv' }));
        cands.push(new File([bytes.slice()], name, { type: mime }));
        for (const f of cands) {
          let ok = false;
          try { ok = navigator.canShare({ files: [f] }); } catch (e) {}
          if (!ok) continue;
          return await mdq._share({ files: [f], title: text, text: text }, text);
        }
        return 'unsupported';
      },
      // كذا ملف مرة واحدة (صور / PDF): shareAdd لكل ملف وبعدين shareGo
      _pend: [],
      shareAdd(name, mime, bytes) { mdq._pend.push(new File([bytes.slice()], name, { type: mime })); },
      async shareGo(text) {
        const files = mdq._pend; mdq._pend = [];
        if (!files.length) return 'cancel';
        if (!navigator.share || !navigator.canShare) return 'unsupported';
        let ok = false;
        try { ok = navigator.canShare({ files }); } catch (e) {}
        if (!ok) return 'unsupported';
        return await mdq._share({ files, title: text, text: text }, text);
      },
      // مشاركة كلام (رسالة واتساب) - لو مفيش مشاركة في المتصفح: يفتح واتساب على طول
      async shareText(text) {
        if (!navigator.share) { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); return 'shared'; }
        return await mdq._share({ text: text }, 'الرسالة جاهزة');
      },
      shareTap(data, text) {
        return new Promise(resolve => {
          const bg = document.createElement('div');
          bg.dir = 'rtl';
          bg.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif';
          const box = document.createElement('div');
          box.style.cssText = 'background:#fff;border-radius:22px;padding:22px 18px;width:min(86vw,360px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)';
          box.innerHTML = '<div style="font-size:44px">✅</div><div style="font-size:20px;font-weight:800;margin:6px 0 4px">جاهز</div>' +
            '<div style="color:#555;font-size:15px;margin-bottom:16px;white-space:pre-line;max-height:30vh;overflow:auto"></div>';
          box.children[2].textContent = (text || '').slice(0, 200);
          const go = document.createElement('button');
          go.textContent = '📤 ابعت / شارك';
          go.style.cssText = 'width:100%;height:54px;border:0;border-radius:16px;background:#25D366;color:#fff;font-size:18px;font-weight:800;margin-bottom:8px';
          const no = document.createElement('button');
          no.textContent = 'رجوع';
          no.style.cssText = 'width:100%;height:44px;border:0;border-radius:14px;background:#eef2f6;color:#333;font-size:16px';
          box.append(go, no);
          bg.append(box);
          document.body.append(bg);
          const done = r => { bg.remove(); resolve(r); };
          no.onclick = () => done('cancel');
          go.onclick = () => {
            navigator.share(data)
              .then(() => done('shared'))
              .catch(e => {
                if (e && e.name === 'AbortError') return done('cancel');
                mdq.shareWhy(mdq.arErr(e));
                done('unsupported');
              });
          };
        });
      }
    };
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    // ---- لو نزلت نسخة جديدة وهو فاتح: شريط "فيه تحديث جديد" تحت ----
    (function () {
      let base = null, shown = false;
      const ver = () => fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(j => j.version + '+' + j.build_number).catch(() => null);
      async function check() {
        const v = await ver();
        if (!v) return;
        if (base === null) { base = v; return; }
        if (v === base || shown) return;
        shown = true;
        const b = document.createElement('div');
        b.dir = 'rtl';
        b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:16px;z-index:2147483646;background:#0b5cad;color:#fff;border-radius:16px;padding:14px 16px;font:bold 16px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;cursor:pointer';
        b.innerHTML = '<span style="font-size:24px">🔄</span><span style="flex:1">فيه تحديث جديد للتطبيق - دوس هنا</span><span style="background:#fff;color:#0b5cad;border-radius:10px;padding:6px 12px">تحديث</span>';
        b.onclick = () => mdq.update();
        document.body.append(b);
      }
      // النسخة الجديدة اتنزلت في الخلفية: شريط «فيه تحديث جاهز» (الفتح عليها لحظي لأنها متخزنة)
      function ready() {
        if (shown) return;
        shown = true;
        const b = document.createElement('div');
        b.dir = 'rtl';
        b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:16px;z-index:2147483646;background:#0b5cad;color:#fff;border-radius:16px;padding:14px 16px;font:bold 16px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;cursor:pointer';
        b.innerHTML = '<span style="font-size:24px">🔄</span><span style="flex:1">فيه تحديث جديد جاهز - دوس هنا</span><span style="background:#fff;color:#0b5cad;border-radius:10px;padding:6px 12px">تحديث</span>';
        b.onclick = () => { const u = new URL(location.href); u.searchParams.set('v', Date.now()); location.replace(u.toString()); };
        document.body.append(b);
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.type === 'mdq-updated') ready(); });
      }
      const tick = async (force) => {
        // التطبيق شغال بالنظام الجديد: الـ service worker هو اللي بيجيب التحديث
        if (navigator.serviceWorker && navigator.serviceWorker.controller) { if (await mdq.swCheck(force, 180000)) ready(); return; }
        // أول فتحة خالص: الـ service worker لسه متسطب - يخزّن النسخة دي علشان المرة الجاية تفتح على طول
        try {
          const reg = navigator.serviceWorker && await navigator.serviceWorker.ready;
          if (reg && reg.active) reg.active.postMessage({ type: 'mdq-check', force: true });
        } catch (e) {}
        check();
      };
      // بعد ما التطبيق يفتح بس (علشان التنزيل ما يبطّأش الفتح)
      let started = false;
      const start = () => { if (started) return; started = true; setTimeout(() => tick(true), 3000); };
      window.addEventListener('flutter-first-frame', start, { once: true });
      setTimeout(start, 300000);
      setInterval(() => { if (started) tick(false); }, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (started && document.visibilityState === 'visible') tick(false); });
    })();

    // ---- زرار "ثبّت التطبيق" تحت (بيختفي لو التطبيق متثبت أو الموظف قفله) ----
    (function () {
      const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      let evt = null;
      const KEY = 'mdq-install-hidden';
      const hiddenRecently = () => { try { return Date.now() - Number(localStorage.getItem(KEY) || 0) < 3 * 86400000; } catch (e) { return false; } };
      function bar() {
        if (standalone() || hiddenRecently() || document.getElementById('mdqInstall')) return;
        if (!evt && !ios) return;
        const d = document.createElement('div');
        d.id = 'mdqInstall';
        d.setAttribute('dir', 'rtl');
        d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9999;' +
          'background:#0B4F94;color:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;' +
          'padding:10px 12px;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px';
        d.innerHTML = '<img src="icons/Icon-192.png" alt="" style="width:40px;height:40px;border-radius:10px;background:#fff">' +
          '<div style="flex:1;line-height:1.4"><b>ثبّت التطبيق على موبايلك</b><br><span style="font-size:13px;opacity:.85">يفتح من الأيقونة زي أي تطبيق</span></div>' +
          '<button id="mdqInstallGo" style="border:0;border-radius:12px;background:#fff;color:#0B4F94;font-weight:bold;font-size:15px;padding:10px 14px;font-family:inherit">ثبّت</button>' +
          '<button id="mdqInstallX" aria-label="قفل" style="border:0;background:transparent;color:#fff;font-size:22px;padding:4px 6px">×</button>';
        document.body.appendChild(d);
        document.getElementById('mdqInstallX').onclick = () => { try { localStorage.setItem(KEY, Date.now()); } catch (e) {} d.remove(); };
        document.getElementById('mdqInstallGo').onclick = async () => {
          if (evt) {
            evt.prompt();
            const r = await evt.userChoice.catch(() => null);
            if (r && r.outcome === 'accepted') d.remove();
            evt = null;
            return;
          }
          // آيفون: نشرح الطريقة
          const h = document.createElement('div');
          h.setAttribute('dir', 'rtl');
          h.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(8,25,45,.6);display:flex;align-items:flex-end;justify-content:center';
          h.innerHTML = '<div style="background:#fff;color:#0B3D6E;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:min(520px,100%);line-height:1.9;font-family:-apple-system,Tahoma,sans-serif;font-size:16px">' +
            '<b style="font-size:18px">ثبّت التطبيق على الآيفون</b><br>1- افتح الصفحة دي من <b>Safari</b><br>2- دوس زرار المشاركة <b>⬆️</b> اللي تحت<br>' +
            '3- اختار <b>"إضافة إلى الشاشة الرئيسية"</b> وبعدين <b>إضافة</b>' +
            '<div style="text-align:center;margin-top:12px"><button style="border:0;border-radius:12px;background:#1479D3;color:#fff;font-weight:bold;font-size:16px;padding:10px 28px">تمام</button></div></div>';
          h.onclick = (e) => { if (e.target === h || e.target.tagName === 'BUTTON') h.remove(); };
          document.body.appendChild(h);
        };
      }
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); evt = e; bar(); });
      window.addEventListener('appinstalled', () => { const d = document.getElementById('mdqInstall'); if (d) d.remove(); });
      if (ios) setTimeout(bar, 4000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
